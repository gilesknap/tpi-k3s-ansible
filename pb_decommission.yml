# Decommission playbook — tears down the K3s cluster.
#
# Data preservation (default):
#   * NFS-backed app data and backups on the NAS survive (never touched).
#   * Local PV data under /home/k8s-data (nuc2) and /var/lib/k8s-data/*
#     (RK1s) is PRESERVED — the rebuild re-binds the same local-nvme PVs
#     to the same PVCs so stateful apps come back with their data intact.
#
# Clean-slate opt-in:
#   Pass -e wipe_local_data=true to also wipe /home/k8s-data and
#   /var/lib/k8s-data — use this only for a genuine fresh start.
#
# Usage:
#   ansible-playbook pb_decommission.yml
#   ansible-playbook pb_decommission.yml -e wipe_local_data=true
#
# The playbook is idempotent — safe to re-run if interrupted.
#
# Key insight: ArgoCD reconciliation must be stopped BEFORE scaling down
# workloads, otherwise ArgoCD re-creates them faster than we can remove them.

# ---------------------------------------------------------------------------
# Play 0: Stop the etcd backup
# ---------------------------------------------------------------------------
# roles/etcd_backup installs a nightly timer on the control plane, and a
# former control plane may still have one. Stop it before anything is torn
# down, so no backup snapshots a half-removed cluster (and rotates a good
# bundle out of the NAS) or runs against a half-removed k3s. The rebuild
# re-enables it on the control plane.
- name: Stop the etcd backup
  hosts: all_nodes
  gather_facts: false
  become: true
  tasks:
    # The uninstall in Play 4 keys on this name, so a typo would leave the
    # k3s server running while Play 5 deletes /var/lib/rancher.
    - name: Check control_plane names an inventory node
      ansible.builtin.assert:
        that:
          - control_plane in groups['all_nodes']
        fail_msg: >-
          control_plane ({{ control_plane }}) in group_vars/all.yml is not
          in the all_nodes inventory group.
        quiet: true

    - name: Check for the etcd backup timer
      ansible.builtin.stat:
        path: /etc/systemd/system/k3s-etcd-backup.timer
      register: decommission_etcd_backup_timer

    - name: Check for the etcd backup service
      ansible.builtin.stat:
        path: /etc/systemd/system/k3s-etcd-backup.service
      register: decommission_etcd_backup_service

    - name: Stop and disable the etcd backup timer
      ansible.builtin.systemd_service:
        name: k3s-etcd-backup.timer
        state: stopped
        enabled: false
      when: decommission_etcd_backup_timer.stat.exists

    - name: Stop the etcd backup service
      ansible.builtin.systemd_service:
        name: k3s-etcd-backup.service
        state: stopped
      when: decommission_etcd_backup_service.stat.exists

# ---------------------------------------------------------------------------
# Play 1: Stop ArgoCD reconciliation (orphan cascade)
# ---------------------------------------------------------------------------
- name: Stop ArgoCD reconciliation
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Delete all ArgoCD applications (orphan cascade)
      ansible.builtin.command:
        cmd: >-
          kubectl delete applications.argoproj.io --all
          -n argo-cd --cascade=orphan --timeout=60s
      changed_when: true
      failed_when: false

    - name: Verify no ArgoCD applications remain
      ansible.builtin.command:
        cmd: kubectl get applications.argoproj.io -n argo-cd --no-headers
      register: apps_check
      until: apps_check.stdout == ""
      retries: 6
      delay: 5
      changed_when: false
      failed_when: false

    # Orphan cascade can leave apps with ArgoCD finalizers that block deletion
    - name: Strip finalizers from any remaining ArgoCD applications
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          kubectl get applications.argoproj.io -n argo-cd -o name 2>/dev/null |
          xargs -r -n1 -I{} kubectl patch {} -n argo-cd --type=merge
          -p '{"metadata":{"finalizers":null}}'
        executable: /bin/bash
      changed_when: true
      failed_when: false

    - name: Strip finalizers from ArgoCD AppProjects
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          kubectl get appprojects.argoproj.io -n argo-cd -o name 2>/dev/null |
          xargs -r -n1 -I{} kubectl patch {} -n argo-cd --type=merge
          -p '{"metadata":{"finalizers":null}}'
        executable: /bin/bash
      changed_when: true
      failed_when: false

# ---------------------------------------------------------------------------
# Play 2: Scale down stateful workloads and delete chart-owned PVCs
# ---------------------------------------------------------------------------
# The PVCs are re-created cleanly on the next ArgoCD sync and re-bound to
# the existing static local-nvme PVs (whose data is preserved on-disk).
- name: Scale down workloads and delete chart-owned PVCs
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Scale down monitoring workloads
      kubernetes.core.k8s_scale:
        api_version: apps/v1
        kind: "{{ item.kind }}"
        name: "{{ item.name }}"
        namespace: monitoring
        replicas: 0
      loop:
        - { kind: Deployment, name: grafana-prometheus-kube-pr-operator }
        - { kind: StatefulSet, name: alertmanager-grafana-prometheus-kube-pr-alertmanager }
        - { kind: StatefulSet, name: grafana-prometheus }
        - { kind: StatefulSet, name: prometheus-grafana-prometheus-kube-pr-prometheus }
      failed_when: false

    # Gracefully, so Litestream makes its last sync of the database (on the
    # pod's emptyDir) to the NFS replica before the pod goes (ADR 0013).
    # Deleting the namespace instead would still stop it gracefully, but
    # nothing would wait for it.
    - name: Scale down scrap
      kubernetes.core.k8s_scale:
        api_version: apps/v1
        kind: Deployment
        name: scrap
        namespace: scrap
        replicas: 0
      failed_when: false

    - name: Wait for the scrap pod to stop
      ansible.builtin.command:
        cmd: >-
          kubectl -n scrap wait --for=delete pod
          -l app.kubernetes.io/name=scrap --timeout=120s
      changed_when: false
      failed_when: false

    - name: Wait for pods to terminate
      ansible.builtin.pause:
        seconds: 30

    - name: Delete chart-owned stateful PVCs
      kubernetes.core.k8s:
        api_version: v1
        kind: PersistentVolumeClaim
        name: "{{ item.name }}"
        namespace: "{{ item.ns }}"
        state: absent
      loop:
        - { ns: monitoring, name: prometheus-grafana-prometheus-kube-pr-prometheus-db-prometheus-grafana-prometheus-kube-pr-prometheus-0 }
        - { ns: monitoring, name: storage-grafana-prometheus-0 }
      failed_when: false

# ---------------------------------------------------------------------------
# Play 3: Remove ArgoCD and remaining namespaces
# ---------------------------------------------------------------------------
- name: Remove ArgoCD and cluster services
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Uninstall ArgoCD Helm release
      ansible.builtin.command:
        cmd: helm uninstall argocd -n argo-cd
      changed_when: true
      failed_when: false

    - name: Strip finalizers from remaining argo-cd resources
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          for kind in appprojects.argoproj.io applicationsets.argoproj.io; do
            kubectl get "$kind" -n argo-cd -o name 2>/dev/null |
            xargs -r -n1 -I{} kubectl patch {} -n argo-cd --type=merge
            -p '{"metadata":{"finalizers":null}}';
          done
        executable: /bin/bash
      changed_when: true
      failed_when: false

    - name: Delete argo-cd namespace
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: argo-cd
        state: absent
      failed_when: false

    - name: Wait for argo-cd namespace to terminate
      ansible.builtin.command:
        cmd: kubectl get namespace argo-cd
      register: argocd_ns
      until: argocd_ns.rc != 0
      retries: 18
      delay: 10
      changed_when: false
      failed_when: false

    # Never list a namespace holding nfs-stable PVCs (the default class, e.g.
    # minecraft): deleting a PVC archives its NAS folder, and the claim
    # re-created after the rebuild would then start empty instead of finding
    # its data.
    - name: Clean up remaining app namespaces
      ansible.builtin.command:
        cmd: "kubectl delete namespace {{ item }} --timeout=60s"
      loop:
        - argo-rollouts
        - argocd-monitor
        - backups
        - cert-manager
        - cloudflared
        - echo
        - headlamp
        - ingress-nginx
        - monitoring
        - oauth2-proxy
      changed_when: true
      failed_when: false

    - name: Wait for namespaces to terminate
      ansible.builtin.pause:
        seconds: 30

# ---------------------------------------------------------------------------
# Play 4: Uninstall k3s — workers first, then control plane
# ---------------------------------------------------------------------------
# The control plane is control_plane in group_vars/all.yml, never a
# position in the inventory. Every uninstall is guarded by `removes:` on
# its script, so a node with neither script (k3s already uninstalled)
# skips them all. A node with both scripts gets both. Nothing may keep a
# k3s server or agent running into Play 5, which deletes /var/lib/rancher.
#
# Each k3s uninstall script stops short of its full cleanup (the k3s
# binary, killall script, kubectl/crictl/ctr links, /etc/rancher/k3s,
# /var/lib/kubelet) while any other /etc/systemd/system/k3s*.service
# exists. That is how a node with both a server and an agent keeps the
# shared files for the second script, but this repo adds two more such
# units: k3s-apparmor-profile.service (roles/k3s, every node) and
# k3s-etcd-backup.service (roles/etcd_backup, control plane). Remove them
# first so the scripts finish; the rebuild's k3s and etcd_backup roles
# install them again.
- name: Remove the units this repo adds beside k3s
  hosts: all_nodes
  gather_facts: false
  become: true
  tasks:
    - name: Check for the added k3s units
      ansible.builtin.stat:
        path: /etc/systemd/system/{{ item }}
      loop:
        - k3s-apparmor-profile.service
        - k3s-etcd-backup.timer
        - k3s-etcd-backup.service
      register: decommission_extra_units

    # Stopping the AppArmor unit does not unload the profile (it has no
    # ExecStop), so the running k3s is unaffected until it is uninstalled.
    - name: Stop and disable the added k3s units
      ansible.builtin.systemd_service:
        name: "{{ item.item }}"
        state: stopped
        enabled: false
      loop: "{{ decommission_extra_units.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists

    - name: Remove the added k3s unit files
      ansible.builtin.file:
        path: /etc/systemd/system/{{ item.item }}
        state: absent
      loop: "{{ decommission_extra_units.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists
      notify: Reload systemd

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

- name: Uninstall k3s from worker nodes
  hosts: all_nodes
  gather_facts: false
  become: true
  serial: 1
  order: reverse_sorted
  tasks:
    - name: Run k3s-agent-uninstall.sh on workers
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s-agent-uninstall.sh
        removes: /usr/local/bin/k3s-agent-uninstall.sh
      when: inventory_hostname != control_plane

    # A stale server install, e.g. on a former control plane.
    - name: Run k3s-uninstall.sh on workers that still have a server install
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s-uninstall.sh
        removes: /usr/local/bin/k3s-uninstall.sh
      when: inventory_hostname != control_plane

- name: Uninstall k3s from the control plane
  hosts: all_nodes
  gather_facts: false
  become: true
  tasks:
    - name: Run k3s-uninstall.sh on the control plane
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s-uninstall.sh
        removes: /usr/local/bin/k3s-uninstall.sh
      when: inventory_hostname == control_plane

    # A stale agent install on the control plane, run after the server is
    # gone so it cannot leave a kubelet running into Play 5.
    - name: Run k3s-agent-uninstall.sh on the control plane if it has one
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s-agent-uninstall.sh
        removes: /usr/local/bin/k3s-agent-uninstall.sh
      when: inventory_hostname == control_plane

# ---------------------------------------------------------------------------
# Play 5: Node cleanup
# ---------------------------------------------------------------------------
- name: Clean up node state
  hosts: all_nodes
  gather_facts: false
  become: true
  tasks:
    # Backstop for Play 4: never delete k3s state under a running k3s.
    # systemd_service with only a name changes nothing and reports the
    # unit's ActiveState ("inactive" for a unit that does not exist); a
    # unit that is starting, stopping or reloading counts as running.
    # Skipped in check mode, where Play 4 uninstalls nothing.
    - name: Check no k3s server or agent is still running
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      loop:
        - k3s.service
        - k3s-agent.service
      register: decommission_k3s_state
      failed_when: >-
        decommission_k3s_state.status.ActiveState | default('inactive')
        in ['active', 'activating', 'deactivating', 'reloading']
      when: not ansible_check_mode

    # A file-module delete descends into mount points, so a directory with
    # anything still mounted below it (a bind-mounted local PV under
    # /var/lib/kubelet, say) is never deleted: the node fails instead.
    # This lists every mount and filters by path, because
    # `findmnt -R <dir>` prints nothing when <dir> is not itself a mount
    # point, however much is mounted below it. Skipped in check mode,
    # where k3s is still running and its mounts are still there.
    - name: List mounts
      ansible.builtin.command:
        cmd: findmnt --raw --noheadings --output TARGET
      register: decommission_mounts
      changed_when: false
      when: not ansible_check_mode

    - name: Check nothing is mounted under the k3s state directories
      ansible.builtin.assert:
        that:
          - decommission_mounts.stdout_lines | select('match', item ~ '(/|$)') | list | length == 0
        fail_msg: >-
          Still mounted under {{ item }} on {{ inventory_hostname }}:
          {{ decommission_mounts.stdout_lines | select('match', item ~ '(/|$)') | list }}.
          Not deleting it; unmount them or reboot the node, then re-run.
        quiet: true
      loop:
        - /var/lib/rancher
        - /var/lib/kubelet
      when: not ansible_check_mode

    - name: Remove /var/lib/rancher and /var/lib/kubelet
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/rancher
        - /var/lib/kubelet

    - name: Check the kubectl, crictl and ctr links
      ansible.builtin.stat:
        path: /usr/local/bin/{{ item }}
      loop:
        - kubectl
        - crictl
        - ctr
      register: decommission_k3s_links

    - name: Remove the kubectl, crictl and ctr links that point at k3s
      ansible.builtin.file:
        path: "{{ item.stat.path }}"
        state: absent
      loop: "{{ decommission_k3s_links.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - item.stat.islnk | default(false)
        - item.stat.lnk_source == '/usr/local/bin/k3s'

    # What the uninstall scripts remove, for a node whose scripts are
    # already gone but left these behind (e.g. a run before the added
    # units were removed first).
    - name: Remove leftover k3s binary, killall script and config
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/bin/k3s
        - /usr/local/bin/k3s-killall.sh
        - /etc/rancher/k3s

    - name: Remove leftover device-mapper devices
      ansible.builtin.shell:
        cmd: set -o pipefail && dmsetup ls --target=verity 2>/dev/null | awk '{print $1}' | xargs -r -n1 dmsetup remove
        executable: /bin/bash
      changed_when: true
      failed_when: false

    # Destructive opt-in: wipe local PV data roots. OFF by default — the
    # whole point of the local-nvme plan is that these paths survive a
    # rebuild so stateful apps come back with their data intact.
    # Pass -e wipe_local_data=true only for a genuine clean-slate rebuild.
    - name: Wipe local k8s data directories (destructive, opt-in)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /home/k8s-data
        - /var/lib/k8s-data
      when: wipe_local_data | default(false) | bool
