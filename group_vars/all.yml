# Description:
# This file contains variables common to all the hosts in the inventory.

# The user to create on each node for access by ansible
ansible_account: "ansible"
# The user used to connect to the tpi BMC(s)
tpi_user: root
# A path to some storage on the tpi BMC(s) used for downloading os images
tpi_images_path: /mnt/sdcard/images
# ansible vault password file
vault_password_file: "~/.ansible_vault_password"

# location of binaries we install in the execution environment
bin_dir: "{{ lookup('ansible.builtin.env', 'BIN_DIR', default='${HOME}/bin') }}"

# control_plane_ip is set as a fact at the start of the k3s role (roles/k3s/tasks/main.yml)
# It cannot be defined here because hostvars is not available during group_vars evaluation.

# The k3s minor line (e.g. v1.34). Installs take the newest patch release
# of this line, and system-upgrade-controller keeps nodes on it after that.
# It is read from `k3s.minor` in kubernetes-services/values.yaml so ArgoCD
# and Ansible share one setting: edit it there, not here.
k3s_minor: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/kubernetes-services/values.yaml') | from_yaml).k3s.minor }}"

# override on command line to make flashing of turing pi nodes happen
# (note that any node that is turned off in tpi will get flashed)
# passing flash_force=true will also force re-flash of already-running nodes
do_flash: "{{ (flash_force | default(force_flash | default(false))) | bool }}"

################################################################################
# EDIT BELOW ###################################################################
# The remaining variables are for personalization of the cluster ###############
################################################################################

local_domain: .lan # suffix the known_hosts role uses to look up node IPs
# known_hosts files the known_hosts role keeps current. The system-wide
# file is what the Claude sandbox reads (its $HOME is a fresh tmpfs, so it
# has no ~/.ssh); ~/.ssh/known_hosts is kept too because a stale entry in
# any file ssh reads causes a host-key mismatch error. Writing /etc needs
# root (the devcontainer runs as root); when running as another user,
# override with -e '{"known_hosts_files": ["~/.ssh/known_hosts"]}'.
known_hosts_files:
  - "~/.ssh/known_hosts"
  - /etc/ssh/ssh_known_hosts
control_plane: node02 # the node name of the (single) control plane
# Stable name for the Kubernetes API (port 6443). Agents join it, the
# server certificate carries it as a SAN, and the exported kubeconfig uses
# it, so moving the control plane to another node means changing
# control_plane above and pointing this name at the new node. Make it a
# DNS record on your router (or other LAN DNS) that resolves to the
# control plane's IP; the k3s role checks it does before changing
# anything. AAAA records are fine if they are the control plane's too.
# Without LAN DNS, set it to the control plane's IPv4 address instead; an
# IPv6 literal does not work (the role builds https://<name>:6443 unbracketed).
k3s_api_name: k3s.lan
# SSH target of the router that serves k3s_api_name, used only by
# `just k3s-api-dns <ip>` (scripts/k3s-api-dns). It must be an OpenWrt
# router whose dnsmasq is managed with uci; with any other LAN DNS, create
# the record by hand instead and leave this unused.
dns_router: root@192.168.1.1
# age public key (age1...) for the nightly encrypted etcd backup
# (roles/etcd_backup). Only the public key belongs here: the private key
# stays offline with the cluster owner, so nothing on the cluster can
# decrypt the backups. While empty, the backup job fails loudly and
# uploads nothing. See docs/how-to/backup-restore.md.
etcd_backup_age_recipient: "age13c5tkz4n35adg7vy73c4lk2tj5av2t8sgwy8u60uwx3ue5n5j95sly0x20"
cluster_domain: gkcluster.org # the DNS name for the cluster control plane node
domain_email: giles.knap@gilesk.gkcluster.org # the email address for letsencrypt

# Admin emails for ArgoCD RBAC mapping (Ansible-rendered templates).
# Must be kept in sync with admin_emails in kubernetes-services/values.yaml.
admin_emails:
  - gilesknap@gmail.com
  - giles.knap@diamond.ac.uk
# where argocd will get the cluster configuration from
repo_remote: https://github.com/gilesknap/tpi-k3s-ansible.git
# Single source of truth for branch tracking. Change this and run
# ansible-playbook pb_all.yml --tags cluster to switch branches.
# The root app passes this down to all child apps via valuesObject.
repo_branch: main

# Set nvidia_gpu_node: true in host_vars/<nodename>.yml (or inline in hosts.yml)
# for any node that has an NVIDIA GPU. This triggers NVIDIA container toolkit
# installation and containerd runtime configuration so that GPU pods can run.
# The default is false — safe to leave unset on non-GPU nodes.
nvidia_gpu_node: false

# List of features to install into the cluster, comment out to remove.
# Each entry must match the name of a tasks yaml file in the cluster role.
# This is for direct installs before ArgoCD is used to manage the cluster.
cluster_install_list:
  - argocd # the remaining services are all managed by argocd at present

# Host directories that back the local-nvme PVs. Created by the
# k8s_data_dirs role on each app's target node. Paths live outside
# /var/lib/rancher on purpose: pb_decommission.yml wipes
# /var/lib/rancher to reset k3s, but these directories are preserved
# so PVC data survives a cluster rebuild.
#
# SYNC: each entry's `node` and `path` MUST match the corresponding
# entry in `local_storage` in kubernetes-services/values.yaml. The two
# files are intentionally separate (Ansible vs Helm), but the
# node/path pair is the contract between them — if they drift, the
# PV's nodeAffinity will point at a directory that doesn't exist.
#
# UID/GID notes: grafana (472) and prometheus (1000/2000) come from
# the live cluster's effective securityContext.
#
# Modes: every pod here has an fsGroup, so kubelet makes the volume's root
# setgid and group-writable (0755 becomes 2775, 0750 becomes 2770; with
# fsGroupChangePolicy OnRootMismatch, only if it is not so already). Each
# mode here is that result, so Ansible and kubelet agree and the task
# stays unchanged on re-runs.
#
# Removing an entry here only stops Ansible creating the directory; it
# never deletes existing data.
k8s_data_dirs:
  - name: prometheus
    node: node04
    path: /var/lib/k8s-data/prometheus
    owner: "1000"
    group: "2000"
    mode: "2775"
  - name: grafana
    node: node04
    path: /var/lib/k8s-data/grafana
    owner: "472"
    group: "472"
    mode: "2775"
  # scrap's pre-Litestream data, now a frozen copy (ADR 0013).
  - name: scrap
    node: nuc2
    path: /home/k8s-data/scrap
    owner: "10001"
    group: "10001"
    mode: "2770"
  # Nightly copy of scrap's newest backup run off the NAS.
  - name: scrap-backup-copy
    node: nuc2
    path: /home/k8s-data/scrap-backup-copy
    owner: "10001"
    group: "10001"
    mode: "2770"
