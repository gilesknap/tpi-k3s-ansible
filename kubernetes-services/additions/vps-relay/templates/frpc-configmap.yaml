# frpc.toml generated from .Values.forwards: one frp proxy per port, with
# remotePort = localPort. frps on the VPS must list the same ports in
# allowPorts, or it refuses them (see docs/how-to/vps-relay.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: vps-relay-frpc
data:
  frpc.toml: |
    serverAddr = {{ .Values.vpsTailnetHost | quote }}
    serverPort = {{ .Values.frpPort }}
    # Keep retrying while the Tailscale sidecar is still joining the tailnet.
    loginFailExit = false
    # The token comes from the Secret via the environment, not this ConfigMap.
    auth.method = "token"
    auth.token = "{{ "{{" }} .Envs.FRP_AUTH_TOKEN {{ "}}" }}"
    # Reach the VPS only through the Tailscale sidecar's SOCKS5 proxy.
    transport.proxyURL = "socks5://127.0.0.1:1055"
    transport.tls.enable = true
    log.to = "console"
    log.level = "info"
{{- /* Every check fails the render: a bad frpc.toml would crash-loop the
       only replica and take down every forward, not just the broken one. */}}
{{- $seen := dict }}
{{- range .Values.forwards }}
{{- $fwd := . }}
{{- $name := toString (required "vps_relay: every forward needs a name" .name) }}
{{- if not (regexMatch "^[a-z0-9][a-z0-9-]*$" $name) }}
{{- fail (printf "vps_relay forward %q: name must be lowercase letters, digits and dashes" $name) }}
{{- end }}
{{- if hasKey $seen $name }}
{{- fail (printf "vps_relay forward %q: duplicate name" $name) }}
{{- end }}
{{- $_ := set $seen $name true }}
{{- $target := toString (required (printf "vps_relay forward %q: target is required" $name) .target) }}
{{- if not (has .protocol (list "tcp" "udp")) }}
{{- fail (printf "vps_relay forward %q: protocol must be tcp or udp, not %q" $name (toString .protocol)) }}
{{- end }}
{{- $range := splitList "-" (toString .ports) }}
{{- $min := index $range 0 | int }}
{{- $max := index $range (sub (len $range) 1) | int }}
{{- if or (gt (len $range) 2) (lt $min 1) (gt $min $max) (gt $max 65535) }}
{{- fail (printf "vps_relay forward %q: bad ports %q (want N or N-M)" $name (toString .ports)) }}
{{- end }}
{{- range $port := untilStep $min (add1 $max | int) 1 }}

    [[proxies]]
    name = {{ printf "%s-%s-%d" $name $fwd.protocol $port | quote }}
    type = "{{ $fwd.protocol }}"
    localIP = {{ $target | quote }}
    localPort = {{ $port }}
    remotePort = {{ $port }}
{{- end }}
{{- end }}
