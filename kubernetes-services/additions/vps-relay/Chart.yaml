apiVersion: v2
name: vps-relay
description: |
  Exposes chosen cluster ports on a VPS's public IP without the VPS ever
  connecting into the home network. frpc dials out to frps on the VPS
  through a Tailscale userspace sidecar; frps publishes each forward's
  ports and relays them back down that tunnel.
  See docs/how-to/vps-relay.md.
type: application
version: 0.1.0
