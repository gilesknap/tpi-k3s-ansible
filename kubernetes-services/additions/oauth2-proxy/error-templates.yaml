apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy-error-templates
  namespace: oauth2-proxy
data:
  error.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Access Denied</title>
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          background: #0f172a;
          color: #e0e0e0;
          min-height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
          padding: 2rem 1rem;
        }
        .container {
          text-align: center;
          max-width: 480px;
        }
        .icon {
          font-size: 4rem;
          margin-bottom: 1.5rem;
          opacity: 0.7;
        }
        h1 {
          font-size: 1.8rem;
          font-weight: 300;
          color: #ffffff;
          letter-spacing: 0.05em;
          margin-bottom: 1rem;
        }
        .message {
          font-size: 1rem;
          color: #94a3b8;
          line-height: 1.6;
          margin-bottom: 2rem;
        }
        .card {
          background: #1e293b;
          border: 1px solid #334155;
          border-radius: 8px;
          padding: 1.25rem;
          margin-bottom: 1.5rem;
        }
        .card p {
          font-size: 0.85rem;
          color: #94a3b8;
          line-height: 1.4;
        }
        .code {
          display: inline-block;
          background: #1e293b;
          border: 1px solid #334155;
          border-radius: 4px;
          padding: 0.2rem 0.6rem;
          font-family: monospace;
          font-size: 0.9rem;
          color: #2dd4bf;
        }
        a {
          color: #38bdf8;
          text-decoration: none;
          transition: color 0.2s;
        }
        a:hover {
          color: #2dd4bf;
        }
      </style>
    </head>
    <body>
      <div class="container">
        <div class="icon">&#x1f512;</div>
        <h1>Access Denied</h1>
        <div class="card">
          <p>
            This service is restricted to cluster administrators.
            If you believe you should have access, contact the cluster admin.
          </p>
        </div>
        <p class="message">
          <span class="code">{{.StatusCode}}</span>
        </p>
        <a href="javascript:history.back()">&#8592; Go back</a>
      </div>
    </body>
    </html>
  # Shown by oauth2-proxy to a browser with no session. Behind Cilium's
  # Gateway (ADR 0016) it comes back as the ExternalAuth filter's answer to
  # the request for the app's own URL, so the browser is still at that URL.
  # It does what ingress-nginx's auth-signin annotation does: send the
  # browser to oauth2.<cluster_domain>/oauth2/start with rd set to where it
  # was. Login always starts on the oauth2 host, as that is the GitHub OAuth
  # app's callback. Its host is worked out from the page's own: every app is
  # one label below the cluster domain. On the oauth2 host itself the page
  # keeps oauth2-proxy's own redirect. oauth2-proxy checks rd against
  # whitelist-domain whatever the page sends.
  sign_in.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Signing in</title>
      <style>
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          background: #0f172a;
          color: #94a3b8;
          min-height: 100vh;
          margin: 0;
          display: flex;
          justify-content: center;
          align-items: center;
        }
        a {
          color: #38bdf8;
        }
      </style>
    </head>
    <body>
      <p>Signing in with {{.ProviderName}}&hellip; <a id="go" href="{{.ProxyPrefix}}/start?rd={{.Redirect}}">continue</a></p>
      <script>
        (function () {
          var host = location.hostname;
          var auth = "oauth2." + host.slice(host.indexOf(".") + 1);
          var rd = host === auth ? {{.Redirect}} : location.href;
          var url = "https://" + auth + {{.ProxyPrefix}} + "/start?rd=" + encodeURIComponent(rd);
          document.getElementById("go").href = url;
          location.replace(url);
        })();
      </script>
    </body>
    </html>
