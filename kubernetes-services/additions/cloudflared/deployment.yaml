---
# cloudflared — remotely managed Cloudflare tunnel.
# All routing rules (public hostnames → services) are configured in the
# Cloudflare Zero Trust dashboard, not here. This pod just connects outward
# to Cloudflare using the tunnel token stored in the cloudflared-credentials
# SealedSecret (see tunnel-secret.yaml for how to generate it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  replicas: 2
  # The anti-affinity below needs a free node for every pod, so replace pods
  # one at a time instead of surging a third.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      # The two tunnel connectors never share a node.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: cloudflared
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.11.0
          # `tunnel run` reads its --token flag from the TUNNEL_TOKEN env var,
          # so the token is not passed in args and stays out of the process
          # command line (which /debug/vars on the metrics port exposed
          # before 2026.10.4).
          args:
            - tunnel
            - --no-autoupdate
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-credentials
                  key: TUNNEL_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /ready
              port: 20241
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
# Drains evict one connector at a time; the other keeps the tunnel up.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: cloudflared
