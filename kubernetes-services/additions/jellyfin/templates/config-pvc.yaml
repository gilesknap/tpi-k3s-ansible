{{- /*
The claim for Jellyfin's /config (database, metadata, plugins, XML config),
pre-bound by volumeName to the static local-nvme PV from additions/local-storage
(local_storage.jellyfin), so it binds at once, also after a rebuild. The PV
pins the pod to its node. Prune=false,Delete=false: neither a prune nor an
Application delete removes the claim, so the PV never goes Released.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.config.claim }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-nvme
  volumeName: {{ .Values.config.volume }}
  resources:
    requests:
      storage: {{ .Values.config.size }}
