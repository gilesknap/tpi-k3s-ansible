apiVersion: v2
name: jellyfin-extras
description: |
  Cluster-side extras for Jellyfin (the app itself is the upstream
  jellyfin/jellyfin chart): the claim for the static local-nvme config
  volume, the static read-only NFS volume of the media library, and the
  scripts of the one-off seed from a host install. See
  docs/how-to/jellyfin.md.
type: application
version: 0.1.0
