# Defaults for standalone `helm template` rendering. In-cluster ArgoCD
# overrides these via the parent chart's valuesObject (see
# kubernetes-services/templates/jellyfin.yaml).

# The scripts of the one-off seed from a host install (files/), as a
# ConfigMap for the pod's init containers. On while jellyfin.seed_from_host is.
seed:
  enabled: false
  configmap: jellyfin-seed-scripts

# The config claim, bound to the static local-nvme PV that
# additions/local-storage renders from local_storage.jellyfin.
config:
  claim: jellyfin-config
  volume: jellyfin-local
  size: 60Gi

# The media library on the NAS, mounted read-only.
media:
  claim: jellyfin-media
  volume: jellyfin-media-nfs
  server: 192.168.1.3
  path: /bigdisk/media
  # A nominal size: NFS ignores it, but a PV and its claim must state one.
  size: 4Ti
