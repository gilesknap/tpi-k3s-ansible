# The namespace for scrap's public pages site (the scrap chart's `public`
# section, in templates/scrap.yaml). The chart expects it to exist first
# (public.createNamespace is left false), and Argo CD's CreateNamespace=true
# only creates the Application's destination namespace (scrap). Labelled Pod
# Security "restricted", as the chart requires.
apiVersion: v1
kind: Namespace
metadata:
  name: scrap-public
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
