apiVersion: v2
name: scrap-extras
description: |
  Cluster-side extras for scrap (the app itself is the chart in the scrap
  repository): the /mcp-only Ingress that bypasses oauth2-proxy, the
  SealedSecret carrying the Claude API key, and for public pages the
  scrap-public namespace and the upload token SealedSecret in both
  namespaces, the static NFS volumes for data and backups, the nightly
  off-NAS backup copy, and the one-off move from the local volume. See
  docs/how-to/scrap.md.
type: application
version: 0.1.0
