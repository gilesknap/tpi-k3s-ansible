{{- $sources := include "secrets-backup.sources" . | fromJsonArray }}
# The backup script and the list of Secrets it exports. The script is kept
# in files/ so it can be run and tested outside the cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: secrets-backup
  namespace: backups
data:
  secrets-backup.sh: |-
{{ .Files.Get "files/secrets-backup.sh" | indent 4 }}
  # file|namespace|names|selector|name_suffix|min
  sources: |
{{- range $sources }}
    {{ .file }}|{{ .namespace }}|{{ join "," (.names | default list) }}|{{ .selector | default "" }}|{{ .name_suffix | default "" }}|{{ .min | default 0 }}
{{- end }}
