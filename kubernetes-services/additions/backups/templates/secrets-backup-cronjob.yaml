# Nightly age-encrypted export of the Secrets that are not in git (see
# values.yaml secrets_backup and docs/how-to/backup-restore.md).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: secrets-backup
  namespace: backups
spec:
  schedule: {{ .Values.secrets_backup.schedule | quote }}
  timeZone: {{ .Values.secrets_backup.time_zone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # Also fails the Job (and so alerts) if the pod cannot start, e.g.
      # when backups/secrets is missing on the NAS.
      activeDeadlineSeconds: 1200
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: secrets-backup
          # The API token is mounted into the backup container only (see
          # kube-api-access below), not into the initContainer that
          # downloads age.
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # Fetch the age release binary for this node's architecture and
            # refuse it unless its sha256 matches the pinned sum.
            - name: fetch-age
              image: alpine/k8s:1.34.12@sha256:d50424976a0a888d2531f13035dce45c004ec2b6f877f233005ba35c0d61be5d
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  case $(uname -m) in
                    x86_64) arch=amd64 sum=$AGE_SHA256_AMD64 ;;
                    aarch64) arch=arm64 sum=$AGE_SHA256_ARM64 ;;
                    *) echo "unsupported architecture $(uname -m)" >&2; exit 1 ;;
                  esac
                  tgz=/tools/age.tar.gz
                  curl -fsSL -o "$tgz" \
                    "https://github.com/FiloSottile/age/releases/download/$AGE_VERSION/age-$AGE_VERSION-linux-$arch.tar.gz"
                  echo "$sum  $tgz" | sha256sum -c -
                  mkdir /tools/x
                  tar -xzf "$tgz" -C /tools/x age/age
                  mv /tools/x/age/age /tools/age
                  rm -rf /tools/x "$tgz"
                  /tools/age --version
              env:
                - name: AGE_VERSION
                  value: {{ .Values.secrets_backup.age.version | quote }}
                - name: AGE_SHA256_AMD64
                  value: {{ .Values.secrets_backup.age.sha256.amd64 | quote }}
                - name: AGE_SHA256_ARM64
                  value: {{ .Values.secrets_backup.age.sha256.arm64 | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: tools
                  mountPath: /tools
          containers:
            - name: backup
              image: alpine/k8s:1.34.12@sha256:d50424976a0a888d2531f13035dce45c004ec2b6f877f233005ba35c0d61be5d
              command: [/bin/bash, /scripts/secrets-backup.sh]
              env:
                - name: AGE_RECIPIENT
                  value: {{ .Values.backup_age_recipient | quote }}
                - name: AGE
                  value: /tools/age
                - name: KEEP
                  value: {{ .Values.secrets_backup.keep | quote }}
                - name: SOURCES
                  value: /scripts/sources
                - name: DEST
                  value: /backup
                - name: WORK
                  value: /work
                # kubectl's discovery cache, also in the RAM-backed volume.
                - name: HOME
                  value: /work
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tools
                  mountPath: /tools
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: nfs
                  mountPath: /backup
                  subPath: backups/secrets
                - name: kube-api-access
                  mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: secrets-backup
            - name: tools
              emptyDir:
                sizeLimit: 64Mi
            # tar needs its members as files, so the exported YAML is staged
            # here: RAM-backed (tmpfs), never written to a disk, and gone
            # with the pod. Its size counts against the memory limit.
            - name: work
              emptyDir:
                medium: Memory
                sizeLimit: 32Mi
            - name: nfs
              persistentVolumeClaim:
                claimName: k8s-cluster-nfs
            - name: kube-api-access
              projected:
                defaultMode: 0444
                sources:
                  - serviceAccountToken:
                      path: token
                      expirationSeconds: 3600
                  - configMap:
                      name: kube-root-ca.crt
                      items:
                        - key: ca.crt
                          path: ca.crt
                  - downwardAPI:
                      items:
                        - path: namespace
                          fieldRef:
                            fieldPath: metadata.namespace
