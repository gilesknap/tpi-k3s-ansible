# Alerts for the nightly secrets backup, from kube-state-metrics' Job and
# CronJob metrics. See docs/how-to/backup-restore.md.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: secrets-backup
  namespace: backups
  labels:
    release: grafana-prometheus
  annotations:
    # On a fresh cluster the CRD arrives with the grafana-prometheus app.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - name: secrets-backup
      rules:
        # A secrets-backup Job that failed (or is failing with no pod
        # succeeded yet), unless it started before the last successful run,
        # so an old failed Job kept in the history does not keep firing.
        - alert: SecretsBackupFailed
          expr: |-
            max by (namespace, job_name) (
              (kube_job_failed{namespace="backups", job_name=~"secrets-backup-.+", condition="true"} == 1)
              or
              (
                (kube_job_status_failed{namespace="backups", job_name=~"secrets-backup-.+"} > 0)
                unless on (namespace, job_name)
                (kube_job_status_succeeded{namespace="backups", job_name=~"secrets-backup-.+"} > 0)
              )
            )
            unless on (namespace, job_name)
            (
              kube_job_status_start_time{namespace="backups", job_name=~"secrets-backup-.+"}
              < on (namespace) group_left ()
              kube_cronjob_status_last_successful_time{namespace="backups", cronjob="secrets-backup"}
            )
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: The secrets backup Job {{ "{{" }} $labels.job_name {{ "}}" }} failed.
            description: >-
              No encrypted secrets bundle was written to the NAS. Check
              `kubectl -n backups logs job/{{ "{{" }} $labels.job_name {{ "}}" }}`
              (all containers) and `kubectl -n backups describe
              job/{{ "{{" }} $labels.job_name {{ "}}" }}`.
        - alert: SecretsBackupStale
          expr: >-
            time() - kube_cronjob_status_last_successful_time{namespace="backups", cronjob="secrets-backup"}
            > 36 * 3600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: No encrypted secrets backup has succeeded for over 36 hours.
            description: >-
              The last successful secrets-backup run was
              {{ "{{" }} $value | humanizeDuration {{ "}}" }} ago.
        # No success recorded at all: the CronJob is new, has never
        # succeeded, or is missing.
        - alert: SecretsBackupNeverSucceeded
          expr: >-
            absent(kube_cronjob_status_last_successful_time{namespace="backups", cronjob="secrets-backup"})
          for: 36h
          labels:
            severity: warning
          annotations:
            summary: The secrets backup CronJob has no successful run.
            description: >-
              backups/secrets-backup has not completed a run in 36 hours, or
              the CronJob does not exist. Check
              `kubectl -n backups get cronjob,jobs`.
