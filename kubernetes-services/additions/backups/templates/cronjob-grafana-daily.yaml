apiVersion: batch/v1
kind: CronJob
metadata:
  name: grafana-daily
  namespace: backups
spec:
  # 00:35 Europe/London: clear of the k3s upgrade (01:00) and kured (02:30)
  # windows, both of which drain nodes, and before offsite-backup (05:30).
  schedule: "35 0 * * *"
  timeZone: Europe/London
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          # Pinned to the node hosting the grafana local PV.
          nodeSelector:
            kubernetes.io/hostname: {{ .Values.local_storage.grafana.node }}
          # Grafana's uid and gid, which own its data (grafana.db is 0660):
          # the volume is mounted read-only, and the NAS directories are
          # 0777, so the job needs no root.
          securityContext:
            runAsUser: {{ .Values.grafana.uid }}
            runAsGroup: {{ .Values.grafana.gid }}
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sqlite-backup
              image: {{ .Values.grafana.image }}
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  stamp=$(date +%F_%H%M)
                  # Use sqlite3's online .backup for a consistent snapshot
                  # rather than copying grafana.db while it may be written.
                  sqlite3 /data/grafana.db ".backup /work/grafana.db"
                  tar -czf "/backup/${stamp}.tar.gz" \
                    -C /work grafana.db \
                    -C /data provisioning 2>/dev/null || \
                  tar -czf "/backup/${stamp}.tar.gz" -C /work grafana.db
                  ls -lh /backup
                  find /backup -maxdepth 1 -type f -name '*.tar.gz' -mtime +7 -delete
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: nfs
                  mountPath: /backup
                  subPath: backups/grafana
          volumes:
            - name: data
              hostPath:
                path: {{ .Values.local_storage.grafana.path }}
                type: Directory
            - name: work
              emptyDir:
                sizeLimit: 1Gi
            - name: nfs
              persistentVolumeClaim:
                claimName: k8s-cluster-nfs
