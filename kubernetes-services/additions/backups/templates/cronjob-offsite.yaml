{{- /*
The off-site copy: each night, new backups from the NAS go to Google Drive,
age-encrypted to offsite_backup.age_recipient (the cluster holds only that
public key). Only ever adds dated files; a deletion on the NAS is never
mirrored. See docs/how-to/backup-restore.md ("Off-site copy to Google Drive").

Three containers run side by side, as the owners the NAS files need (its
export squashes root to 65534, so no single uid can read everything):
  - backups (uid 65534, nobody: the owner of the root-written, mode 0600
    etcd bundles): the backups/ tree but for the run_dirs
    (files/offsite-backups.sh others);
  - scrap (offsite_backup.scrap.uid, scrap's: the files of its backup runs
    are its own, many mode 0600): the run_dirs subtrees of backups/
    (files/offsite-backups.sh runs). Each of these two reads, cleans up and
    prunes only its own part of backups/ on Drive;
  - minecraft (uid 1000, the dashboard's and the worlds' owner: level.dat is
    0600): the dashboard store, the worlds and the archive
    (files/offsite-minecraft.sh).
An init container first makes the Drive folders, so no two race to make
the same one. The Job fails if any container does, and is retried once. A retry uploads only the backups still missing, and no second
Minecraft nightly if one from the same UTC day is already on Drive.

rclone's credentials are the Secret offsite_backup.secret_name, sealed by
scripts/seal-rclone-drive: a [drive] remote with the drive.file scope, so it
sees only files it made itself.
*/}}
{{- $o := .Values.offsite_backup }}
{{- if $o.enabled }}
{{- $mc := $o.minecraft }}
{{- $folders := list "backups" }}
{{- range $o.backups.run_dirs }}
{{- $folders = append $folders (printf "backups/%s" .) }}
{{- end }}
{{- if $mc.enabled }}
{{- $folders = concat $folders (list "minecraft/nightly" "minecraft/archive") }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: offsite-backup-scripts
  namespace: backups
data:
  offsite-lib.sh: |
{{ .Files.Get "files/offsite-lib.sh" | indent 4 }}
  offsite-folders.sh: |
{{ .Files.Get "files/offsite-folders.sh" | indent 4 }}
  offsite-backups.sh: |
{{ .Files.Get "files/offsite-backups.sh" | indent 4 }}
{{- if $mc.enabled }}
  offsite-minecraft.sh: |
{{ .Files.Get "files/offsite-minecraft.sh" | indent 4 }}
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: offsite-backup
  namespace: backups
spec:
  schedule: {{ $o.schedule | quote }}
  timeZone: {{ $o.time_zone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  # One failed Job kept, for a day: an old failed Job would keep the stock
  # KubeJobFailed alert firing after later successes. The CronJob's
  # last-success time, which OffsiteBackupStale reads, is kept on the
  # CronJob itself.
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: offsite-backup
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      # The first run uploads everything (several GB); later runs only the
      # night's new files. A run cut off here is finished by the next one.
      activeDeadlineSeconds: {{ mul (int $o.deadline_hours) 3600 }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: offsite-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # age is not in the rclone image: fetch the pinned release for
            # this node's architecture and check it against its checksum.
            - name: install-age
              image: alpine:3.24
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  case $(uname -m) in
                    x86_64) arch=amd64 sha={{ $o.age.sha256.amd64 }} ;;
                    aarch64) arch=arm64 sha={{ $o.age.sha256.arm64 }} ;;
                    *) echo "no age checksum for $(uname -m)" >&2; exit 1 ;;
                  esac
                  version={{ $o.age.version }}
                  tarball=age-v$version-linux-$arch.tar.gz
                  wget -q -O "/tools/$tarball" \
                    "https://github.com/FiloSottile/age/releases/download/v$version/$tarball"
                  echo "$sha  /tools/$tarball" | sha256sum -c -
                  tar -xzf "/tools/$tarball" -C /tools --strip-components=1 age/age
                  rm "/tools/$tarball"
                  /tools/age --version
              securityContext:
                runAsUser: {{ $o.backups.uid }}
                runAsGroup: {{ $o.backups.uid }}
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: tools
                  mountPath: /tools
            - name: make-folders
              image: {{ $o.image }}
              command:
                - /bin/sh
                - /scripts/offsite-folders.sh
              env:
                - name: WORK
                  value: /work/folders
                - name: FOLDERS
                  value: {{ join " " $folders | quote }}
                {{- include "offsite-backup.env" . | nindent 16 }}
              securityContext:
                runAsUser: {{ $o.backups.uid }}
                runAsGroup: {{ $o.backups.uid }}
                {{- include "offsite-backup.containerSecurity" . | nindent 16 }}
              resources:
                {{- include "offsite-backup.resources" . | nindent 16 }}
              volumeMounts:
                {{- include "offsite-backup.mounts" . | nindent 16 }}
          containers:
            - name: backups
              image: {{ $o.image }}
              command:
                - /bin/sh
                - /scripts/offsite-backups.sh
                - others
              env:
                - name: SRC
                  value: /src/backups
                - name: WORK
                  value: /work/backups
                - name: RUN_DIRS
                  value: {{ join " " $o.backups.run_dirs | quote }}
                - name: EXCLUDE
                  value: {{ join " " $o.backups.exclude | quote }}
                - name: PRUNE_DAYS
                  value: {{ $o.backups.prune_days | quote }}
                - name: KEEP_MIN
                  value: {{ $o.backups.keep_min | quote }}
                {{- include "offsite-backup.env" . | nindent 16 }}
              securityContext:
                runAsUser: {{ $o.backups.uid }}
                runAsGroup: {{ $o.backups.uid }}
                {{- include "offsite-backup.containerSecurity" . | nindent 16 }}
              resources:
                {{- include "offsite-backup.resources" . | nindent 16 }}
              volumeMounts:
                - name: nfs
                  mountPath: /src/backups
                  subPath: backups
                  readOnly: true
                {{- include "offsite-backup.mounts" . | nindent 16 }}
            {{- if $o.backups.run_dirs }}
            - name: scrap
              image: {{ $o.image }}
              command:
                - /bin/sh
                - /scripts/offsite-backups.sh
                - runs
              env:
                - name: SRC
                  value: /src/backups
                - name: WORK
                  value: /work/scrap
                - name: RUN_DIRS
                  value: {{ join " " $o.backups.run_dirs | quote }}
                - name: EXCLUDE
                  value: {{ join " " $o.backups.exclude | quote }}
                - name: PRUNE_DAYS
                  value: {{ $o.backups.prune_days | quote }}
                - name: KEEP_MIN
                  value: {{ $o.backups.keep_min | quote }}
                {{- include "offsite-backup.env" . | nindent 16 }}
              securityContext:
                runAsUser: {{ $o.scrap.uid }}
                runAsGroup: {{ $o.scrap.gid }}
                {{- include "offsite-backup.containerSecurity" . | nindent 16 }}
              resources:
                {{- include "offsite-backup.resources" . | nindent 16 }}
              volumeMounts:
                # The whole backups/ tree, as the backups container has it: a
                # subPath per run_dir would have the kubelet make any that is
                # missing (or fail the pod). The script reads only the
                # run_dirs.
                - name: nfs
                  mountPath: /src/backups
                  subPath: backups
                  readOnly: true
                {{- include "offsite-backup.mounts" . | nindent 16 }}
            {{- end }}
            {{- if $mc.enabled }}
            - name: minecraft
              image: {{ $o.image }}
              command:
                - /bin/sh
                - /scripts/offsite-minecraft.sh
              env:
                - name: WORK
                  value: /work/minecraft
                - name: WORLD_DIRS
                  value: {{ join " " $mc.world_dirs | quote }}
                - name: ARCHIVE
                  value: {{ ternary "true" "false" (not (empty $mc.archive_path)) | quote }}
                - name: KEEP
                  value: {{ $mc.keep | quote }}
                - name: MIN_SIZE_PERCENT
                  value: {{ $mc.min_size_percent | quote }}
                {{- include "offsite-backup.env" . | nindent 16 }}
              securityContext:
                runAsUser: {{ $mc.uid }}
                runAsGroup: {{ $mc.gid }}
                {{- include "offsite-backup.containerSecurity" . | nindent 16 }}
              resources:
                {{- include "offsite-backup.resources" . | nindent 16 }}
              volumeMounts:
                - name: nfs
                  mountPath: /src/store
                  subPath: {{ $mc.store_subdir }}
                  readOnly: true
                - name: worlds
                  mountPath: /src/stable
                  readOnly: true
                {{- if $mc.archive_path }}
                - name: archive
                  mountPath: /src/archive
                  readOnly: true
                {{- end }}
                {{- include "offsite-backup.mounts" . | nindent 16 }}
            {{- end }}
          volumes:
            - name: nfs
              persistentVolumeClaim:
                claimName: k8s-cluster-nfs
                readOnly: true
            {{- if $mc.enabled }}
            - name: worlds
              nfs:
                server: {{ $mc.worlds_server | quote }}
                path: {{ $mc.worlds_path | quote }}
                readOnly: true
            {{- if $mc.archive_path }}
            - name: archive
              nfs:
                server: {{ .Values.nfs.server | quote }}
                path: {{ $mc.archive_path | quote }}
                readOnly: true
            {{- end }}
            {{- end }}
            - name: rclone
              secret:
                secretName: {{ $o.secret_name }}
                # Read by every container's user; nothing else runs in the pod.
                defaultMode: 0444
            - name: scripts
              configMap:
                name: offsite-backup-scripts
                defaultMode: 0555
            - name: tools
              emptyDir:
                sizeLimit: 64Mi
            - name: work
              emptyDir:
                sizeLimit: 256Mi
{{- end }}
