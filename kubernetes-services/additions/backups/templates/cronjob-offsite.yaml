{{- /*
The off-site copies: each night, new backups from the NAS go to each target,
age-encrypted to offsite_backup.age_recipient (the cluster holds only that
public key). Only ever adds dated files; a deletion on the NAS is never
mirrored. See docs/how-to/backup-restore.md ("Off-site copy to Google Drive" and
"Second off-site copy: Backblaze B2").

One CronJob per target, each with its own rclone Secret, so a failure on
one shows as that CronJob's (and alerts by its name) and never stops the
other's uploads:
  - offsite-backup: Google Drive (offsite_backup.drive_root), Secret
    offsite_backup.secret_name, sealed by scripts/seal-rclone-drive: a
    [drive] remote with the drive.file scope, so it sees only files it made.
  - offsite-backup-b2, only with offsite_backup.b2.enabled: a Backblaze B2
    bucket with Object Lock (compliance mode), Secret
    offsite_backup.b2.secret_name, sealed by scripts/seal-b2-offsite: a [b2]
    remote whose key is restricted to that bucket. No key can delete or
    overwrite a version there before its retention ends.
Each target's `include` picks what it gets: backups (the NAS backups/ tree),
minecraft-nightly, minecraft-archive. The scripts and the encryption are
the same for both.

Up to three containers run side by side, as the owners the NAS files need
(its export squashes root to 65534, so no single uid can read everything):
  - backups (uid 65534, nobody: the owner of the root-written, mode 0600
    etcd bundles): the backups/ tree but for the run_dirs
    (files/offsite-backups.sh others);
  - scrap (offsite_backup.scrap.uid, scrap's: the files of its backup runs
    are its own, many mode 0600): the run_dirs subtrees of backups/
    (files/offsite-backups.sh runs). Each of these two reads, cleans up and
    prunes only its own part of backups/ on the target;
  - minecraft (uid 1000, the dashboard's and the worlds' owner: level.dat is
    0600): the dashboard store and the worlds (the nightly tarball) and the
    archive (files/offsite-minecraft.sh).
On Drive an init container first makes the folders, so no two race to make
the same one (B2 has no folders). The Job fails if any container does, and
is retried once. A retry uploads only the backups still missing, and no
second Minecraft nightly if one from the same UTC day is already there.
*/}}
{{- $o := .Values.offsite_backup }}
{{- $mc := $o.minecraft }}
{{- $targets := list }}
{{- if $o.enabled }}
{{- $targets = append $targets (dict "name" "offsite-backup" "kind" "drive" "root" (printf "drive:%s" $o.drive_root) "secret" $o.secret_name "include" $o.include "prune_days" $o.backups.prune_days "schedule" $o.schedule) }}
{{- if $o.b2.enabled }}
{{- $bucket := required "offsite_backup.b2.bucket is required with offsite_backup.b2.enabled" $o.b2.bucket }}
{{- $b2prune := $o.backups.prune_days }}
{{- if not (kindIs "invalid" $o.b2.prune_days) }}
{{- if ne (toString $o.b2.prune_days) "" }}
{{- $b2prune = $o.b2.prune_days }}
{{- end }}
{{- end }}
{{- $targets = append $targets (dict "name" "offsite-backup-b2" "kind" "b2" "root" (printf "b2:%s" $bucket) "secret" $o.b2.secret_name "include" $o.b2.include "prune_days" $b2prune "schedule" (default $o.schedule $o.b2.schedule)) }}
{{- end }}
{{- end }}
{{- range $targets }}
{{- range .include }}
{{- if not (has . (list "backups" "minecraft-nightly" "minecraft-archive")) }}
{{- fail (printf "offsite_backup: unknown include entry %q (backups, minecraft-nightly, minecraft-archive)" .) }}
{{- end }}
{{- end }}
{{- end }}
{{- if $targets }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: offsite-backup-scripts
  namespace: backups
data:
  offsite-lib.sh: |
{{ .Files.Get "files/offsite-lib.sh" | indent 4 }}
  offsite-folders.sh: |
{{ .Files.Get "files/offsite-folders.sh" | indent 4 }}
  offsite-backups.sh: |
{{ .Files.Get "files/offsite-backups.sh" | indent 4 }}
{{- if $mc.enabled }}
  offsite-minecraft.sh: |
{{ .Files.Get "files/offsite-minecraft.sh" | indent 4 }}
{{- end }}
{{- end }}
{{- range $t := $targets }}
{{- $ctx := dict "o" $o "t" $t }}
{{- $backups := has "backups" $t.include }}
{{- $nightly := and $mc.enabled (has "minecraft-nightly" $t.include) }}
{{- $archive := and $mc.enabled (has "minecraft-archive" $t.include) (not (empty $mc.archive_path)) }}
{{- $folders := list }}
{{- if $backups }}
{{- $folders = append $folders "backups" }}
{{- range $o.backups.run_dirs }}
{{- $folders = append $folders (printf "backups/%s" .) }}
{{- end }}
{{- end }}
{{- if $nightly }}
{{- $folders = append $folders "minecraft/nightly" }}
{{- end }}
{{- if $archive }}
{{- $folders = append $folders "minecraft/archive" }}
{{- end }}
{{- if not (or $backups $nightly $archive) }}
{{- fail (printf "offsite_backup: %s would upload nothing (check its include list and offsite_backup.minecraft)" $t.name) }}
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $t.name }}
  namespace: backups
spec:
  schedule: {{ $t.schedule | quote }}
  timeZone: {{ $o.time_zone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  # One failed Job kept, for a day: an old failed Job would keep the stock
  # KubeJobFailed alert firing after later successes. The CronJob's
  # last-success time, which OffsiteBackupStale reads, is kept on the
  # CronJob itself.
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $t.name }}
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      # The first run uploads everything (several GB); later runs only the
      # night's new files. A run cut off here is finished by the next one.
      activeDeadlineSeconds: {{ mul (int $o.deadline_hours) 3600 }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ $t.name }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # age is not in the rclone image: fetch the pinned release for
            # this node's architecture and check it against its checksum.
            - name: install-age
              image: alpine:3.24
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  case $(uname -m) in
                    x86_64) arch=amd64 sha={{ $o.age.sha256.amd64 }} ;;
                    aarch64) arch=arm64 sha={{ $o.age.sha256.arm64 }} ;;
                    *) echo "no age checksum for $(uname -m)" >&2; exit 1 ;;
                  esac
                  version={{ $o.age.version }}
                  tarball=age-v$version-linux-$arch.tar.gz
                  wget -q -O "/tools/$tarball" \
                    "https://github.com/FiloSottile/age/releases/download/v$version/$tarball"
                  echo "$sha  /tools/$tarball" | sha256sum -c -
                  tar -xzf "/tools/$tarball" -C /tools --strip-components=1 age/age
                  rm "/tools/$tarball"
                  /tools/age --version
              securityContext:
                runAsUser: {{ $o.backups.uid }}
                runAsGroup: {{ $o.backups.uid }}
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: tools
                  mountPath: /tools
            {{- if eq $t.kind "drive" }}
            - name: make-folders
              image: {{ $o.image }}
              command:
                - /bin/sh
                - /scripts/offsite-folders.sh
              env:
                - name: WORK
                  value: /work/folders
                - name: FOLDERS
                  value: {{ join " " $folders | quote }}
                {{- include "offsite-backup.env" $ctx | nindent 16 }}
              securityContext:
                runAsUser: {{ $o.backups.uid }}
                runAsGroup: {{ $o.backups.uid }}
                {{- include "offsite-backup.containerSecurity" . | nindent 16 }}
              resources:
                {{- include "offsite-backup.resources" . | nindent 16 }}
              volumeMounts:
                {{- include "offsite-backup.mounts" . | nindent 16 }}
            {{- end }}
          containers:
            {{- if $backups }}
            - name: backups
              image: {{ $o.image }}
              command:
                - /bin/sh
                - /scripts/offsite-backups.sh
                - others
              env:
                - name: SRC
                  value: /src/backups
                - name: WORK
                  value: /work/backups
                - name: RUN_DIRS
                  value: {{ join " " $o.backups.run_dirs | quote }}
                - name: EXCLUDE
                  value: {{ join " " $o.backups.exclude | quote }}
                - name: PRUNE_DAYS
                  value: {{ $t.prune_days | quote }}
                - name: KEEP_MIN
                  value: {{ $o.backups.keep_min | quote }}
                {{- include "offsite-backup.env" $ctx | nindent 16 }}
              securityContext:
                runAsUser: {{ $o.backups.uid }}
                runAsGroup: {{ $o.backups.uid }}
                {{- include "offsite-backup.containerSecurity" . | nindent 16 }}
              resources:
                {{- include "offsite-backup.resources" . | nindent 16 }}
              volumeMounts:
                - name: nfs
                  mountPath: /src/backups
                  subPath: backups
                  readOnly: true
                {{- include "offsite-backup.mounts" . | nindent 16 }}
            {{- end }}
            {{- if and $backups $o.backups.run_dirs }}
            - name: scrap
              image: {{ $o.image }}
              command:
                - /bin/sh
                - /scripts/offsite-backups.sh
                - runs
              env:
                - name: SRC
                  value: /src/backups
                - name: WORK
                  value: /work/scrap
                - name: RUN_DIRS
                  value: {{ join " " $o.backups.run_dirs | quote }}
                - name: EXCLUDE
                  value: {{ join " " $o.backups.exclude | quote }}
                - name: PRUNE_DAYS
                  value: {{ $t.prune_days | quote }}
                - name: KEEP_MIN
                  value: {{ $o.backups.keep_min | quote }}
                {{- include "offsite-backup.env" $ctx | nindent 16 }}
              securityContext:
                runAsUser: {{ $o.scrap.uid }}
                runAsGroup: {{ $o.scrap.gid }}
                {{- include "offsite-backup.containerSecurity" . | nindent 16 }}
              resources:
                {{- include "offsite-backup.resources" . | nindent 16 }}
              volumeMounts:
                # The whole backups/ tree, as the backups container has it: a
                # subPath per run_dir would have the kubelet make any that is
                # missing (or fail the pod). The script reads only the
                # run_dirs.
                - name: nfs
                  mountPath: /src/backups
                  subPath: backups
                  readOnly: true
                {{- include "offsite-backup.mounts" . | nindent 16 }}
            {{- end }}
            {{- if or $nightly $archive }}
            - name: minecraft
              image: {{ $o.image }}
              command:
                - /bin/sh
                - /scripts/offsite-minecraft.sh
              env:
                - name: WORK
                  value: /work/minecraft
                - name: NIGHTLY
                  value: {{ ternary "true" "false" $nightly | quote }}
                - name: WORLD_DIRS
                  value: {{ join " " $mc.world_dirs | quote }}
                - name: ARCHIVE
                  value: {{ ternary "true" "false" $archive | quote }}
                - name: KEEP
                  value: {{ $mc.keep | quote }}
                - name: MIN_SIZE_PERCENT
                  value: {{ $mc.min_size_percent | quote }}
                {{- include "offsite-backup.env" $ctx | nindent 16 }}
              securityContext:
                runAsUser: {{ $mc.uid }}
                runAsGroup: {{ $mc.gid }}
                {{- include "offsite-backup.containerSecurity" . | nindent 16 }}
              resources:
                {{- include "offsite-backup.resources" . | nindent 16 }}
              volumeMounts:
                {{- if $nightly }}
                - name: nfs
                  mountPath: /src/store
                  subPath: {{ $mc.store_subdir }}
                  readOnly: true
                - name: worlds
                  mountPath: /src/stable
                  readOnly: true
                {{- end }}
                {{- if $archive }}
                - name: archive
                  mountPath: /src/archive
                  readOnly: true
                {{- end }}
                {{- include "offsite-backup.mounts" . | nindent 16 }}
            {{- end }}
          volumes:
            - name: nfs
              persistentVolumeClaim:
                claimName: k8s-cluster-nfs
                readOnly: true
            {{- if $nightly }}
            - name: worlds
              nfs:
                server: {{ $mc.worlds_server | quote }}
                path: {{ $mc.worlds_path | quote }}
                readOnly: true
            {{- end }}
            {{- if $archive }}
            - name: archive
              nfs:
                server: {{ $.Values.nfs.server | quote }}
                path: {{ $mc.archive_path | quote }}
                readOnly: true
            {{- end }}
            - name: rclone
              secret:
                secretName: {{ $t.secret }}
                # Read by every container's user; nothing else runs in the pod.
                defaultMode: 0444
            - name: scripts
              configMap:
                name: offsite-backup-scripts
                defaultMode: 0555
            - name: tools
              emptyDir:
                sizeLimit: 64Mi
            - name: work
              emptyDir:
                sizeLimit: 256Mi
{{- end }}
