{{- $sources := include "secrets-backup.sources" . | fromJsonArray }}
# Read-only access for the secrets backup, one Role per source namespace.
# Named sources get `get` on exactly those Secrets. Label- or
# suffix-selected sources need `list`, which RBAC cannot narrow by label or
# name prefix: it is the only verb granted there, with no get or watch.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-backup
  namespace: backups
automountServiceAccountToken: false
{{- range $sources }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secrets-backup-{{ .file | trimSuffix ".yaml" }}
  namespace: {{ .namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
{{- if .names }}
    verbs: [get]
    resourceNames:
{{- range .names }}
      - {{ . }}
{{- end }}
{{- else }}
    verbs: [list]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secrets-backup-{{ .file | trimSuffix ".yaml" }}
  namespace: {{ .namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secrets-backup-{{ .file | trimSuffix ".yaml" }}
subjects:
  - kind: ServiceAccount
    name: secrets-backup
    namespace: backups
{{- end }}
