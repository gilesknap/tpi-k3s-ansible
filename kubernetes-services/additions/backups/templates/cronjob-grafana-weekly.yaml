apiVersion: batch/v1
kind: CronJob
metadata:
  name: grafana-weekly
  namespace: backups
spec:
  # Sundays 00:40 Europe/London, for the same reasons as grafana-daily.
  schedule: "40 0 * * 0"
  timeZone: Europe/London
  {{- if .Values.paused }}
  suspend: true
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: {{ .Values.local_storage.grafana.node }}
          # Grafana's uid and gid, which own its data (grafana.db is 0660):
          # the volume is mounted read-only, and the NAS directories are
          # owned by Grafana's uid, so the job needs no root.
          securityContext:
            runAsUser: {{ .Values.grafana.uid }}
            runAsGroup: {{ .Values.grafana.gid }}
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sqlite-backup
              image: {{ .Values.grafana.image }}
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  stamp=$(date +%F)
                  sqlite3 /data/grafana.db ".backup /work/grafana.db"
                  tar -czf "/backup/${stamp}.tar.gz" \
                    -C /work grafana.db \
                    -C /data provisioning 2>/dev/null || \
                  tar -czf "/backup/${stamp}.tar.gz" -C /work grafana.db
                  ls -lh /backup
                  find /backup -maxdepth 1 -type f -name '*.tar.gz' -mtime +28 -delete
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: nfs
                  mountPath: /backup
                  subPath: backups/grafana/weekly
          volumes:
            - name: data
              hostPath:
                path: {{ .Values.local_storage.grafana.path }}
                type: Directory
            - name: work
              emptyDir:
                sizeLimit: 1Gi
            - name: nfs
              persistentVolumeClaim:
                claimName: k8s-cluster-nfs
