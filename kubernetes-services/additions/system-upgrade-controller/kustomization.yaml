# Rancher system-upgrade-controller v0.20.2, vendored byte-identical from
# the upstream release assets so that a sync or rebuild does not depend on
# GitHub release downloads. Do not edit the vendored files.
# https://github.com/rancher/system-upgrade-controller/releases
#
# sha256 (matching the release's sha256sum-amd64.txt):
#   1fb061e0d8bf9534da0145e614a9e03ca376cd5d1adcca17d13cfa12e211c48c  crd.yaml
#   fd474b662d1f2b74ab150d95b6482869e1fd1f27ceee54b13e94b92292097969  system-upgrade-controller.yaml
#
# To upgrade: from this directory, set V to the new version, re-download
# both files and check them against the release's sha256sum-amd64.txt.
# Then update the version and hashes above, and the version in
# docs/reference/services.md:
#   V=vX.Y.Z
#   base=https://github.com/rancher/system-upgrade-controller/releases/download/$V
#   curl -fsSLO "$base/crd.yaml" -O "$base/system-upgrade-controller.yaml"
#   curl -fsSL "$base/sha256sum-amd64.txt" | sed 's|dist/artifacts/||' \
#     | sha256sum -c --ignore-missing
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - crd.yaml
  - system-upgrade-controller.yaml
