# Defaults for standalone `helm template` rendering. In-cluster ArgoCD
# overrides these via the parent chart's valuesObject (see
# kubernetes-services/templates/minecraft.yaml), driven by the `minecraft`
# block in kubernetes-services/values.yaml.
ddns:
  # Off until the cloudflare-ddns-token SealedSecret has been committed
  # as templates/cloudflare-ddns-secret.yaml.
  enabled: false
  # Fully qualified game hostname to keep pointed at the WAN IP.
  domain: mc.example.com
  # How often to re-check the WAN IP. Cloudflare is only called to write
  # when the address has changed.
  schedule: "*/5 * * * *"
