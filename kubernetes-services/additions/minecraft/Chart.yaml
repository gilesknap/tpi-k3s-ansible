apiVersion: v2
name: minecraft
description: |
  Cluster-side extras for the Minecraft dashboard (the dashboard itself is
  the OCI chart ghcr.io/gilesknap/charts/minecraft-dashboard).

  Holds the DDNS CronJob that keeps the DNS-only game hostname pointed at
  the current WAN IP, and the SealedSecret carrying its scoped Cloudflare
  API token. See docs/how-to/minecraft.md.
type: application
version: 0.1.0
