apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sysctl-tuning
  namespace: kube-system
  labels:
    app: sysctl-tuning
spec:
  selector:
    matchLabels:
      app: sysctl-tuning
  template:
    metadata:
      labels:
        app: sysctl-tuning
    spec:
      hostNetwork: true
      initContainers:
      - name: sysctl-init
        image: busybox:1.38
        command:
        - /bin/sh
        - -c
        - |
          sysctl -w net.core.rmem_max=7500000
          sysctl -w net.core.wmem_max=7500000
        securityContext:
          privileged: true
      containers:
      - name: sleep-container
        image: busybox:1.38
        command:
        - /bin/sh
        - -c
        - sleep infinity
