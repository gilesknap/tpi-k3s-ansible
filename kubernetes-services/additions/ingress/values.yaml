# Defaults for the per-app ingress sub-chart: one Gateway API HTTPRoute per
# app on Cilium's Gateway (templates/httproute.yaml, ADR 0016). Each
# Application that uses it sets name, cluster_domain, service_name,
# service_port, ssl_redirect and oauth2_proxy in its valuesObject.

# The namespace for the HTTPRoute, when it is not the Application's own: an
# HTTPRoute must sit beside its backend Service unless a ReferenceGrant allows
# otherwise. Empty means the release namespace.
namespace: ""

# The HTTPRoute's timeouts.request (ADR 0016). Empty leaves it out, so Envoy
# gives each request 15 s in all; an app that streams or runs long requests
# sets "0s", which turns that limit off.
gateway_request_timeout: ""

# The Gateway the HTTPRoutes attach to (additions/gateway).
gateway:
  name: web
  namespace: gateway
