# Defaults for standalone `helm template` rendering. The gateway Application
# (kubernetes-services/templates/gateway.yaml) sets the real values.

cluster_domain: example.com

# Namespaces whose HTTPRoutes may use oauth2-proxy as their ExternalAuth
# backend: the ReferenceGrant in templates/reference-grants.yaml. A gated app
# in a namespace missing here gets a 500 from every request (it fails
# closed). Empty when oauth2-proxy is off.
external_auth_namespaces: []
