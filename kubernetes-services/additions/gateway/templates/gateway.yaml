# The one Gateway. Cilium makes a LoadBalancer Service for it,
# cilium-gateway-web in this namespace, and its Envoy (the cilium-envoy
# DaemonSet) serves the listeners. In-cluster it is reached at
#   http://cilium-gateway-web.gateway.svc.cluster.local
# which is where every Cloudflare tunnel route points (local.gateway in
# cloudflare/locals.tf; docs/how-to/gateway.md). k3s's servicelb gives the
# Service ports 80 and 443 on the node addresses (the LAN, the tailnet and
# the VPS's /mcp), as it did ingress-nginx's.
#
# Port 80 is plain HTTP: cloudflared hands every tunnelled request over as
# HTTP. Port 443 serves the wildcard certificate, for clients that reach the
# Gateway directly on a node address.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web
spec:
  gatewayClassName: cilium-gateway
  infrastructure:
    # servicelb runs a svclb pod for this Service on every node that takes
    # workloads (not the tainted control plane or ws03), and lists those
    # nodes' addresses on the Service; Cilium then serves ports 80 and 443
    # on them. Phase 1 of ADR 0016 kept the Gateway off them, while
    # ingress-nginx held the ports, with the servicelb pool label
    # "gateway-standby", which no node is in. The label stays, set to "":
    # Cilium merges labels onto its Service and never removes one, and
    # servicelb treats an empty pool as no pool.
    # https://docs.k3s.io/networking/networking-services#creating-servicelb-node-pools
    # (pkg/cloudprovider/servicelb.go in k3s v1.34)
    labels:
      svccontroller.k3s.cattle.io/lbpool: ""
    # servicelb re-renders a Service's DaemonSet only when its annotations
    # change, not its labels (the cloud-provider service controller's
    # needsUpdate), so this annotation came with the label change, to move
    # a running cluster off the standby pool. It does nothing else.
    annotations:
      tpi-k3s-ansible/servicelb-pool: default
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.{{ .Values.cluster_domain }}"
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.{{ .Values.cluster_domain }}"
      tls:
        mode: Terminate
        certificateRefs:
          # The ReferenceGrant in reference-grants.yaml allows this.
          - kind: Secret
            name: wildcard-tls
            namespace: cert-manager
      allowedRoutes:
        namespaces:
          from: All
