# Only the in-cluster publisher pods (allowed_pods: Alertmanager, scrap) and
# Cilium's Gateway (gateway-network-policy.yaml) may reach the ntfy pod
# directly. This does not stop anything that can reach the Gateway (the
# internet via the tunnel, LAN and tailnet hosts via the node addresses, pods
# via its ClusterIP) from talking to ntfy through it: ntfy's token auth is
# the real gate, and through the Gateway a client can also set its own
# CF-Connecting-IP (see templates/configmap.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ntfy
  labels:
    app.kubernetes.io/name: ntfy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  policyTypes:
    - Ingress
  ingress:
    - from:
{{- range .Values.allowed_pods }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .labels | nindent 14 }}
{{- end }}
      ports:
        - protocol: TCP
          port: 8080
