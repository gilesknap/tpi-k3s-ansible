# Only the listed namespaces (ingress-nginx by default) may reach the ntfy
# pod directly. This does not stop anything that can reach ingress-nginx
# (the internet via the tunnel, LAN hosts via its LoadBalancer IPs, pods via
# its ClusterIP) from talking to ntfy through it: ntfy's token auth is the
# real gate, and through ingress-nginx a client can also set its own
# CF-Connecting-IP (see templates/configmap.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ntfy
  labels:
    app.kubernetes.io/name: ntfy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  policyTypes:
    - Ingress
  ingress:
    - from:
{{- range .Values.allowed_namespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
{{- end }}
      ports:
        - protocol: TCP
          port: 8080
