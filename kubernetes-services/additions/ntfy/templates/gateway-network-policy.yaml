# Cilium's Gateway (ADR 0016) reaches backends from Envoy, as the reserved
# "ingress" identity, which the NetworkPolicy beside this cannot name, so
# that policy alone would drop it. This admits that identity too, on the same
# port. Allow rules add up, so it widens that policy by the Gateway alone;
# ntfy's token auth stays the gate.
# https://docs.cilium.io/en/v1.20/network/servicemesh/ingress-and-network-policy/
# https://docs.cilium.io/en/v1.20/security/policy/layer3/#entities-based
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ntfy-from-gateway
  labels:
    app.kubernetes.io/name: ntfy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
