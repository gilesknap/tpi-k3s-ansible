apiVersion: v2
name: ntfy
description: |
  Self-hosted ntfy push-notification server, locked down to provisioned
  accounts with access tokens. Users, tokens and the access list are all
  declarative: the users and tokens come from the ntfy-auth SealedSecret,
  the access list from server.yml here. See docs/how-to/ntfy.md.
type: application
version: 0.1.0
