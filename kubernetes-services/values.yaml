# repo_branch is injected by the root app's valuesObject (from
# group_vars/all.yml). This default is only used if the root app
# does not pass it down (e.g. during local helm template testing).
repo_branch: main
# Automatic node maintenance (docs/explanations/upgrade-model.md). Each
# night, in Europe/London time:
#   00:00-00:30  unattended-upgrades installs packages (update_packages role)
#   01:00-02:00  system-upgrade-controller applies k3s patch releases
#   02:30-05:00  kured reboots nodes that need it, one at a time
# Keep the windows apart: kured and system-upgrade-controller each drain
# nodes. system-upgrade-controller only starts a round in its window but
# finishes it afterwards, so kured also skips any node running an upgrade
# Job (templates/kured.yaml).
k3s:
  # The k3s minor line. Nodes follow this release channel, so patches
  # arrive automatically; changing it is the (deliberate) minor upgrade.
  # The k3s Ansible role reads this value too (k3s_minor in
  # group_vars/all.yml), so fresh installs use the same line.
  minor: v1.34
  upgrade_window:
    days: [su, mo, tu, we, th, fr, sa]
    startTime: "01:00"
    endTime: "02:00"
    timeZone: Europe/London
kured:
  start_time: "02:30"
  end_time: "05:00"
  time_zone: Europe/London
# Headlamp — the Kubernetes web UI (kubernetes-sigs).
# The Argo CD plugin adds an "Argo CD" sidebar section listing
# Applications with sync/health status, plus sync and refresh actions.
# It talks to the Kubernetes API (not the Argo CD REST API), so it needs
# no Argo CD credentials — the chart's ClusterRoleBinding already gives
# the headlamp ServiceAccount enough rights to read and patch
# `applications.argoproj.io`.
#
# The plugin is not published on ArtifactHub yet, so the chart's
# `pluginsManager` sidecar (which only accepts ArtifactHub URLs) cannot
# install it. Instead an initContainer unpacks the GitHub release
# tarball into the plugins directory before Headlamp starts — see
# templates/dashboard.yaml.
#
# To upgrade: pick a newer `argocd-<version>` tag from
# https://github.com/headlamp-k8s/plugins/releases and update BOTH
# `version` and `sha256` (the checksum of
# headlamp-k8s-argocd-<version>.tar.gz). A mismatched checksum fails the
# initContainer, so the pod will not start with an unverified plugin.
headlamp:
  argocd_plugin:
    enabled: true
    version: 0.1.0-alpha
    sha256: 52eec016c40e1abe2c9a797391de0119c94f10c22005f9638389027604e8c39b
# OAuth2 authentication gateway.
# Set to true AFTER completing the OAuth setup guide (docs/how-to/oauth-setup).
# When false, services are accessible without OAuth authentication.
enable_oauth2_proxy: true
# Cloudflare Tunnel for web services.
# Set to true AFTER adding public hostnames in the Cloudflare Zero Trust
# dashboard (docs/how-to/cloudflare-web-tunnel).
# When true, disables ssl-redirect on tunnelled services so Cloudflare's
# edge TLS termination works without redirect loops.
enable_cloudflare_tunnel: true
# Cloudflare Zero Trust team name (the subdomain in
# <team>.cloudflareaccess.com). Used by the test-oauth-flow skill to
# build the CF Access logout URL.
cf_access_team: gilesk
# Admin email addresses — full access to all services.
# These emails get: ArgoCD admin, Grafana Admin,
# oauth2-proxy access (Longhorn, Headlamp).
# Must be kept in sync with admin_emails in group_vars/all.yml.
admin_emails:
  - gilesknap@gmail.com
  - giles.knap@diamond.ac.uk
# Viewer access is not listed here. Entry to Dex-authenticated services is
# gated at the edge by the Cloudflare Access application's one-time-PIN
# email allowlist (managed in the Cloudflare Zero Trust dashboard). Anyone
# who passes CF Access and authenticates via GitHub (Dex) lands in the
# default Viewer role — Grafana Viewer, ArgoCD readonly.
# Admin rights are still granted explicitly via admin_emails above.
# oauth2-proxy-gated services (Longhorn, Headlamp)
# remain admin-only and ignore this default.
# Cluster-owned NFS share on the NAS — single managed subtree under the
# existing bigdisk export (set up manually via docs/how-to/nas-setup.md).
# Hosts backup targets.
nfs:
  server: 192.168.1.3
  cluster_share_path: /bigdisk/k8s-cluster
# Dynamically provisioned RWX volumes from the NFS CSI driver, in two classes.
# Workload charts retain durable PVCs across Helm/Argo removal.
nfs_csi:
  chart_version: "4.13.4"
  server: 192.168.1.3
  # Scratch class, used only when named: a new folder per PV,
  # <namespace>/<pvc-name>-<pv-name>, beneath share, deleted with the PVC. A
  # PVC re-created under the same name starts empty.
  fresh_storage_class: nfs-rwx
  share: /k8s-dynamic
  # The default StorageClass, for every claim that names no class: one fixed
  # folder per PVC, <namespace>/<pvc-name>, beneath stable_share, so a claim
  # re-created after a cluster rebuild gets its data back. Deleting a PVC moves
  # its folder to archived-<namespace>/<pvc-name> there. Create the share root
  # on the NAS first (docs/how-to/nas-setup.md). Keep it a subfolder of `share`
  # (the same export and filesystem), so scripts/nfs-stable-paths can move old
  # worlds by rename, and give each cluster its own.
  stable_storage_class: nfs-stable
  stable_share: /k8s-dynamic/stable
# Minecraft dashboard (github.com/gilesknap/k3s-minecraft) — an admin web UI
# at minecraft.<cluster_domain> that launches, stops, snapshots and restores
# Minecraft worlds from backups. Deployed from the published OCI Helm chart,
# which creates the dashboard Deployment/Service/RBAC plus the archive
# (read-only) and store NFS PV/PVC pairs. Each world the dashboard launches
# gets its own dynamic `nfs_csi.stable_storage_class` PVC and a NodePort from the
# port range below. See docs/how-to/minecraft.md.
# Set to true AFTER the NAS directories exist (docs/how-to/nas-setup.md),
# `chart_version` below is published, and the AppProject change in
# argo-cd/argo-project.yaml has been applied with `--tags cluster`.
enable_minecraft: true
minecraft:
  # OCI chart version published by gilesknap/k3s-minecraft CI. The image tag
  # defaults to the chart's appVersion, so this is the only version pin.
  # Check the tag exists before bumping (see the /argocd skill):
  #   helm pull oci://ghcr.io/gilesknap/charts/minecraft-dashboard --version <ver>
  chart_version: "0.5.2"
  image:
    repository: ghcr.io/gilesknap/k3s-minecraft
  # Precious world archive — mounted read-only. Deliberately OUTSIDE
  # nfs.cluster_share_path so no cluster-wide tooling ever targets it.
  archive_path: /bigdisk/minecraft-archive
  # Writable store (backups/, snapshots/, dashboard/) — a subdirectory of
  # nfs.cluster_share_path. Both paths use nfs.server.
  store_subdir: minecraft
  # Players connect to <dns_name>.<cluster_domain>:<port>. This is a
  # DNS-only (grey-cloud) record pointing at the VPS relay's public IP —
  # it must NOT be a Cloudflare
  # tunnel route, because the tunnel only carries HTTP(S).
  dns_name: mc
  worlds:
    # All worlds are pinned to this node; the vps_relay `minecraft` forward
    # targets its LAN IP. Default matches this
    # cluster's nuc2.
    node: nuc2
    # NodePort range for game ports (20 slots), inclusive. Must sit inside
    # the k3s NodePort range (30000-32767) and match the vps_relay
    # `minecraft` forward.
    port_min: 30565
    port_max: 30584
    # Per-world RCON NodePorts (one each) for direct LAN clients such as
    # mciwb: `127.0.0.1:<port>` on the world node, `<node-ip>:<port>` from
    # the LAN. Plain-text RCON: NEVER add this range to vps_relay.forwards.
    # Must not overlap port_min-port_max.
    rcon_port_min: 30600
    rcon_port_max: 30619
    # Sources allowed to reach world RCON (port 25575) through the dashboard
    # chart's NetworkPolicy, besides the dashboard pod and the world's own
    # node. NodePort clients keep their IP (externalTrafficPolicy Local), but
    # pods on OTHER cluster nodes arrive as their node's IP, so cluster nodes
    # are excepted. ws03 (.10) is left in on purpose: RCON clients run on that
    # workstation and its taint keeps workload pods off it. Each entry is a
    # CIDR or {cidr, except: [CIDRs]}.
    rcon_allowed_cidrs:
      - cidr: 192.168.1.0/24
        except:
          - 192.168.1.81/32   # node01
          - 192.168.1.82/32   # node02
          - 192.168.1.83/32   # node03
          - 192.168.1.84/32   # node04
      - cidr: 192.168.0.0/24  # nuc2's second LAN
# VPS relay — publishes chosen cluster ports on a VPS's fixed public IP, for
# homes behind CGNAT or that should not expose their own IP. frpc in the
# `vps-relay` namespace dials frps on the VPS over the tailnet (through a
# Tailscale userspace sidecar); the VPS never connects into the home
# network. See docs/how-to/vps-relay.md.
# Set to true AFTER committing the sealed credentials
# (additions/vps-relay/templates/vps-relay-secret.yaml) and setting up frps
# on the VPS.
enable_vps_relay: true
vps_relay:
  # The VPS's tailnet IP (100.x.y.z) or MagicDNS name.
  vps_tailnet_host: 100.76.74.70
  # frps control port, bound to the VPS's tailnet address only.
  # SYNC: must match FRP_PORT for scripts/vps-relay-setup (default 7000) and
  # the tailnet policy grant (docs/how-to/vps-relay.md).
  frp_port: 7000
  # Each entry publishes `ports` on the VPS and relays them to the same
  # port numbers on `target` (a LAN IP or an in-cluster Service DNS name).
  # `ports` is a single port or an inclusive "min-max" range; `protocol`
  # is tcp or udp.
  #
  # MANUAL SYNC POINT: a forward only works once frps `allowPorts` and the
  # VPS firewall include its ports. Adding an entry here is not enough —
  # re-run scripts/vps-relay-setup on the VPS with the output of
  # `just vps-relay-forwards` (docs/how-to/vps-relay.md).
  forwards:
    # SYNC: ports must equal minecraft.worlds.port_min-port_max, and
    # target the LAN IP of minecraft.worlds.node.
    - name: minecraft
      protocol: tcp
      ports: 30565-30584
      target: 192.168.1.92
# Personal-cluster policy engine.
# Disabled for now: the app never settles to Synced on its policies.kyverno.io
# CRDs (issue #552). No policies were in use.
enable_kyverno: false
kyverno:
  chart_version: "3.9.1"
# Local-storage PV map — node-pinned hostPath PVs that survive cluster
# rebuild (data lives outside /var/lib/rancher). Each entry becomes one
# PV, pre-bound via claimRef to the chart-generated PVC of the workload
# that uses it. Edit `node` and `path` here to retarget data placement
# when forking; keep `claim_namespace`/`claim_name` matching the
# workload chart's PVC naming convention.
#
# SYNC: the `node` and `path` for each entry MUST match the
# corresponding entry in `k8s_data_dirs` in group_vars/all.yml — that's
# the Ansible loop that actually creates the host directory backing
# this PV. If the two drift, the PV's nodeAffinity will point at a
# directory that doesn't exist and the PVC will hang Pending.
local_storage:
  grafana:
    node: node03
    path: /var/lib/k8s-data/grafana
    capacity: 30Gi
    claim_namespace: monitoring
    # Grafana StatefulSet PVC (kube-prometheus-stack):
    # <vct-name>-<sts-name>-<ordinal> = storage-grafana-prometheus-0.
    claim_name: storage-grafana-prometheus-0
  prometheus:
    node: node04
    path: /var/lib/k8s-data/prometheus
    capacity: 40Gi
    claim_namespace: monitoring
    # Prometheus Operator-generated PVC name; the release name appears
    # twice (chart name + STS name). Do not "simplify" — it must match
    # what the operator creates verbatim.
    claim_name: prometheus-grafana-prometheus-kube-pr-prometheus-db-prometheus-grafana-prometheus-kube-pr-prometheus-0
  # scrap's data volume from before Litestream (ADR 0013), kept as a
  # frozen copy: nothing mounts it now but the one-off migration Job.
  # Keep the entry: removing it would prune the PV under its bound claim.
  # A new install has nothing to move: drop this entry (and its
  # k8s_data_dirs one in group_vars/all.yml). If kept, the Job finds no
  # database on it and does nothing.
  scrap:
    node: nuc2
    path: /home/k8s-data/scrap
    capacity: 5Gi
    claim_namespace: scrap
    # scrap chart data claim: <release>-data.
    claim_name: scrap-data
  # Nightly copy of scrap's newest backup run off the NAS
  # (additions/scrap/templates/backup-copy.yaml).
  scrap_backup_copy:
    node: nuc2
    path: /home/k8s-data/scrap-backup-copy
    capacity: 10Gi
    claim_namespace: scrap
    claim_name: scrap-backup-copy
