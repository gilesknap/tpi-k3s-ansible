# repo_branch is injected by the root app's valuesObject (from
# group_vars/all.yml). This default is only used if the root app
# does not pass it down (e.g. during local helm template testing).
repo_branch: main
# Automatic node maintenance (docs/explanations/upgrade-model.md). Each
# night, in Europe/London time:
#   00:00-00:30  unattended-upgrades installs packages (update_packages role)
#   01:00-02:00  system-upgrade-controller applies k3s patch releases
#   02:30-05:00  kured reboots nodes that need it, one at a time
# Keep the windows apart: kured and system-upgrade-controller each drain
# nodes. system-upgrade-controller only starts a round in its window but
# finishes it afterwards, so kured also skips any node running an upgrade
# Job (templates/kured.yaml).
k3s:
  # The k3s minor line. Nodes follow this release channel, so patches
  # arrive automatically; changing it is the (deliberate) minor upgrade.
  # The k3s Ansible role reads this value too (k3s_minor in
  # group_vars/all.yml), so fresh installs use the same line.
  minor: v1.34
  # Where Prometheus scrapes etcd's metrics (:2381, which the k3s role's
  # etcd-expose-metrics opens on the node's address): the control plane's
  # IP. SYNC: control_plane in group_vars/all.yml; change it when the
  # control plane moves (docs/how-to/recover-control-plane.md).
  etcd_metrics_endpoints:
    - 192.168.1.82   # node02
  upgrade_window:
    days: [su, mo, tu, we, th, fr, sa]
    startTime: "01:00"
    endTime: "02:00"
    timeZone: Europe/London
kured:
  start_time: "02:30"
  end_time: "05:00"
  time_zone: Europe/London
# Headlamp — the Kubernetes web UI (kubernetes-sigs).
# The Argo CD plugin adds an "Argo CD" sidebar section listing
# Applications with sync/health status, plus sync and refresh actions.
# It talks to the Kubernetes API (not the Argo CD REST API), so it needs
# no Argo CD credentials — the chart's ClusterRoleBinding already gives
# the headlamp ServiceAccount enough rights to read and patch
# `applications.argoproj.io`.
#
# The plugin is not published on ArtifactHub yet, so the chart's
# `pluginsManager` sidecar (which only accepts ArtifactHub URLs) cannot
# install it. Instead an initContainer unpacks the GitHub release
# tarball into the plugins directory before Headlamp starts — see
# templates/dashboard.yaml.
#
# To upgrade: pick a newer `argocd-<version>` tag from
# https://github.com/headlamp-k8s/plugins/releases and update BOTH
# `version` and `sha256` (the checksum of
# headlamp-k8s-argocd-<version>.tar.gz). A mismatched checksum fails the
# initContainer, so the pod will not start with an unverified plugin.
headlamp:
  argocd_plugin:
    enabled: true
    version: 0.1.0-alpha
    sha256: 52eec016c40e1abe2c9a797391de0119c94f10c22005f9638389027604e8c39b
# OAuth2 authentication gateway.
# Set to true AFTER completing the OAuth setup guide (docs/how-to/oauth-setup.md).
# When false, services are accessible without OAuth authentication.
enable_oauth2_proxy: true
# Cloudflare Tunnel for web services.
# Set to true AFTER the tunnel and its public hostnames exist (OpenTofu in
# cloudflare/, docs/how-to/cloudflare-as-code.md).
# When true, disables ssl-redirect on tunnelled services so Cloudflare's
# edge TLS termination works without redirect loops.
enable_cloudflare_tunnel: true
# Cloudflare Zero Trust team name (the subdomain in
# <team>.cloudflareaccess.com). Used by the test-oauth-flow skill to
# build the CF Access logout URL.
cf_access_team: gilesk
# Admin email addresses — full access to all services.
# These emails get: ArgoCD admin, Grafana Admin,
# oauth2-proxy access (e.g. Headlamp, Alertmanager).
# Must be kept in sync with admin_emails in group_vars/all.yml.
admin_emails:
  - gilesknap@gmail.com
  - giles.knap@diamond.ac.uk
# Viewer access is not listed here. Entry to Dex-authenticated services is
# gated at the edge by the Cloudflare Access application's one-time-PIN
# email allowlist (managed in the Cloudflare Zero Trust dashboard). Anyone
# who passes CF Access and authenticates via GitHub (Dex) lands in the
# default Viewer role — Grafana Viewer, ArgoCD readonly.
# Admin rights are still granted explicitly via admin_emails above.
# oauth2-proxy-gated services (e.g. Headlamp, Alertmanager)
# remain admin-only and ignore this default.
# Cluster-owned NFS share on the NAS — single managed subtree under the
# bigdisk dataset (created by the nas role: docs/how-to/nas-setup.md).
# Hosts backup targets.
nfs:
  server: 192.168.1.3
  cluster_share_path: /bigdisk/k8s-cluster
# Pause the workloads that mount the NAS, for NAS maintenance (the QNAP to
# Ubuntu+ZFS switchover), one key per group so they can resume in stages.
# A paused pod gets a nodeSelector no node has (nas-switchover: paused), so
# it stops and its replacement stays Pending (all three use Recreate); a
# paused CronJob is suspended, keeping its last-success time. Minecraft
# worlds are the dashboard's, not ArgoCD's: stop them from the dashboard
# first. Host NFS mounts (node02's etcd backup) are outside the cluster.
nas_paused:
  # The scrap pod, its chart's backup CronJobs (which share the pod's
  # nodeSelector, so a run that fires stays Pending) and scrap-backup-copy.
  scrap: false
  # The Minecraft dashboard Deployment.
  minecraft_dashboard: false
  # Every CronJob in the backups namespace: grafana-daily/weekly,
  # jellyfin-daily/weekly, offsite-backup (Drive) and offsite-backup-b2.
  backups: false
  # The Jellyfin pod.
  jellyfin: false
# The NAS's own monitoring: Prometheus scrapes node-exporter on gknas
# (installed by roles/nas, pb_nas.yml) for ZFS pool state, SMART, scrubs
# and the nightly copy to its backup pool, with alerts (templates/grafana.yaml,
# docs/how-to/nas-ubuntu-zfs.md). The NAS runs node-exporter since it
# moved to Ubuntu + ZFS; turn this off only if it stops (a NAS without it
# would fire NasDown).
nas:
  monitoring:
    enabled: true
    targets:
      - 192.168.1.3:9100
# Off-site copy of the cluster's backups to Google Drive (additions/backups,
# templates/cronjob-offsite.yaml; docs/how-to/backup-restore.md, "Off-site
# copy to Google Drive"). A nightly CronJob in the `backups` namespace uploads,
# with rclone, every backup under <nfs.cluster_share_path>/backups not yet on
# Drive, plus a nightly tarball of the Minecraft store and worlds and, once,
# the Minecraft archive. Every file is age-encrypted to age_recipient first,
# and the job only ever adds files: a deletion on the NAS is never mirrored.
# Set enabled to true AFTER sealing rclone's Drive credentials with
# `just seal-rclone-drive <client_secret.json>` and committing
# additions/backups/templates/offsite-backup-rclone-secret.yaml. Its alerts
# (additions/grafana/offsite-backup-rules.yaml) fire only while it is enabled.
# A second target, a Backblaze B2 bucket that nothing can delete from before
# its retention ends, is set in `b2` below.
offsite_backup:
  enabled: true
  # 05:30 Europe/London: after the other nightly backups (etcd 23:15,
  # scrap 00:30, grafana 00:35, scrap's nuc2 copy 00:50, jellyfin 01:45)
  # and the kured window (02:30-05:00).
  schedule: "30 5 * * *"
  time_zone: Europe/London
  # Folder in the Drive's root. With the drive.file scope rclone sees only
  # what it made, so a folder of this name made by hand is a different one.
  drive_root: home-cluster-offsite
  # What goes to Drive: any of backups (everything under
  # <nfs.cluster_share_path>/backups), minecraft-nightly (the nightly tarball
  # of the store and worlds) and minecraft-archive (the world archive). The
  # minecraft-* ones need minecraft.enabled below.
  include: [backups, minecraft-nightly, minecraft-archive]
  # The second off-site target: the offsite-backup-b2 CronJob uploads the
  # same files, encrypted the same way and with the same pruning, to a
  # Backblaze B2 bucket made with Object Lock, whose default retention is
  # compliance mode for 30 days. No credential, not even the account
  # owner's, can delete or overwrite a version there before its 30 days
  # are up, so someone with root on the cluster (who can read both rclone
  # credentials) can wipe Drive and the NAS but not this copy. The job's
  # pruning only hides files; the bucket's lifecycle rule deletes a hidden
  # version once its lock has expired. Set enabled to true AFTER the
  # one-time B2 setup and `just seal-b2-offsite` (docs/how-to/backup-restore.md,
  # "Second off-site copy: Backblaze B2"). Runs on `b2.schedule` (05:45), after
  # the Drive job; a failure on either alerts by its CronJob's name.
  b2:
    enabled: true
    # The bucket's name (B2 bucket names are global); the job writes
    # backups/ at its root.
    bucket: gk-cluster-offsite
    # Holds rclone.conf with a [b2] remote: the application key restricted
    # to the bucket. Sealed by scripts/seal-b2-offsite.
    secret_name: offsite-backup-b2
    # As `include` above. Only the NAS backups: the Minecraft tarballs and
    # archive stay on Drive (the archive has other copies).
    include: [backups]
    # Cron schedule (in offsite_backup.time_zone); empty means `schedule`.
    # 15 minutes after the Drive job, so the two don't read the NAS at once.
    schedule: "45 5 * * *"
    # backups.prune_days for this bucket; empty means the same as Drive's
    # (180). A pruned file's versions stay until their 30-day lock ends,
    # so a value under 30 saves nothing; 30 keeps the bucket at about
    # 10.5 GB (just over the free 10 GB), 180 at about 46 GB, about $3 a
    # year (docs/how-to/backup-restore.md, "Cost").
    prune_days: ""
  # age public key every file is encrypted to: one key for every backup.
  # SYNC: etcd_backup_age_recipient in group_vars/all.yml.
  age_recipient: age13c5tkz4n35adg7vy73c4lk2tj5av2t8sgwy8u60uwx3ue5n5j95sly0x20
  # Each pinned to a release at least two weeks old when chosen; keep that
  # rule when bumping. The rclone image is Alpine with busybox (sh, tar).
  # age is not in it: an init container fetches the release tarball for the
  # node's architecture and checks it against these sha256s, so bump
  # `version` and both checksums together
  # (https://github.com/FiloSottile/age/releases).
  # SYNC: AGE_RELEASE and its checksums in .devcontainer/Dockerfile.
  image: docker.io/rclone/rclone:1.75.2
  age:
    version: 1.3.2
    sha256:
      amd64: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
      arm64: 6b8dc4333c53a5a57c9e5834e3a48f92605d7154014cd07269ff3327db5d37f4
  # A run is stopped after this long; the next run carries on where it
  # stopped. Only the first upload (several GB) should come near it.
  deadline_hours: 6
  backups:
    # Runs as the NAS's squashed-root owner (nobody), which owns the
    # mode-0600 etcd bundles and sealed-secrets key exports.
    uid: 65534
    # Folders (under backups/) whose subfolders are backup runs, each
    # uploaded as one tarball once it has a COMPLETE marker (scrap's runs),
    # or as <run>.incomplete.tar.age once the run folder (its mtime) is two
    # days old without one. Their files are scrap's, many mode 0600, so the
    # `scrap` container (offsite_backup.scrap) uploads these folders, and
    # `backups` everything else.
    run_dirs: [scrap, scrap/monthly, scrap-curated]
    # Files rewritten in place each night; their dated copies are uploaded.
    # (A copy brought back from Drive goes in <nfs.cluster_share_path>/
    # restore-scratch, outside backups/, so it is never uploaded or pruned;
    # docs/how-to/backup-restore.md, "Where to unpack a copy from Drive".)
    exclude:
      - etcd/LATEST
      - etcd/sealed-secrets-keys.yaml.age
      - etcd/sealed-secrets-keys.yaml.age.sha256
    # Delete a file this job made on Drive only when its source is gone
    # from the NAS and it was uploaded over prune_days ago, and never the
    # keep_min newest of its series (one folder's files that differ only
    # in date or time). 0 never deletes.
    prune_days: 180
    keep_min: 4
  # The container that uploads backups.run_dirs runs as scrap's uid and gid:
  # the owner of its backup runs' files, many mode 0600, which no group can
  # read. 10001 is hard-coded in additions/scrap/templates (backup-copy.yaml,
  # migrate-job.yaml) and in scrap's image: change them together.
  scrap:
    uid: 10001
    gid: 10001
  # Only with enable_minecraft. Store and archive paths come from the
  # minecraft block, the worlds' share from nfs_csi.
  minecraft:
    enabled: true
    # The owner of the worlds' files (level.dat is mode 0600).
    uid: 1000
    gid: 1000
    # The worlds' share root; empty means nfs_csi.stable_share. The nightly
    # tarball takes its minecraft/ folder (the live worlds) and
    # archived-minecraft/ (deleted worlds).
    worlds_path: ""
    # Nightly tarballs kept on Drive.
    keep: 7
    # A nightly tarball under this percentage of the largest one on Drive
    # fails the run and stops pruning, so a wiped source cannot push the
    # good copies out.
    min_size_percent: 50
    # Upload minecraft.archive_path (once, and again only if it changes).
    archive: true
# Dynamically provisioned RWX volumes from the NFS CSI driver, in two classes.
# Workload charts retain durable PVCs across Helm/Argo removal.
nfs_csi:
  chart_version: "4.13.4"
  server: 192.168.1.3
  # Scratch class, used only when named: a new folder per PV,
  # <namespace>/<pvc-name>-<pv-name>, beneath share, deleted with the PVC. A
  # PVC re-created under the same name starts empty.
  fresh_storage_class: nfs-rwx
  share: /k8s-dynamic
  # The default StorageClass, for every claim that names no class: one fixed
  # folder per PVC, <namespace>/<pvc-name>, beneath stable_share, so a claim
  # re-created after a cluster rebuild gets its data back. Deleting a PVC moves
  # its folder to archived-<namespace>/<pvc-name> there. The nas role creates
  # the share root on the NAS (docs/how-to/nas-setup.md). Keep it a subfolder of `share`
  # (the same export and filesystem), so scripts/nfs-stable-paths can move old
  # worlds by rename, and give each cluster its own.
  stable_storage_class: nfs-stable
  stable_share: /k8s-dynamic/stable
# Minecraft dashboard (github.com/gilesknap/k3s-minecraft) — an admin web UI
# at minecraft.<cluster_domain> that launches, stops, snapshots and restores
# Minecraft worlds from backups. Deployed from the published OCI Helm chart,
# which creates the dashboard Deployment/Service/RBAC plus the archive
# (read-only) and store NFS PV/PVC pairs. Each world the dashboard launches
# gets its own dynamic `nfs_csi.stable_storage_class` PVC and a NodePort from the
# port range below. See docs/how-to/minecraft.md.
# Set to true AFTER the NAS directories exist (docs/how-to/nas-setup.md),
# `chart_version` below is published, and the AppProject change in
# argo-cd/argo-project.yaml has been applied with `--tags cluster`.
enable_minecraft: true
minecraft:
  # OCI chart version published by gilesknap/k3s-minecraft CI. The image tag
  # defaults to the chart's appVersion, so this is the only version pin.
  # Check the tag exists before bumping (see the /argocd skill):
  #   helm pull oci://ghcr.io/gilesknap/charts/minecraft-dashboard --version <ver>
  chart_version: "0.5.2"
  image:
    repository: ghcr.io/gilesknap/k3s-minecraft
  # Precious world archive — mounted read-only. Deliberately OUTSIDE
  # nfs.cluster_share_path so no cluster-wide tooling ever targets it.
  archive_path: /bigdisk/minecraft-archive
  # Writable store (backups/, snapshots/, dashboard/) — a subdirectory of
  # nfs.cluster_share_path. Both paths use nfs.server.
  store_subdir: minecraft
  # Players connect to <dns_name>.<cluster_domain>:<port>. This is a
  # DNS-only (grey-cloud) record pointing at the VPS relay's public IP —
  # it must NOT be a Cloudflare
  # tunnel route, because the tunnel only carries HTTP(S).
  dns_name: mc
  worlds:
    # All worlds are pinned to this node; the vps_relay `minecraft` forward
    # targets its LAN IP. Default matches this
    # cluster's nuc2.
    node: nuc2
    # NodePort range for game ports (20 slots), inclusive. Must sit inside
    # the k3s NodePort range (30000-32767) and match the vps_relay
    # `minecraft` forward.
    port_min: 30565
    port_max: 30584
    # Per-world RCON NodePorts (one each) for direct LAN clients such as
    # mciwb: `127.0.0.1:<port>` on the world node, `<node-ip>:<port>` from
    # the LAN. Plain-text RCON: NEVER add this range to vps_relay.forwards.
    # Must not overlap port_min-port_max.
    rcon_port_min: 30600
    rcon_port_max: 30619
    # Sources allowed to reach world RCON (port 25575) through the dashboard
    # chart's NetworkPolicy, besides the dashboard pod and the world's own
    # node (whose host Cilium always admits, so mciwb runs on nuc2's host).
    # NodePort clients on the LAN keep their IP (externalTrafficPolicy
    # Local). Cluster node IPs are excepted, so their hosts are refused: add
    # a new node here when it joins (/add-node). Pods keep their own
    # identity, which no ipBlock matches, so they are refused too. Each
    # entry is a CIDR or {cidr, except: [CIDRs]}.
    rcon_allowed_cidrs:
      - cidr: 192.168.1.0/24
        except:
          - 192.168.1.81/32   # node01, a powered-off spare
          - 192.168.1.82/32   # node02
          - 192.168.1.83/32   # node03
          - 192.168.1.84/32   # node04
          - 192.168.1.91/32   # nuc1
      - cidr: 192.168.0.0/24  # nuc2's second LAN
    # Cluster nodes whose hosts may reach world RCON, by node name, so RCON
    # clients such as mciwb can run there: ws03, whose taint keeps workload
    # pods off it. A client on another node's host reaches the world pod
    # from that node's Cilium address, not its LAN IP, so the ipBlocks
    # above cannot admit it; additions/minecraft adds a CiliumNetworkPolicy
    # (fromNodes) for these nodes instead.
    rcon_allowed_nodes:
      - ws03
# VPS relay — publishes chosen cluster ports on a VPS's fixed public IP, for
# homes behind CGNAT or that should not expose their own IP. frpc in the
# `vps-relay` namespace dials frps on the VPS over the tailnet (through a
# Tailscale userspace sidecar); the VPS never connects into the home
# network. See docs/how-to/vps-relay.md.
# Set to true AFTER committing the sealed credentials
# (additions/vps-relay/templates/vps-relay-secret.yaml) and setting up frps
# on the VPS.
enable_vps_relay: true
vps_relay:
  # The VPS's tailnet IP (100.x.y.z) or MagicDNS name.
  vps_tailnet_host: 100.76.74.70
  # frps control port, bound to the VPS's tailnet address only.
  # SYNC: must match FRP_PORT for scripts/vps-relay-setup (default 7000) and
  # the tailnet policy grant (docs/how-to/vps-relay.md).
  frp_port: 7000
  # Each entry publishes `ports` on the VPS and relays them to the same
  # port numbers on `target` (a LAN IP or an in-cluster Service DNS name).
  # `ports` is a single port or an inclusive "min-max" range; `protocol`
  # is tcp or udp.
  #
  # MANUAL SYNC POINT: a forward only works once frps `allowPorts` and the
  # VPS firewall include its ports. Adding an entry here is not enough —
  # re-run scripts/vps-relay-setup on the VPS with the output of
  # `just vps-relay-forwards` (docs/how-to/vps-relay.md).
  forwards:
    # SYNC: ports must equal minecraft.worlds.port_min-port_max, and
    # target the LAN IP of minecraft.worlds.node.
    - name: minecraft
      protocol: tcp
      ports: 30565-30584
      target: 192.168.1.92
# Jellyfin media server (upstream jellyfin/jellyfin chart), pinned to one
# node for its config volume (local_storage.jellyfin) and Intel iGPU. LAN and
# Tailscale only: no Ingress or Cloudflare route. See docs/how-to/jellyfin.md.
# Needs, before the first sync: the config directory on the node
# (`ansible-playbook pb_all.yml --tags k8s_data_dirs --limit <node>`), the
# node labelled for the Intel GPU (intel_gpu_node: true in hosts.yml), and
# the chart repo in the AppProject (argo-cd/argo-project.yaml, applied with
# `--tags cluster`).
enable_jellyfin: true
jellyfin:
  # Each pinned to the newest release at least two weeks old when chosen, as
  # a supply-chain buffer; keep that rule when bumping. One exception: the
  # owner waived it on 2026-11-08 for this bump to 12.4 (chart 3.7.0, image
  # built 2026-10-26), because the host install being migrated is already on
  # 12.4.0 and an older Jellyfin must not open a database migrated by a newer
  # one. The image tag is the immutable dated build of 12.4.
  chart_version: "3.7.0"
  image_tag: "12.4.20261026-211555"
  # Trial: a throwaway config, marked TRIAL-CONFIG-SAFE-TO-DELETE at the
  # config volume's root, so a later seed can clear it. Not with
  # seed_from_host.
  trial: false
  # One-off copy of a host install's data and config into the config volume
  # (init containers; see docs/how-to/jellyfin.md). It copies only into an
  # empty or trial-marked volume, refuses while the host service looks live,
  # and does nothing once the volume is marked SEEDED-FROM-HOST. Off: the
  # seed is done (the volume carries SEEDED-FROM-HOST), so the pod has no
  # init containers or hostPath mounts for it.
  seed_from_host: false
  seed:
    # For the seed's PRAGMA integrity_check (the Jellyfin image has no
    # sqlite3); the grafana and jellyfin backup CronJobs use it too. Alpine-based,
    # pinned to a release at least two weeks old (3.54.1: 2026-10-19).
    sqlite_image: docker.io/keinos/sqlite3:3.54.1
    # Replaces HardwareDecodingCodecs in the copied encoding.xml (not the
    # host's). Empty: copy it unchanged. These are the codecs the node's
    # Tiger Lake iGPU decodes with VAAPI.
    hardware_decoding_codecs: [h264, hevc, mpeg2video, vc1, vp8, vp9, av1]
  # Where Jellyfin keeps its data, config and logs: the same paths as the
  # host install, so the absolute paths in its database and XML stay valid.
  # Each is a subdirectory (data/, config/, log/) of the config volume. The
  # seed copies the host's data_dir and config_dir (mounted read-only). The
  # cache is an emptyDir (cache_size).
  data_dir: /var/lib/jellyfin
  config_dir: /etc/jellyfin
  log_dir: /var/log/jellyfin
  cache_dir: /var/cache/jellyfin
  # On the node's network, so the pod listens on every host interface (both
  # LANs and tailscale0) and UDP 7359 client discovery works. Off (ClusterIP
  # only, reached by kubectl port-forward) for a trial alongside a host
  # install, so the two cannot clash on 8096/7359.
  host_network: true
  # The node's jellyfin account: files on the volume keep this owner.
  # SYNC: owner/group of the jellyfin entry in k8s_data_dirs
  # (group_vars/all.yml).
  uid: 122
  gid: 124
  # The node's render group, for /dev/dri/renderD128 (`getent group render`
  # on the node). 992 on Ubuntu 24.04 and still after the upgrade to 26.04:
  # VERIFY after an OS release upgrade, as it is allocated dynamically.
  render_gid: 992
  # The video group, for /dev/dri/card0 (fixed at 44 on Debian/Ubuntu).
  video_gid: 44
  # emptyDir for the cache and transcodes; a pod restart losing it is harmless.
  cache_size: 20Gi
  media:
    # Read-only NFS export of the library on nfs.server.
    nfs_path: /bigdisk/media
    # Mounted where a host install sees it, so imported library paths match.
    mount_path: /media/bigdisk/media
# Personal-cluster policy engine.
# Disabled for now: the app never settles to Synced on its policies.kyverno.io
# CRDs (issue #552). No policies were in use.
enable_kyverno: false
kyverno:
  chart_version: "3.9.1"
# Local-storage PV map — node-pinned hostPath PVs that survive cluster
# rebuild (data lives outside /var/lib/rancher). Each entry becomes one
# PV, pre-bound via claimRef to the chart-generated PVC of the workload
# that uses it. Edit `node` and `path` here to move a volume to another
# node or path; keep `claim_namespace`/`claim_name` matching the
# workload chart's PVC naming convention.
#
# Binding adds the claim's uid to the PV's claimRef, and a sync never
# removes it: if the claim is deleted by hand, the PV stays Released
# and refuses the new claim. Claims rendered from this repo carry
# Prune=false,Delete=false so an Application delete leaves them; see
# "A local-nvme PV stuck Released" in docs/reference/troubleshooting.md.
#
# SYNC: the `node` and `path` for each entry MUST match the
# corresponding entry in `k8s_data_dirs` in group_vars/all.yml — that's
# the Ansible loop that actually creates the host directory backing
# this PV. If the two drift, the PV's nodeAffinity will point at a
# directory that doesn't exist and the PVC will hang Pending.
local_storage:
  grafana:
    node: node04
    path: /var/lib/k8s-data/grafana
    capacity: 30Gi
    claim_namespace: monitoring
    # Grafana StatefulSet PVC (kube-prometheus-stack):
    # <vct-name>-<sts-name>-<ordinal> = storage-grafana-prometheus-0.
    claim_name: storage-grafana-prometheus-0
  prometheus:
    node: node04
    path: /var/lib/k8s-data/prometheus
    capacity: 40Gi
    claim_namespace: monitoring
    # Prometheus Operator-generated PVC name; the release name appears
    # twice (chart name + STS name). Do not "simplify" — it must match
    # what the operator creates verbatim.
    claim_name: prometheus-grafana-prometheus-kube-pr-prometheus-db-prometheus-grafana-prometheus-kube-pr-prometheus-0
  # scrap's data volume from before Litestream (ADR 0013), kept as a
  # frozen copy: nothing mounts it now but the one-off migration Job.
  # Keep the entry: removing it would prune the PV under its bound claim.
  # A new install has nothing to move: drop this entry (and its
  # k8s_data_dirs one in group_vars/all.yml). If kept, the Job finds no
  # database on it and does nothing.
  scrap:
    node: nuc2
    path: /home/k8s-data/scrap
    capacity: 5Gi
    claim_namespace: scrap
    # scrap chart data claim: <release>-data.
    claim_name: scrap-data
  # Nightly copy of scrap's newest backup run off the NAS
  # (additions/scrap/templates/backup-copy.yaml).
  scrap_backup_copy:
    node: nuc2
    path: /home/k8s-data/scrap-backup-copy
    capacity: 10Gi
    claim_namespace: scrap
    claim_name: scrap-backup-copy
  # Jellyfin's data/ (database, metadata, subtitles, plugins), config/ and
  # log/. 60Gi is an estimate: a host install's data was 25G, 22G of it
  # extracted subtitles. Mounted by kubernetes-services/templates/jellyfin.yaml;
  # backed up by additions/backups (jellyfin-daily, jellyfin-weekly).
  jellyfin:
    node: nuc2
    path: /home/k8s-data/jellyfin
    capacity: 60Gi
    claim_namespace: jellyfin
    claim_name: jellyfin-config
