apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress
  namespace: argo-cd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  project: kubernetes
  source:
    chart: ingress-nginx
    targetRevision: 4.15.1
    repoURL:  https://kubernetes.github.io/ingress-nginx
    helm:
      valuesObject:
        controller:
          extraArgs:
            default-ssl-certificate: cert-manager/wildcard-tls
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Two replicas on different nodes, so a node reboot or drain keeps
          # one controller serving. The chart's PDB is created when
          # replicaCount > 1.
          replicaCount: 2
          maxUnavailable: 1
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              # Ignore tainted and cordoned nodes when counting skew, so a
              # rollout or drain never waits for a node it cannot use.
              nodeTaintsPolicy: Honor
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: ingress-nginx
                  app.kubernetes.io/instance: ingress
                  app.kubernetes.io/component: controller
          admissionWebhooks:
            # Disabled: hook jobs (admission-create/patch) delete themselves before
            # ArgoCD records Succeeded, causing every sync to get permanently stuck.
            # The webhook validates ingress syntax but is not required for operation.
            enabled: false
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
