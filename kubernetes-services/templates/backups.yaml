apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backups
  namespace: argo-cd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: backups
  project: kubernetes
  sources:
    # Per-app backup CronJobs writing to the single cluster-owned NFS share.
    # The chart creates one static NFS PV; each CronJob uses subPath to see
    # only its own backups/<app>/ subdirectory. The NFS share itself is
    # created manually on the NAS — see docs/how-to/nas-setup.md.
    - path: ./kubernetes-services/additions/backups
      repoURL: {{ .Values.repo_remote }}
      targetRevision: {{ .Values.repo_branch }}
      helm:
        valuesObject:
          nfs:
            server: {{ .Values.nfs.server | quote }}
            cluster_share_path: {{ .Values.nfs.cluster_share_path | quote }}
          local_storage:
{{ toYaml .Values.local_storage | indent 12 }}
          grafana:
            image: {{ .Values.jellyfin.seed.sqlite_image | quote }}
          jellyfin:
            enabled: {{ .Values.enable_jellyfin }}
            uid: {{ .Values.jellyfin.uid }}
            gid: {{ .Values.jellyfin.gid }}
            image: {{ .Values.jellyfin.seed.sqlite_image | quote }}
          {{- with .Values.offsite_backup }}
          offsite_backup:
            enabled: {{ .enabled }}
            schedule: {{ .schedule | quote }}
            time_zone: {{ .time_zone | quote }}
            drive_root: {{ .drive_root | quote }}
            include: {{ toJson .include }}
            b2:
              enabled: {{ .b2.enabled }}
              bucket: {{ .b2.bucket | quote }}
              secret_name: {{ .b2.secret_name | quote }}
              include: {{ toJson .b2.include }}
              prune_days: {{ .b2.prune_days | quote }}
            age_recipient: {{ .age_recipient | quote }}
            image: {{ .image | quote }}
            age:
{{ toYaml .age | indent 14 }}
            deadline_hours: {{ .deadline_hours }}
            backups:
{{ toYaml .backups | indent 14 }}
            scrap:
              uid: {{ .scrap.uid }}
              gid: {{ .scrap.gid }}
            minecraft:
              enabled: {{ and $.Values.enable_minecraft .minecraft.enabled }}
              uid: {{ .minecraft.uid }}
              gid: {{ .minecraft.gid }}
              store_subdir: {{ $.Values.minecraft.store_subdir | quote }}
              worlds_server: {{ $.Values.nfs_csi.server | quote }}
              worlds_path: {{ .minecraft.worlds_path | default $.Values.nfs_csi.stable_share | quote }}
              # The minecraft namespace's nfs-stable folders: live worlds,
              # and deleted ones (moved to archived-<namespace>/).
              world_dirs: [minecraft, archived-minecraft]
              archive_path: {{ ternary $.Values.minecraft.archive_path "" .minecraft.archive | quote }}
              keep: {{ .minecraft.keep }}
              min_size_percent: {{ .minecraft.min_size_percent }}
          {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
