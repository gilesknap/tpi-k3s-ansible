apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-csi
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: nfs-csi
  source:
    chart: csi-driver-nfs
    repoURL: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
    targetRevision: {{ .Values.nfs_csi.chart_version | quote }}
    helm:
      valuesObject:
        storageClass:
          create: true
          # Scratch class: a new folder per PV, deleted with the PVC. Set to
          # "false" explicitly (not just dropped), so the sync clears the old
          # default annotation; only one class may be the default.
          name: {{ .Values.nfs_csi.fresh_storage_class | quote }}
          annotations:
            storageclass.kubernetes.io/is-default-class: "false"
          parameters:
            server: {{ .Values.nfs_csi.server | quote }}
            share: {{ .Values.nfs_csi.share | quote }}
            subDir: ${pvc.metadata.namespace}/${pvc.metadata.name}-${pv.metadata.name}
            onDelete: delete
            # The driver creates each subdirectory as root 0755, so non-root
            # Pods without an fsGroup (blueapi runs as uid 1000) cannot write.
            # Only affects volumes provisioned after the change. Parameters are
            # immutable: delete the StorageClass and let Argo CD recreate it.
            mountPermissions: "0777"
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
          mountOptions:
            - nfsvers=4.1
        # The default class, for volumes that must survive a cluster rebuild.
        # It has a share of its own, and one fixed folder per PVC,
        # <namespace>/<pvc-name>, so a PVC re-created under the same name
        # finds its old data. Deleting a PVC moves its folder to
        # archived-<namespace>/<pvc-name> under the share; the driver never
        # deletes it. The share root must exist on the NAS before this syncs
        # (docs/how-to/nas-setup.md).
        storageClasses:
          - name: {{ .Values.nfs_csi.stable_storage_class | quote }}
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"
            parameters:
              server: {{ .Values.nfs_csi.server | quote }}
              share: {{ .Values.nfs_csi.stable_share | quote }}
              subDir: ${pvc.metadata.namespace}/${pvc.metadata.name}
              onDelete: archive
              mountPermissions: "0777"
            reclaimPolicy: Delete
            volumeBindingMode: Immediate
            mountOptions:
              - nfsvers=4.1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
