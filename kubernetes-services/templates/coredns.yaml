apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coredns
  namespace: argo-cd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  project: kubernetes
  sources:
    # Runs K3s's bundled CoreDNS as 2 replicas without taking ownership of
    # its Deployment — see additions/coredns/coredns-ha.yaml.
    - path: ./kubernetes-services/additions/coredns
      repoURL: {{ .Values.repo_remote }}
      targetRevision: {{ .Values.repo_branch }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
