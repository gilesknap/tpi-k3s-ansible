apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oauth2-proxy
  namespace: argo-cd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: oauth2-proxy
  project: kubernetes
  sources:
    - chart: oauth2-proxy
      repoURL: https://oauth2-proxy.github.io/manifests
      targetRevision: 10.7.4
      helm:
        valuesObject:
          # https://github.com/oauth2-proxy/manifests/blob/main/helm/oauth2-proxy/values.yaml
          # Credentials are loaded from a SealedSecret — do NOT put them here.
          config:
            existingSecret: oauth2-proxy-credentials
            configFile: |-
              email_domains = []
              upstreams = ["file:///dev/null"]
          authenticatedEmailsFile:
            enabled: true
            restricted_access: |-
{{- range .Values.admin_emails }}
              {{ . }}
{{- end }}
          extraArgs:
            provider: github
            cookie-domain: ".{{ .Values.cluster_domain }}"
            whitelist-domain: ".{{ .Values.cluster_domain }}"
            cookie-secure: "true"
            # Answers a signed-in request on any path but oauth2-proxy's own.
            # 200, not 202: Cilium's Gateway (Envoy's ext_authz) allows only
            # a 200 (additions/ingress/templates/httproute.yaml).
            upstream: "static://200"
            set-xauthrequest: "true"
            pass-access-token: "true"
            custom-templates-dir: "/etc/oauth2-proxy/templates"
          extraVolumes:
            - name: error-templates
              configMap:
                name: oauth2-proxy-error-templates
          extraVolumeMounts:
            - name: error-templates
              mountPath: /etc/oauth2-proxy/templates
              readOnly: true
          # Sessions live in the encrypted cookie (sessionStorage: cookie, the
          # chart default) and every replica shares the cookie secret, so
          # replicas need no shared state.
          replicaCount: 2
          # The chart defaults minAvailable to 1, and a PDB cannot set both.
          # minAvailable: null does not work here: the API server prunes nulls
          # from the Application's valuesObject, so the chart default comes
          # back. 0 overrides it and the chart's `with` omits the field.
          podDisruptionBudget:
            enabled: true
            minAvailable: 0
            maxUnavailable: 1
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              nodeTaintsPolicy: Honor
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: oauth2-proxy
                  app.kubernetes.io/instance: oauth2-proxy
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

    - path: ./kubernetes-services/additions/oauth2-proxy
      repoURL: {{ .Values.repo_remote }}
      targetRevision: {{ .Values.repo_branch }}

    # oauth2.<cluster_domain>'s HTTPRoute (ADR 0016).
    - path: ./kubernetes-services/additions/ingress
      repoURL: {{ .Values.repo_remote }}
      targetRevision: {{ .Values.repo_branch }}
      helm:
        valuesObject:
          name: oauth2
          cluster_domain: {{ .Values.cluster_domain }}
          service_name: oauth2-proxy
          service_port: 80
          oauth2_proxy: false
          ssl_redirect: {{ if .Values.enable_cloudflare_tunnel }}false{{ else }}true{{ end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
