apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  project: kubernetes
  source:
    chart: sealed-secrets
    repoURL: https://bitnami.github.io/sealed-secrets
    targetRevision: 2.22.0
    helm:
      valuesObject:
        # No automatic key renewal: renewal adds a key but neither retires
        # the old ones nor re-encrypts anything, and it makes every offline
        # key export stale within a month. Rotate by hand instead
        # (docs/how-to/manage-sealed-secrets.md). "0", quoted, disables it.
        keyrenewperiod: "0"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 10s
        maxDuration: 3m
        factor: 2
