apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-prometheus
  namespace: argo-cd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  project: kubernetes
  sources:
    - chart: kube-prometheus-stack
      targetRevision: 93.4.0
      repoURL:  https://prometheus-community.github.io/helm-charts
      helm:
        valuesObject:
          # https://github.dev/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml

          grafana:
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
            admin:
              existingSecret: admin-auth
              userKey: user
              passwordKey: password
            envFromSecrets:
              - name: grafana-oauth-secret
                optional: false
            grafana.ini:
              server:
                root_url: https://grafana.{{ .Values.cluster_domain }}
              users:
                allow_sign_up: true
              auth:
                disable_signup_form: true
                disable_login_form: true
              auth.generic_oauth:
                enabled: true
                name: GitHub (via Dex)
                client_id: grafana
                client_secret: $__env{CLIENT_SECRET}
                auth_url: https://argocd.{{ .Values.cluster_domain }}/api/dex/auth
                token_url: https://argocd.{{ .Values.cluster_domain }}/api/dex/token
                api_url: https://argocd.{{ .Values.cluster_domain }}/api/dex/userinfo
                scopes: openid profile email
                allow_sign_up: true
                email_attribute_path: email
                login_attribute_path: email
                name_attribute_path: name
                use_pkce: true
                tls_skip_verify_insecure: true
                role_attribute_path: "({{- range $i, $e := .Values.admin_emails }}{{- if $i }} || {{ end }}email == '{{ $e }}'{{- end }}) && 'Admin' || 'Viewer'"
                role_attribute_strict: true
            persistence:
              enabled: true
              type: sts
              # Static local-nvme PV (additions/local-storage) pre-bound to
              # the storage-grafana-prometheus-0 PVC with nodeAffinity: node04.
              storageClassName: local-nvme
              accessModes:
                - ReadWriteOnce
              size: 30Gi
              finalizers:
                - kubernetes.io/pvc-protection
            tolerations:
              - key: workstation
                operator: Equal
                value: "true"
                effect: NoSchedule

          prometheus:
            annotations:
              argocd.argoproj.io/skip-health-check: "true"
            prometheusSpec:
              # About 0.5 GB of metrics a day: 60 days is about 30 GB.
              # retentionSize drops the oldest blocks first if it grows
              # faster, well before the 40Gi volume fills.
              retention: 60d
              retentionSize: 35GB
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    # Static local-nvme PV (additions/local-storage) pre-bound
                    # via claimRef to the operator-generated PVC, nodeAffinity: node04.
                    storageClassName: local-nvme
                    accessModes:
                      - ReadWriteOnce
                    resources:
                      requests:
                        storage: 40Gi
              tolerations:
                - key: workstation
                  operator: Equal
                  value: "true"
                  effect: NoSchedule
              # etcd's metrics (see kubeEtcd below). A static target, because
              # the chart's alternative, a Service with hand-made Endpoints,
              # never reaches the cluster: ArgoCD excludes Endpoints and
              # EndpointSlices by default. job "kube-etcd" is the label the
              # chart's etcd rules and dashboard expect.
              additionalScrapeConfigs:
                - job_name: kube-etcd
                  static_configs:
                    - targets:
{{- range .Values.k3s.etcd_metrics_endpoints }}
                        - "{{ . }}:2381"
{{- end }}
{{- if .Values.nas.monitoring.enabled }}
                # The NAS's node-exporter (roles/nas): ZFS pool state, SMART,
                # and the textfile metrics of its scrubs and its nightly copy
                # to the backup pool. Not job "node-exporter", so the chart's
                # node rules (written for cluster nodes) leave it alone; the
                # nas rules below cover it.
                - job_name: nas
                  static_configs:
                    - targets:
{{- range .Values.nas.monitoring.targets }}
                        - "{{ . }}"
{{- end }}
                      labels:
                        instance: gknas
{{- end }}

          alertmanager:
            ingress:
              enabled: true
              ingressClassName: nginx
              annotations:
                nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.oauth2-proxy.svc.cluster.local/oauth2/auth"
                nginx.ingress.kubernetes.io/auth-signin: "https://oauth2.{{ .Values.cluster_domain }}/oauth2/start?rd=https://$host$escaped_request_uri"
                nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Email"
{{- if .Values.enable_cloudflare_tunnel }}
                nginx.ingress.kubernetes.io/ssl-redirect: "false"
{{- end }}
              hosts:
                - alertmanager.{{ .Values.cluster_domain }}
              tls:
                - hosts:
                    - alertmanager.{{ .Values.cluster_domain }}
            alertmanagerSpec:
              # No workstation toleration: workstation nodes reboot outside
              # the kured window, so Alertmanager stays on cluster nodes.
              # The public URL, so links in notifications (and the UI's own)
              # point at the ingress rather than an internal address.
              externalUrl: https://alertmanager.{{ .Values.cluster_domain }}
              # The ntfy alertmanager user's token (a copy of the
              # alertmanager-token key of ntfy-auth in the ntfy namespace),
              # mounted at /etc/alertmanager/secrets/alertmanager-ntfy/.
              secrets:
                - alertmanager-ntfy
            # Notifications go to the owner's phone through the self-hosted
            # ntfy (docs/how-to/monitoring.md, docs/how-to/ntfy.md). Only
            # alerts worth a push are routed there; everything else goes to
            # "null" and stays visible in Alertmanager and Grafana.
            #
            # route.routes, receivers and inhibit_rules are lists, so they
            # replace the chart defaults rather than merging with them: the
            # chart's Watchdog route and its inhibit rules are repeated here.
            config:
              route:
                receiver: "null"
                # One push per problem, not per pod or namespace.
                group_by:
                  - alertname
                # Absorbs flaps and pod reschedules before the first push.
                group_wait: 2m
                group_interval: 30m
                # A still-firing alert is pushed again at most once a day.
                repeat_interval: 24h
                routes:
                  # Watchdog always fires (it could feed an external
                  # dead-man's switch; this cluster does not use one);
                  # InfoInhibitor only drives the inhibition of info alerts.
                  - receiver: "null"
                    matchers:
                      - alertname=~"Watchdog|InfoInhibitor"
                  - receiver: ntfy
                    matchers:
                      - severity="critical"
                  # Warnings worth a push, by name: a new warning rule in
                  # additions/grafana/ reaches ntfy only once it is listed
                  # here. KubeNodeNotReady already waits 15m (its rule's
                  # `for`), and ignores cordoned nodes.
                  - receiver: ntfy
                    matchers:
                      - alertname=~"K3sEtcdBackupFailed|K3sEtcdBackupStale|K3sEtcdBackupNeverSucceeded|K3sEtcdBackupMetricsMissing|OffsiteBackupFailed|OffsiteBackupStale|OffsiteBackupNeverSucceeded|BackupJobFailed|BackupJobStale|BackupJobNeverSucceeded|KubeNodeNotReady|KubePersistentVolumeFillingUp|KubePersistentVolumeInodesFillingUp|NodeFilesystemSpaceFillingUp|NodeFilesystemAlmostOutOfSpace|NodeFilesystemFilesFillingUp|NodeFilesystemAlmostOutOfFiles|CertManagerCertificateExpiringSoon|NasZfsPoolErrors|NasZfsScrubErrors|NasZfsScrubOverdue|NasZfsNeverScrubbed|NasDiskSmartUnhealthy|NasPoolFillingUp|NasBackupPoolCopyStale|NasBackupPoolCopyFailed|NasZfsHoldStale|NasZfsHoldFailed|NasMetricsStale"
              inhibit_rules:
                # Chart defaults: a critical mutes its own warning/info, a
                # warning its own info; InfoInhibitor mutes info alerts in its
                # namespace and is itself always muted. The first two also
                # match instance, mountpoint, persistentvolumeclaim and name
                # (a label absent from both alerts counts as equal), so a
                # critical on one node, volume or certificate does not mute
                # the warning on another: node-exporter alerts all have
                # namespace monitoring, and cert-manager's share an instance.
                - source_matchers:
                    - severity="critical"
                  target_matchers:
                    - severity=~"warning|info"
                  equal:
                    - namespace
                    - alertname
                    - instance
                    - mountpoint
                    - persistentvolumeclaim
                    - name
                - source_matchers:
                    - severity="warning"
                  target_matchers:
                    - severity="info"
                  equal:
                    - namespace
                    - alertname
                    - instance
                    - mountpoint
                    - persistentvolumeclaim
                    - name
                - source_matchers:
                    - alertname="InfoInhibitor"
                  target_matchers:
                    - severity="info"
                  equal:
                    - namespace
                - target_matchers:
                    - alertname="InfoInhibitor"
                # NasDown already reports the NAS's node-exporter as down:
                # mute the chart's generic TargetDown for job nas. TargetDown
                # goes to the null receiver anyway, so this only quiets the
                # Alertmanager UI.
                - source_matchers:
                    - alertname="NasDown"
                  target_matchers:
                    - alertname="TargetDown"
                  equal:
                    - job
                # A NotReady node mutes its own fallout. These two carry the
                # node label, so only that node's alerts are muted.
                - source_matchers:
                    - alertname="KubeNodeNotReady"
                  target_matchers:
                    - alertname=~"KubeNodeUnreachable|KubeletInstanceUnreachable"
                  equal:
                    - node
                # These have no node label (they name a pod, DaemonSet or
                # scrape job), so while any node is NotReady they are muted
                # cluster-wide. They are warnings, routed to "null" anyway;
                # this keeps the Alertmanager UI to the one root cause.
                - source_matchers:
                    - alertname="KubeNodeNotReady"
                  target_matchers:
                    - alertname=~"KubePodNotReady|KubeDaemonSetRolloutStuck|KubeDaemonSetMisScheduled|TargetDown"
              receivers:
                - name: "null"
                - name: ntfy
                  webhook_configs:
                    # In-cluster, straight to the ntfy Service (its
                    # NetworkPolicy admits the Alertmanager pods). ntfy
                    # formats the webhook JSON with its alertmanager-cluster
                    # template (kubernetes-services/additions/ntfy/files/).
                    - url: http://ntfy.ntfy.svc.cluster.local/cluster-alerts?template=alertmanager-cluster&click=https://alertmanager.{{ .Values.cluster_domain }}/
                      send_resolved: true
                      # ntfy rejects a message over 4 KB; the template
                      # summarises at most this many alerts and counts the rest.
                      max_alerts: 5
                      http_config:
                        authorization:
                          type: Bearer
                          credentials_file: /etc/alertmanager/secrets/alertmanager-ntfy/token

          prometheusOperator:
            # TEMPORARY PIN to v0.94.2 (the appVersion of chart 92.22.0, the last
            # release whose images are multi-arch). The v0.95.1 image indexes on
            # quay.io and ghcr.io list only linux/amd64, so these images fail on
            # arm64 nodes with "no match for platform in manifest":
            # https://github.com/prometheus-operator/prometheus-operator/issues/8953
            # REMOVE these tag pins (and the admissionWebhooks one below) once the chart's appVersion is a release
            # whose index lists linux/arm64 again (v0.95.2 or later); check with
            # the registry API before unpinning. Renovate cannot see these tags
            # (they are split registry/repository/tag Helm values), and a
            # kube-prometheus-stack bump does NOT override them, so the pin
            # stays until someone removes it by hand. Recheck it on every bump.
            image:
              tag: v0.94.2
            prometheusConfigReloader:
              image:
                tag: v0.94.2
            admissionWebhooks:
              # Disabled: hook jobs (admission-create/patch) delete themselves before
              # ArgoCD records Succeeded, causing every sync to get permanently stuck.
              # Same fix as ingress-nginx (eaaa0f1). The webhook validates CRD syntax
              # but is not required for operation.
              enabled: false
              # Part of the v0.94.2 pin above: only used if webhooks are re-enabled.
              deployment:
                image:
                  tag: v0.94.2
            # No workstation toleration here or on kube-state-metrics:
            # workstation nodes reboot outside the kured window, so both stay
            # on cluster nodes.

          # Textfile collector for host-side jobs such as the k3s etcd
          # backup timer (roles/etcd_backup). DirectoryOrCreate makes the
          # directory on every node, so nodes without such jobs report an
          # empty collector rather than a NodeTextFileCollectorScrapeError.
          # extraArgs replaces the chart default list, so its two
          # filesystem excludes are repeated here. Recheck them against the
          # chart's values on every kube-prometheus-stack bump.
          prometheus-node-exporter:
            extraArgs:
              - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
              - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
              - --collector.textfile.directory=/host/textfile
            extraHostVolumeMounts:
              - name: textfile
                hostPath: /var/lib/node_exporter/textfile_collector
                type: DirectoryOrCreate
                mountPath: /host/textfile
                readOnly: true

          # K3s bundles scheduler, controller-manager and kube-proxy into the
          # k3s-server process — there are no pods with component=kube-scheduler
          # etc., so the chart-default Services end up with empty endpoints and
          # the matching Down alert rules fire via absent(up{...}). Disable both
          # the scrape targets and the default rules. The same components are
          # still visible via the apiserver and kubelet ServiceMonitors.
          kubeControllerManager:
            enabled: false
          # etcd is embedded in k3s-server too, but it does serve metrics on
          # :2381 of the control plane, which exposes them with
          # etcd-expose-metrics (roles/k3s/templates/k3s-server-config.yml.j2).
          # Prometheus scrapes it through additionalScrapeConfigs above, so
          # the chart's Service and ServiceMonitor are off; kubeEtcd stays
          # enabled for its rules and dashboard. The static target is plain
          # HTTP and sends no credentials.
          kubeEtcd:
            enabled: true
            service:
              enabled: false
            serviceMonitor:
              enabled: false
          kubeScheduler:
            enabled: false
          kubeProxy:
            enabled: false
          defaultRules:
            rules:
              kubeControllerManager: false
              kubeScheduler: false
              kubeProxyAlerting: false
            # etcd has one member (node02). These three only say "the member
            # is down", which every reboot of node02 does (two of them are
            # critical, so they would push); KubeAPIDown already covers a
            # dead control plane. The other etcd rules (latency, failed
            # requests, database size) stay.
            disabled:
              etcdMembersDown: true
              etcdInsufficientMembers: true
              etcdNoLeader: true
{{- if .Values.nas.monitoring.enabled }}
          # Alerts for the NAS (docs/how-to/nas-ubuntu-zfs.md). The pool
          # alerts are critical (pushed); the rest are warnings listed by name
          # in the ntfy route above.
          additionalPrometheusRulesMap:
            nas:
              groups:
                - name: nas
                  rules:
                    - alert: NasDown
                      expr: up{job="nas"} == 0
                      for: 10m
                      labels:
                        severity: critical
                      annotations:
                        summary: The NAS (gknas) is not answering Prometheus.
                        description: >-
                          node-exporter on gknas has not been scraped for
                          10 minutes. The cluster's NFS volumes hang while the
                          NAS is down.
                    - alert: NasZfsPoolNotOnline
                      expr: node_zfs_zpool_state{job="nas", state!="online"} > 0
                      for: 5m
                      labels:
                        severity: critical
                      annotations:
                        summary: A ZFS pool on the NAS is not ONLINE.
                        description: >-
                          A pool on gknas is DEGRADED, FAULTED, SUSPENDED or
                          UNAVAIL. Run `zpool status -x` on the NAS.
                    - alert: NasZfsPoolErrors
                      expr: nas_zpool_errors{job="nas"} > 0
                      for: 15m
                      labels:
                        severity: warning
                      annotations:
                        summary: A ZFS pool on the NAS has read, write or checksum errors.
                        description: >-
                          `zpool status -v` on gknas lists the device; after
                          dealing with it, `zpool clear <pool>`.
                    - alert: NasZfsScrubErrors
                      expr: nas_zpool_scrub_errors{job="nas"} > 0
                      labels:
                        severity: warning
                      annotations:
                        summary: The last scrub of a ZFS pool on the NAS found errors.
                        description: Run `zpool status -v` on gknas.
                    - alert: NasZfsScrubOverdue
                      expr: time() - nas_zpool_scrub_end_timestamp_seconds{job="nas"} > 40 * 86400
                      for: 1h
                      labels:
                        severity: warning
                      annotations:
                        summary: A ZFS pool on the NAS has not been scrubbed for 40 days.
                        description: Check the zfs-scrub-monthly@ timers on gknas.
                    # A pool with no finished scrub at all has no scrub metric
                    # for the rule above: fire once it is 40 days old.
                    - alert: NasZfsNeverScrubbed
                      expr: >-
                        (time() - nas_zpool_created_timestamp_seconds{job="nas"} > 40 * 86400)
                        unless on(zpool) nas_zpool_scrub_end_timestamp_seconds{job="nas"}
                      for: 1h
                      labels:
                        severity: warning
                      annotations:
                        summary: A ZFS pool on the NAS has never finished a scrub in 40 days.
                        description: Check the zfs-scrub-monthly@ timers and `zpool status` on gknas.
                    - alert: NasDiskSmartUnhealthy
                      expr: smartmon_device_smart_healthy{job="nas"} == 0
                      for: 15m
                      labels:
                        severity: warning
                      annotations:
                        summary: A disk in the NAS fails its SMART health check.
                        description: Run `smartctl -a` on the disk on gknas.
                    # From zpool list (nas-zpool-metrics): statfs on a ZFS
                    # dataset shows about the same free fraction however
                    # full the pool is, so node_filesystem_* cannot say.
                    - alert: NasPoolFillingUp
                      expr: >-
                        nas_zpool_allocated_bytes{job="nas"}
                        / nas_zpool_size_bytes{job="nas"} > 0.85
                      for: 1h
                      labels:
                        severity: warning
                      annotations:
                        summary: A ZFS pool on the NAS is over 85% full.
                        description: >-
                          ZFS slows down as a pool fills. Free space on gknas,
                          or prune snapshots (`zfs list -t snapshot`).
                    - alert: NasBackupPoolCopyStale
                      expr: time() - nas_replicate_last_success_timestamp_seconds{job="nas"} > 36 * 3600
                      for: 30m
                      labels:
                        severity: warning
                      annotations:
                        summary: The NAS's nightly copy to its backup pool has not succeeded for 36 hours.
                        description: >-
                          See `journalctl -u nas-replicate` on gknas (is the
                          LaCie plugged in?).
                    # Absent until nas-replicate first runs, which it does
                    # only once the backup pool exists.
                    - alert: NasBackupPoolCopyFailed
                      expr: nas_replicate_last_run_success{job="nas"} == 0
                      for: 15m
                      labels:
                        severity: warning
                      annotations:
                        summary: The NAS's last copy to its backup pool failed.
                        description: >-
                          See `journalctl -u nas-replicate` on gknas (is the
                          LaCie plugged in?).
                    # nas-hold keeps a hold on each dataset's newest weekly
                    # snapshot; the metric is the held snapshot's creation
                    # time (0 if none is held), so a missing hold also fires.
                    - alert: NasZfsHoldStale
                      expr: time() - nas_zfs_held_snapshot_timestamp_seconds{job="nas"} > 8 * 86400
                      for: 1h
                      labels:
                        severity: warning
                      annotations:
                        summary: A dataset on the NAS has no held weekly snapshot newer than 8 days.
                        description: >-
                          No snapshot of a dataset on gknas carries the
                          nas-keep hold, or the held one is over 8 days old.
                          See `journalctl -u nas-hold` and `zfs holds` on its
                          weekly snapshots.
                    - alert: NasZfsHoldFailed
                      expr: nas_zfs_hold_last_run_success{job="nas"} == 0
                      for: 15m
                      labels:
                        severity: warning
                      annotations:
                        summary: The NAS's job that moves the weekly snapshot holds failed.
                        description: See `journalctl -u nas-hold` on gknas.
                    # A textfile metrics file that stops being rewritten
                    # keeps its last values, which then look healthy for
                    # ever: nas_zpool.prom is rewritten every 5 minutes and
                    # smartmon.prom every 15, nas_hold.prom daily at 02:00.
                    # Also fires when one is missing or unreadable (no mtime
                    # then) while node-exporter answers.
                    - alert: NasMetricsStale
                      expr: >-
                        (time() - node_textfile_mtime_seconds{job="nas", file=~".*/(nas_zpool|smartmon)\\.prom"} > 2 * 3600)
                        or
                        (time() - node_textfile_mtime_seconds{job="nas", file=~".*/nas_hold\\.prom"} > 26 * 3600)
                        or
                        node_textfile_scrape_error{job="nas"} > 0
                        or
                        ((absent(node_textfile_mtime_seconds{job="nas", file=~".*/nas_zpool\\.prom"})
                          or absent(node_textfile_mtime_seconds{job="nas", file=~".*/smartmon\\.prom"})
                          or absent(node_textfile_mtime_seconds{job="nas", file=~".*/nas_hold\\.prom"}))
                         and on() up{job="nas"} == 1)
                      for: 15m
                      labels:
                        severity: warning
                      annotations:
                        summary: A metrics file on the NAS is no longer updated.
                        description: >-
                          {{ "{{ $labels.file }}" }} on gknas is out of date: check
                          the timer that writes it (nas-zpool-metrics,
                          prometheus-node-exporter-smartmon or nas-hold) with
                          `systemctl list-timers` and `journalctl -u`.
{{- end }}

    - path: ./kubernetes-services/additions/grafana
      repoURL: {{ .Values.repo_remote }}
      targetRevision: {{ .Values.repo_branch }}

    - path: ./kubernetes-services/additions/ingress
      repoURL: {{ .Values.repo_remote }}
      targetRevision: {{ .Values.repo_branch }}
      helm:
        valuesObject:
          name: grafana
          cluster_domain: {{ .Values.cluster_domain }}
          service_name: grafana-prometheus
          service_port: 80
          oauth2_proxy: false
          ssl_redirect: {{ if .Values.enable_cloudflare_tunnel }}false{{ else }}true{{ end }}
  ignoreDifferences:
  - group: apps
    kind: StatefulSet
    name: grafana-prometheus
    namespace: monitoring
    jqPathExpressions:
    - .spec.volumeClaimTemplates[].metadata.creationTimestamp
    - .spec.volumeClaimTemplates[].status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    # see https://prometheus-operator.dev/docs/platform/troubleshooting/#customresourcedefinition--is-invalid-metadataannotations-too-long-issue
    - ServerSideApply=true
    - CreateNamespace=true
