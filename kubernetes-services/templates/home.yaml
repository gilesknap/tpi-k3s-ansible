apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home
  namespace: argo-cd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: home
  project: kubernetes
  sources:
    # Cluster landing page — nginx serving a static HTML page from a ConfigMap.
    # Provides one-click access to all web frontends at home.<cluster_domain>.
    - path: ./kubernetes-services/additions/home
      repoURL: {{ .Values.repo_remote }}
      targetRevision: {{ .Values.repo_branch }}
      helm:
        valuesObject:
          cluster_domain: {{ .Values.cluster_domain }}
          repo_remote: {{ .Values.repo_remote }}
          enable_minecraft: {{ .Values.enable_minecraft }}

    - path: ./kubernetes-services/additions/ingress
      repoURL: {{ .Values.repo_remote }}
      targetRevision: {{ .Values.repo_branch }}
      helm:
        valuesObject:
          name: home
          cluster_domain: {{ .Values.cluster_domain }}
          service_name: home
          service_port: 80
          oauth2_proxy: false
          ssl_redirect: {{ if .Values.enable_cloudflare_tunnel }}false{{ else }}true{{ end }}

    # Network probe endpoints. home-lan and home-tailnet back the same home
    # service at two DNS-only (grey-clouded) hostnames, pointing at a LAN IP
    # and a tailnet IP of a node running the ingress LoadBalancer. The landing
    # page's JS fetches /healthz on both: a connection succeeds only when the
    # browser is on the LAN or on the tailnet respectively.
    - path: ./kubernetes-services/additions/ingress
      repoURL: {{ .Values.repo_remote }}
      targetRevision: {{ .Values.repo_branch }}
      helm:
        valuesObject:
          name: home-lan
          cluster_domain: {{ .Values.cluster_domain }}
          service_name: home
          service_port: 80
          oauth2_proxy: false
          ssl_redirect: {{ if .Values.enable_cloudflare_tunnel }}false{{ else }}true{{ end }}

    - path: ./kubernetes-services/additions/ingress
      repoURL: {{ .Values.repo_remote }}
      targetRevision: {{ .Values.repo_branch }}
      helm:
        valuesObject:
          name: home-tailnet
          cluster_domain: {{ .Values.cluster_domain }}
          service_name: home
          service_port: 80
          oauth2_proxy: false
          ssl_redirect: {{ if .Values.enable_cloudflare_tunnel }}false{{ else }}true{{ end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
