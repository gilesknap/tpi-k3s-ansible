apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scrap
  namespace: argo-cd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: scrap
  project: kubernetes
  sources:
    # scrap personal knowledge store — the chart CI publishes to ghcr.io (OCI),
    # pinned to a release (chart version == app version == image tag), so a
    # release bump is just targetRevision.
    # https://github.com/gilesknap/scrap/blob/main/charts/scrap/values.yaml
    - repoURL: ghcr.io/gilesknap/charts
      chart: scrap
      targetRevision: 1.3.3
      helm:
        releaseName: scrap
        valuesObject:
          extraEnv:
            - name: SCRAP_PUBLIC_URL
              value: https://scrap.{{ .Values.cluster_domain }}
            - name: TZ
              value: Europe/London

          # /mcp requires a bearer token from the scrap-secrets SealedSecret
          # (additions/scrap); the chart never takes the token as a value.
          mcp:
            tokenSecret:
              name: scrap-secrets
              key: SCRAP_MCP_TOKEN

          # Claude ingest (photo reading, text enrichment) via an API key in
          # the SealedSecret in additions/scrap.
          ingest:
            enabled: true
            existingSecret: scrap-secrets
            # SCRAP_BUDGET_DAY_USD: the day's Claude spend cap (app default $3)
            budgetDayUSD: "20"

          # SQLite needs a local filesystem: static local-nvme PV pinned to
          # nuc2 (additions/local-storage), pre-bound to scrap-data.
          persistence:
            storageClass: local-nvme
            size: 5Gi

          # Nightly `scrap backup` to the NFS-backed default StorageClass.
          backup:
            enabled: true
            timeZone: Europe/London

          # Only ingress-nginx may reach scrap, so clients inside the cluster
          # cannot forge identity headers. scrap has no login of its own.
          networkPolicy:
            enabled: true
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: ingress-nginx

          # Public pages: a static site of the pages marked Public, served at
          # pages.<cluster_domain> from the scrap-public namespace (created in
          # additions/scrap, with the upload token SealedSecret in both
          # namespaces). No oauth2-proxy: it is public, and Cloudflare Access
          # needs a Bypass application for the host (docs/how-to/scrap.md).
          public:
            enabled: true
            site: https://pages.{{ .Values.cluster_domain }}
            # The namespace comes from additions/scrap, not the chart, so
            # turning public off does not delete it and the token Secret in it.
            createNamespace: false
            tokenSecret:
              name: scrap-publish
              key: token
            ingress:
              className: nginx
              annotations:
                nginx.ingress.kubernetes.io/ssl-redirect: {{ if .Values.enable_cloudflare_tunnel }}"false"{{ else }}"true"{{ end }}
              hosts:
                - pages.{{ .Values.cluster_domain }}
              tls:
                - hosts:
                    - pages.{{ .Values.cluster_domain }}
            # Only ingress-nginx may reach nginx; the receiver is open to
            # scrap's pods alone, and the namespace has no egress.
            networkPolicy:
              webFrom:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: ingress-nginx

    # /mcp-only Ingress (no oauth2-proxy), the SealedSecrets and the
    # scrap-public namespace.
    - path: ./kubernetes-services/additions/scrap
      repoURL: {{ .Values.repo_remote }}
      targetRevision: {{ .Values.repo_branch }}
      helm:
        valuesObject:
          cluster_domain: {{ .Values.cluster_domain }}
          ssl_redirect: {{ if .Values.enable_cloudflare_tunnel }}false{{ else }}true{{ end }}
          # Only enable with a scrap release that supports SCRAP_MCP_TOKEN
          # (>= 0.2.0) and mcp.tokenSecret set above; otherwise /mcp would
          # have only Cloudflare in front.
          mcp_ingress_enabled: true

    # Public via the Cloudflare tunnel at scrap.<cluster_domain>. The PWA is
    # gated by Cloudflare Access plus oauth2-proxy; /mcp is split out into its
    # own Ingress (additions/scrap) without oauth2-proxy.
    - path: ./kubernetes-services/additions/ingress
      repoURL: {{ .Values.repo_remote }}
      targetRevision: {{ .Values.repo_branch }}
      helm:
        valuesObject:
          name: scrap
          cluster_domain: {{ .Values.cluster_domain }}
          service_name: scrap
          service_port: 80
          oauth2_proxy: true
          ssl_redirect: {{ if .Values.enable_cloudflare_tunnel }}false{{ else }}true{{ end }}
          extra_annotations:
            nginx.ingress.kubernetes.io/proxy-body-size: 50m
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
