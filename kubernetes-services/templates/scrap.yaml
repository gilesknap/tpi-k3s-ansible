apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scrap
  namespace: argo-cd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: scrap
  project: kubernetes
  sources:
    # scrap personal knowledge store — the chart CI publishes to ghcr.io (OCI),
    # pinned to a release (chart version == app version == image tag), so a
    # release bump is just targetRevision.
    # https://github.com/gilesknap/scrap/blob/main/charts/scrap/values.yaml
    - repoURL: ghcr.io/gilesknap/charts
      chart: scrap
      targetRevision: 1.7.0
      helm:
        releaseName: scrap
        valuesObject:
          extraEnv:
            - name: SCRAP_PUBLIC_URL
              value: https://scrap.{{ .Values.cluster_domain }}
            - name: TZ
              value: Europe/London

          # /mcp requires a bearer token from the scrap-secrets SealedSecret
          # (additions/scrap); the chart never takes the token as a value.
          mcp:
            tokenSecret:
              name: scrap-secrets
              key: SCRAP_MCP_TOKEN

          # Claude ingest (photo reading, text enrichment) via an API key in
          # the SealedSecret in additions/scrap.
          ingest:
            enabled: true
            existingSecret: scrap-secrets
            # SCRAP_BUDGET_DAY_USD: the day's Claude spend cap (app default $3)
            budgetDayUSD: "20"

          # Node-agnostic (ADR 0013): the database is on the pod's emptyDir,
          # replicated by Litestream to /data/litestream; /data is a static
          # NFS PV on the NAS (additions/scrap), so the pod runs on any node.
          # No nodeSelector or affinity on purpose: after `just node-fence`
          # the pod restarts on another node and restores the replica.
          persistence:
            existingClaim: scrap-data-nfs
          litestream:
            enabled: true

          # Nightly `scrap backup --from-replica` to a static NFS PV.
          backup:
            enabled: true
            timeZone: Europe/London
            persistence:
              existingClaim: scrap-backups-nfs
          # gc and the Claude passes run in the pod's jobs container, where an
          # empty timeZone means UTC, not the controller's zone.
          gc:
            timeZone: Europe/London
          enrichRelated:
            timeZone: Europe/London
          enrichTopics:
            timeZone: Europe/London

          # Only ingress-nginx may reach scrap, so clients inside the cluster
          # cannot forge identity headers. scrap has no login of its own.
          networkPolicy:
            enabled: true
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: ingress-nginx

          # Public pages: a static site of the pages marked Public, served at
          # pages.<cluster_domain> from the scrap-public namespace (created in
          # additions/scrap, with the upload token SealedSecret in both
          # namespaces). No oauth2-proxy: it is public, and Cloudflare Access
          # needs a Bypass application for the host (docs/how-to/scrap.md).
          public:
            enabled: true
            site: https://pages.{{ .Values.cluster_domain }}
            # The namespace comes from additions/scrap, not the chart, so
            # turning public off does not delete it and the token Secret in it.
            createNamespace: false
            tokenSecret:
              name: scrap-publish
              key: token
            ingress:
              className: nginx
              annotations:
                nginx.ingress.kubernetes.io/ssl-redirect: {{ if .Values.enable_cloudflare_tunnel }}"false"{{ else }}"true"{{ end }}
              hosts:
                - pages.{{ .Values.cluster_domain }}
              tls:
                - hosts:
                    - pages.{{ .Values.cluster_domain }}
            # Only ingress-nginx may reach nginx; the receiver is open to
            # scrap's pods alone, and the namespace has no egress.
            networkPolicy:
              webFrom:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: ingress-nginx

    # /mcp-only Ingress (no oauth2-proxy), the SealedSecrets, the
    # scrap-public namespace, the static NFS volumes, the off-NAS backup copy
    # and the one-off move from the local volume.
    - path: ./kubernetes-services/additions/scrap
      repoURL: {{ .Values.repo_remote }}
      targetRevision: {{ .Values.repo_branch }}
      helm:
        valuesObject:
          cluster_domain: {{ .Values.cluster_domain }}
          nfs:
            server: {{ .Values.nfs.server | quote }}
            cluster_share_path: {{ .Values.nfs.cluster_share_path | quote }}
          {{- with .Values.local_storage.scrap_backup_copy }}
          backup_copy:
            claim: {{ .claim_name }}
            volume: scrap-backup-copy-local
            size: {{ .capacity }}
          {{- end }}
          {{- with .Values.local_storage.scrap }}
          # The pre-Litestream local volume, kept as a frozen copy.
          legacy:
            claim: {{ .claim_name }}
            volume: scrap-local
            size: {{ .capacity }}
            # The one-off move to NFS (additions/scrap/templates/migrate-job.yaml)
            # is done and checked (scripts/scrap-cutover-check): retired, so a
            # rebuild no longer needs the old volume's node. An install still to
            # move off its local volume sets it true until its move is checked.
            migrate: false
            backups:
              claim: scrap-backups
              storageClass: {{ $.Values.nfs_csi.storage_class }}
          {{- end }}
          ssl_redirect: {{ if .Values.enable_cloudflare_tunnel }}false{{ else }}true{{ end }}
          # Only enable with a scrap release that supports SCRAP_MCP_TOKEN
          # (>= 0.2.0) and mcp.tokenSecret set above; otherwise /mcp would
          # have only Cloudflare in front.
          mcp_ingress_enabled: true

    # Public via the Cloudflare tunnel at scrap.<cluster_domain>. The PWA is
    # gated by Cloudflare Access plus oauth2-proxy; /mcp is split out into its
    # own Ingress (additions/scrap) without oauth2-proxy.
    - path: ./kubernetes-services/additions/ingress
      repoURL: {{ .Values.repo_remote }}
      targetRevision: {{ .Values.repo_branch }}
      helm:
        valuesObject:
          name: scrap
          cluster_domain: {{ .Values.cluster_domain }}
          service_name: scrap
          service_port: 80
          oauth2_proxy: true
          ssl_redirect: {{ if .Values.enable_cloudflare_tunnel }}false{{ else }}true{{ end }}
          extra_annotations:
            nginx.ingress.kubernetes.io/proxy-body-size: 50m
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
