apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-monitor
  namespace: argo-cd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-monitor
  project: kubernetes
  sources:
    - chart: argocd-monitor
      targetRevision: 1.2.0
      repoURL: ghcr.io/epics-containers/charts
      helm:
        valuesObject:
          argocd:
            url: http://argocd-server.argo-cd.svc.cluster.local
          nodeSelector:
            kubernetes.io/arch: amd64
          service:
            type: ClusterIP
            port: 80
          ingress:
            enabled: false
          oauth2Proxy:
            enabled: true
            clientId: argocd-monitor
            issuerUrl: https://argocd.{{ .Values.cluster_domain }}/api/dex
            existingSecret: argocd-monitor-oauth
            extraArgs:
              - --redirect-url=https://argocd-monitor.{{ .Values.cluster_domain }}/oauth2/callback
              - --scope=openid profile email
              - --cookie-name=_oauth2_proxy_monitor
              - --api-route=/api/
              - --prompt=login
          # Grafana dashboard buttons on each Application's pod table. The
          # links target the kube-prometheus-stack dashboards in this
          # cluster's Grafana. Every Application deploys in-cluster, so map
          # the in-cluster destination (by server URL, or by ArgoCD's
          # default cluster name) to it; urlTemplate is left empty so an
          # Application on any other cluster gets no links rather than links
          # to the wrong Grafana. Explore links stay off: Grafana's Viewer
          # role, which non-admins get, cannot open Explore.
          grafana:
            enabled: true
            overrides:
              https://kubernetes.default.svc: https://grafana.{{ .Values.cluster_domain }}
              in-cluster: https://grafana.{{ .Values.cluster_domain }}
            datasourceUid: prometheus
            exploreLinks: false

    - path: ./kubernetes-services/additions/argocd-monitor
      repoURL: {{ .Values.repo_remote }}
      targetRevision: {{ .Values.repo_branch }}

    - path: ./kubernetes-services/additions/ingress
      repoURL: {{ .Values.repo_remote }}
      targetRevision: {{ .Values.repo_branch }}
      helm:
        valuesObject:
          name: argocd-monitor
          cluster_domain: {{ .Values.cluster_domain }}
          service_name: argocd-monitor
          service_port: 80
          oauth2_proxy: false
          ssl_redirect: {{ if .Values.enable_cloudflare_tunnel }}false{{ else }}true{{ end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
