{{- if .Values.enable_jellyfin }}
{{- $jf := .Values.jellyfin }}
{{- $pv := required "local_storage.jellyfin is required with enable_jellyfin" .Values.local_storage.jellyfin }}
{{- if and $jf.trial $jf.seed_from_host }}
{{- fail "jellyfin.trial and jellyfin.seed_from_host are exclusive: a seed replaces the trial config" }}
{{- end }}
{{- $image := printf "docker.io/jellyfin/jellyfin:%s" $jf.image_tag }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argo-cd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: jellyfin
  project: kubernetes
  sources:
    # Jellyfin media server: the upstream chart.
    # https://github.com/jellyfin/jellyfin-helm/blob/master/charts/jellyfin/values.yaml
    # LAN and Tailscale only: no Ingress and no Cloudflare route.
    # See docs/how-to/jellyfin.md.
    - chart: jellyfin
      repoURL: https://jellyfin.github.io/jellyfin-helm
      targetRevision: {{ $jf.chart_version | quote }}
      helm:
        releaseName: jellyfin
        # Helm --set: null deletes a chart default. (A null in valuesObject
        # would not: the API server prunes nulls from it.)
        parameters:
          - name: startupProbe.tcpSocket
            value: "null"
        valuesObject:
          image:
            repository: docker.io/jellyfin/jellyfin
            tag: {{ $jf.image_tag | quote }}

          # One pod on an RWO volume and one SQLite database: never two.
          deploymentStrategy:
            type: Recreate

          # Pinned to the node that holds the config volume and the GPU. The
          # local PV's nodeAffinity pins it too; this makes it explicit.
          nodeSelector:
            kubernetes.io/hostname: {{ $pv.node }}

          # hostNetwork: listens on every host interface, with UDP 7359
          # client discovery. Off for a trial beside a host install
          # (ClusterIP only, reached by kubectl port-forward), so the two
          # cannot clash on 8096/7359. See jellyfin.host_network.
          podPrivileges:
            hostNetwork: {{ $jf.host_network }}
          dnsPolicy: {{ if $jf.host_network }}ClusterFirstWithHostNet{{ else }}ClusterFirst{{ end }}

          serviceAccount:
            automount: false

          # The pod runs as the node's own jellyfin account, so files on the
          # volume keep the owner a host install would give them.
          # supplementalGroups: the node's render group (for
          # /dev/dri/renderD*, root:render 0660, mounted by the Intel GPU
          # device plugin) and video (for /dev/dri/card*).
          podSecurityContext:
            runAsUser: {{ $jf.uid }}
            runAsGroup: {{ $jf.gid }}
            runAsNonRoot: true
            fsGroup: {{ $jf.gid }}
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups:
              - {{ $jf.render_gid }}
              - {{ $jf.video_gid }}
            seccompProfile:
              type: RuntimeDefault
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          # Generous probes: the first start on a copied database, or a
          # database migration after an upgrade, can keep /health failing
          # for minutes. Startup allows 15 minutes (it starts after the init
          # containers, so the seed's copy time does not count); after that,
          # liveness restarts the pod only after about 5 minutes of failures.
          # The chart's default tcpSocket handler is dropped by a parameter
          # below: a probe takes one handler.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3

          # No CPU limit: a transcode burst would be throttled. The GPU comes
          # from the Intel GPU device plugin, not a privileged pod.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
              gpu.intel.com/i915: 1

          # The host install's paths, not the image's /config layout, so the
          # absolute paths in the copied database and XML stay valid. Each
          # is a subdirectory of the config volume (volumeMounts below).
          # HOME is the jellyfin account's home on a host install: it holds
          # .aspnet (the data-protection keys) and plugin tool data.
          jellyfin:
            env:
              - name: JELLYFIN_DATA_DIR
                value: {{ $jf.data_dir }}
              - name: JELLYFIN_CONFIG_DIR
                value: {{ $jf.config_dir }}
              - name: JELLYFIN_LOG_DIR
                value: {{ $jf.log_dir }}
              # The cache (images, and transcodes/ under it) goes on a
              # size-limited emptyDir; the chart's own /cache emptyDir has no
              # sizeLimit and stays unused.
              - name: JELLYFIN_CACHE_DIR
                value: {{ $jf.cache_dir }}
              - name: HOME
                value: {{ $jf.data_dir }}

          # The chart's /config, /media and /cache are unused emptyDirs: the
          # config volume, library and cache are mounted below at a host
          # install's paths. /media is not read-only, so the runtime can
          # create the library's mount point inside it.
          persistence:
            config:
              enabled: false
            media:
              enabled: false
              readOnly: false
            cache:
              enabled: false

          volumes:
            # The static local-nvme PV (local_storage.jellyfin).
            - name: jellyfin-pv
              persistentVolumeClaim:
                claimName: {{ $pv.claim_name }}
            - name: media-nas
              persistentVolumeClaim:
                claimName: jellyfin-media
                readOnly: true
            - name: cache-sized
              emptyDir:
                sizeLimit: {{ $jf.cache_size }}
            {{- if $jf.seed_from_host }}
            # The seed's sources, read-only: the host install is never
            # written, so it stays the rollback copy. Not subject to fsGroup.
            - name: host-data
              hostPath:
                path: {{ $jf.data_dir }}
                type: Directory
            - name: host-config
              hostPath:
                path: {{ $jf.config_dir }}
                type: Directory
            - name: seed-scripts
              configMap:
                name: jellyfin-seed-scripts
            {{- end }}
          volumeMounts:
            - name: jellyfin-pv
              mountPath: {{ $jf.data_dir }}
              subPath: data
            - name: jellyfin-pv
              mountPath: {{ $jf.config_dir }}
              subPath: config
            - name: jellyfin-pv
              mountPath: {{ $jf.log_dir }}
              subPath: log
            - name: media-nas
              mountPath: {{ $jf.media.mount_path }}
              readOnly: true
            - name: cache-sized
              mountPath: {{ $jf.cache_dir }}

          # Init containers, in order. They all mount the config volume's
          # root at /pv. See docs/how-to/jellyfin.md.
          extraInitContainers:
            {{- if $jf.trial }}
            # Trial only: mark the config volume as throwaway, so a later
            # seed can clear it safely (it clears the volume only when this
            # marker is there). The marker is written only on an empty
            # volume or one already marked, so a trial re-enabled later
            # never marks real data.
            - name: mark-trial
              image: {{ $image }}
              command:
                - sh
                - -c
                - >-
                  m=/pv/TRIAL-CONFIG-SAFE-TO-DELETE;
                  if [ -z "$(ls -A /pv)" ] || [ -e "$m" ]; then
                  touch "$m";
                  else echo "/pv holds unmarked data: not marking it as a trial";
                  fi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - name: jellyfin-pv
                  mountPath: /pv
            {{- end }}
            {{- if $jf.seed_from_host }}
            # Seed, step 1: copy the stopped host install into the volume
            # (data/ and config/), unless it is already SEEDED-FROM-HOST.
            # Refuses while the host service looks live, and never clears a
            # volume that is not empty or trial-marked. Runs as the pod's
            # uid (the host files' owner), with no capabilities.
            - name: seed-copy
              image: {{ $image }}
              command:
                - bash
                - /scripts/seed-copy.sh
              env:
                - name: HOST_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.hostIP
                - name: CODECS
                  value: {{ join " " ($jf.seed.hardware_decoding_codecs | default list) | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              # About 25G on one node: page cache needs headroom, not CPU.
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: jellyfin-pv
                  mountPath: /pv
                - name: host-data
                  mountPath: /host/data
                  readOnly: true
                - name: host-config
                  mountPath: /host/config
                  readOnly: true
                - name: seed-scripts
                  mountPath: /scripts
                  readOnly: true
            # Seed, step 2: PRAGMA integrity_check on the copied database,
            # then the SEEDED-FROM-HOST marker. The Jellyfin image has no
            # sqlite3, hence this image.
            - name: seed-verify
              image: {{ $jf.seed.sqlite_image }}
              command:
                - sh
                - /scripts/seed-verify.sh
              env:
                - name: DATA_DIR
                  value: {{ $jf.data_dir }}
                - name: CONFIG_DIR
                  value: {{ $jf.config_dir }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: jellyfin-pv
                  mountPath: /pv
                - name: seed-scripts
                  mountPath: /scripts
                  readOnly: true
            {{- end }}
            # Last: make sure data/, config/ and log/ exist and belong to the
            # pod's uid, so kubelet never creates them (as root) for the
            # subPath mounts. After the seed, so an empty volume still reads
            # as empty to it.
            - name: layout
              image: {{ $image }}
              command:
                - mkdir
                - -p
                - /pv/data
                - /pv/config
                - /pv/log
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - name: jellyfin-pv
                  mountPath: /pv

    # The config claim and the read-only media NFS volume.
    - path: ./kubernetes-services/additions/jellyfin
      repoURL: {{ .Values.repo_remote }}
      targetRevision: {{ .Values.repo_branch }}
      helm:
        valuesObject:
          config:
            claim: {{ $pv.claim_name }}
            volume: jellyfin-local
            size: {{ $pv.capacity }}
          media:
            claim: jellyfin-media
            volume: jellyfin-media-nfs
            server: {{ .Values.nfs.server | quote }}
            path: {{ $jf.media.nfs_path | quote }}
          seed:
            enabled: {{ $jf.seed_from_host }}
            configmap: jellyfin-seed-scripts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
