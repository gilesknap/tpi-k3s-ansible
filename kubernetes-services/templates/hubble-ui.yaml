{{- /* Only with oauth2-proxy: the UI has no login of its own, so without
       the proxy it gets no Ingress at all (use kubectl port-forward). */}}
{{- if .Values.enable_oauth2_proxy }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hubble-ui
  namespace: argo-cd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  project: kubernetes
  sources:
    # The Ingress for Hubble's web UI, which the cilium Application
    # deploys (templates/cilium.yaml). It is its own Application because
    # that template must stay plain YAML for Ansible to read. The UI has no
    # login of its own and shows every flow in the cluster, so it is
    # admin-only behind oauth2-proxy (admin_emails), like Headlamp.
    - path: ./kubernetes-services/additions/ingress
      repoURL: {{ .Values.repo_remote }}
      targetRevision: {{ .Values.repo_branch }}
      helm:
        valuesObject:
          name: hubble
          cluster_domain: {{ .Values.cluster_domain }}
          service_name: hubble-ui
          service_port: 80
          oauth2_proxy: true
          ssl_redirect: {{ if .Values.enable_cloudflare_tunnel }}false{{ else }}true{{ end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
{{- end }}
