# Add existing nodes to ansible control.
#
# This playbook to be run manually, standalone after adding nodes to the
# extra_nodes group in hosts.yml
#
# This is for additional nodes not in a turing pi, meaning that the node will
# need to have had an OS installed on it manually.
# The preferred OS is Ubuntu 24.04 LTS but any recent Debian will be OK.
#
# To add a node, giving ansible control, do this:
#
# - edit hosts.yml and add new nodes to the extra_nodes group
# - ansible-playbook pb_add_nodes.yml -e ansible_user=<your-username> -K
#
# -e ansible_user sets the SSH user (must have sudo on the target node). It
# must be -e, not -u: hosts.yml sets ansible_user for extra_nodes to the
# ansible account, which overrides -u and doesn't exist on a new node yet.
# -K prompts for the sudo (become) password
#
# Re-running this on an existing node is safe: it only adds the key(s) in
# pub_keys/ansible_rsa.pub to the ansible user's authorized_keys, leaving
# any other keys there in place, and rewrites the sudoers drop-in (validated
# by visudo before it is installed).
#
# Now you can do:
# - ansible-playbook pb_all.yml
# the new nodes should get added to your k3s cluster

- name: Add non turingpi nodes to ansible control
  hosts: extra_nodes

  become: true

  tasks:
    - name: Create ansible user (with no password login)
      ansible.builtin.user:
        name: "ansible"
        shell: /bin/bash
        createhome: true
        state: present

    - name: Create ssh directory for ansible user
      ansible.builtin.file:
        dest: "/home/ansible/.ssh"
        state: directory
        owner: "ansible"
        mode: "0700"

    # authorized_key adds the key(s) without touching any others already in
    # the file (such as the Claude sandbox key from the claude_key play in
    # pb_all.yml), and keeps the file owned by ansible with mode 0600. The
    # .pub file may hold several keys, one per line.
    - name: Add keys to ansible users authorized_keys
      ansible.posix.authorized_key:
        user: "ansible"
        key: "{{ lookup('ansible.builtin.file', 'pub_keys/ansible_rsa.pub') }}"
        state: present
        exclusive: false

    - name: Add ansible user to passwordless sudoers
      ansible.builtin.copy:
        content: "ansible ALL=(ALL) NOPASSWD:ALL\n"
        dest: "/etc/sudoers.d/ansible"
        owner: "root"
        group: "root"
        mode: "0440"
        validate: "visudo -cf %s"
