# Nightly encrypted, off-node copies of the k3s etcd snapshot and server
# token, written to the NAS by a systemd timer on the control plane.
# See docs/how-to/backup-restore.md and docs/how-to/recover-control-plane.md.

# age public key (age1...) the bundles are encrypted to. Set it in
# group_vars/all.yml. Empty means the job fails on every run and uploads
# nothing: plaintext never leaves the node.
etcd_backup_age_recipient: ""

# NAS export and the cluster-owned directory on it, read from
# kubernetes-services/values.yaml (nfs.*) so there is one source of truth.
etcd_backup_values: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/kubernetes-services/values.yaml') | from_yaml }}"
etcd_backup_nfs_server: "{{ etcd_backup_values.nfs.server }}"
etcd_backup_nfs_path: "{{ etcd_backup_values.nfs.cluster_share_path }}"

# Mounted only while the job runs (fstab entry is noauto,nofail).
etcd_backup_mount_point: /mnt/k8s-cluster
# Destination below the mount point. Must exist on the NAS and be writable
# by the root-squashed uid (docs/how-to/nas-setup.md).
etcd_backup_dest_subdir: backups/etcd

# Number of nightly bundles kept on the NAS.
etcd_backup_keep: 14

# On-demand snapshots made by other tools (e.g. pre-upgrade-* from the
# system-upgrade-controller server Plan). The newest snapshot for each
# prefix is shipped once, to <dest>/<prefix>/, keeping the last few.
etcd_backup_extra_prefixes:
  - pre-upgrade
etcd_backup_extra_keep: 4

# Before the 00:00 apt / 01:00 k3s patch / 02:30 kured windows.
etcd_backup_on_calendar: "*-*-* 23:15:00 Europe/London"

# node-exporter textfile collector directory on the host (the
# grafana-prometheus app mounts it into node-exporter).
etcd_backup_textfile_dir: /var/lib/node_exporter/textfile_collector
