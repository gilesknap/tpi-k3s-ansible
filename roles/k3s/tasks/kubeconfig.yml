- name: Read kubeconfig from /etc/rancher/k3s/k3s.yaml
  ansible.builtin.command:
    cmd: cat /etc/rancher/k3s/k3s.yaml
  delegate_to: "{{ control_plane }}"
  become: true
  register: k3s_kube_config
  changed_when: false
  # The kubeconfig holds the cluster admin key: keep it out of -v and
  # --diff output.
  no_log: true
  diff: false
  # Read-only: run in --check too, so later tasks see real data.
  check_mode: false
  run_once: true

- name: Write kubeconfig to $HOME/.kube/config
  ansible.builtin.copy:
    content: "{{ k3s_kubeconfig_new }}"
    dest: "$HOME/.kube/config"
    mode: "0600"
  diff: false
  # Only when the cluster or its admin credentials differ. The write
  # replaces the whole file, so it would undo local kubectl edits (a
  # context namespace, extra contexts) and report changed on every run.
  when: >-
    (k3s_kubeconfig_old | from_yaml | default({}, true)).get('clusters') != (k3s_kubeconfig_new | from_yaml).clusters
    or (k3s_kubeconfig_old | from_yaml | default({}, true)).get('users') != (k3s_kubeconfig_new | from_yaml).users
  vars:
    # Use the API name, not the node's IP, so the kubeconfig survives a
    # control plane move.
    k3s_kubeconfig_new: "{{ k3s_kube_config.stdout | regex_replace('https://127\\.0\\.0\\.1:6443', 'https://' ~ k3s_api_name ~ ':6443') }}"
    k3s_kubeconfig_old: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'HOME') ~ '/.kube/config', errors='ignore') }}"
  delegate_to: localhost
  run_once: true
