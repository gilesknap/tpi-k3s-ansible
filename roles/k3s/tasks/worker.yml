# Install a k3s worker node

- name: Get the control plane facts
  ansible.builtin.setup:
    filter: ansible_default_ipv4
  delegate_to: "{{ control_plane }}"
  delegate_facts: true

- name: Wait for /var/lib/rancher/k3s/server/node-token
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    state: present
  delegate_to: "{{ control_plane }}"

- name: List nodes in the cluster
  ansible.builtin.command:
    cmd: kubectl get nodes
  delegate_to: "{{ control_plane }}"
  register: k3s_nodes
  changed_when: false
  # Read-only: run in --check too, so later tasks see real data.
  check_mode: false

- name: Check if this node is already in the cluster
  ansible.builtin.set_fact:
    k3s_in_cluster: |
      {{ k3s_nodes.stdout is search(inventory_hostname + " *Ready") }}

- name: Remove k3s worker if k3s_force=true or the node is not in the cluster
  ansible.builtin.command:
    cmd: k3s-agent-uninstall.sh
    removes: /usr/local/bin/k3s-agent-uninstall.sh
  # uninstall if the node has been deleted from the cluster or force is true
  when: k3s_force or not k3s_in_cluster

- name: Remove the node from the cluster if it is not ready
  ansible.builtin.command:
    cmd: kubectl delete node {{ inventory_hostname }}
  delegate_to: "{{ control_plane }}"
  when: k3s_nodes.stdout is search(inventory_hostname + " *NotReady")
  changed_when: true

- name: Get the node token
  ansible.builtin.command:
    cmd: cat /var/lib/rancher/k3s/server/node-token
  delegate_to: "{{ control_plane }}"
  register: k3s_node_token
  changed_when: false
  # Read-only: run in --check too, so later tasks see real data.
  check_mode: false

- name: Read the k3s version the control plane runs
  ansible.builtin.command:
    cmd: kubectl get node {{ control_plane }} -o jsonpath={.status.nodeInfo.kubeletVersion}
  delegate_to: "{{ control_plane }}"
  register: k3s_control_plane_version
  changed_when: false
  # Read-only: run in --check too, so later tasks see real data.
  check_mode: false

- name: Install k3s worker node {{ k3s_version | default(k3s_control_plane_version.stdout) }}
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version | default(k3s_control_plane_version.stdout) }}"
    K3S_URL: "https://{{ k3s_api_name }}:6443"
    K3S_TOKEN: "{{ k3s_node_token.stdout }}"
    INSTALL_K3S_EXEC: >-
      {% if node_ip is defined %}--node-ip={{ node_ip }}{% endif %}
      {% if flannel_iface is defined %} --flannel-iface={{ flannel_iface }}{% endif %}
  register: k3s_installed
  changed_when: true
  when: k3s_force or not k3s_in_cluster

# Agents installed before k3s_api_name existed joined the control plane by
# IP. The installer keeps K3S_URL in this env file; rewrite it so every
# agent follows the API name, and restart the agent to pick it up. The
# agent resets its client load balancer when the server URL changes.
- name: Check for the k3s agent environment file
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s-agent.service.env
  register: k3s_agent_env

- name: Point the k3s agent at {{ k3s_api_name }}
  ansible.builtin.lineinfile:
    path: /etc/systemd/system/k3s-agent.service.env
    regexp: "^K3S_URL="
    line: "K3S_URL='https://{{ k3s_api_name }}:6443'"
  when: k3s_agent_env.stat.exists
  # The file also holds K3S_TOKEN: keep it out of --diff output.
  diff: false
  notify: Restart k3s-agent

- name: Set the k3s_install_occurred fact
  ansible.builtin.set_fact:
    k3s_install_occurred: "{{ k3s_installed is changed }}"

- name: Label NVIDIA GPU nodes so the device plugin DaemonSet can schedule there
  ansible.builtin.command:
    cmd: kubectl label node {{ inventory_hostname }} nvidia.com/gpu.present=true --overwrite
  delegate_to: "{{ control_plane }}"
  when: nvidia_gpu_node | default(false)
  changed_when: true

- name: Taint workstation nodes with workstation=true:NoSchedule
  ansible.builtin.command:
    cmd: kubectl taint node {{ inventory_hostname }} workstation=true:NoSchedule --overwrite
  delegate_to: "{{ control_plane }}"
  when: workstation | default(false)
  changed_when: true

- name: Label workstation nodes with node-role=workstation
  ansible.builtin.command:
    cmd: kubectl label node {{ inventory_hostname }} node-role=workstation --overwrite
  delegate_to: "{{ control_plane }}"
  when: workstation | default(false)
  changed_when: true
