# install K3s on each node

# When running with --limit <worker>, the control plane may not have had its
# facts gathered in this play. Collect them via delegation so k3s_control_plane_ip
# is always available regardless of the --limit value.
- name: Gather facts from control plane if not already collected
  ansible.builtin.setup:
  delegate_to: "{{ control_plane }}"
  delegate_facts: true
  when: hostvars[control_plane]['ansible_facts'] is not defined
        or 'default_ipv4' not in (hostvars[control_plane]['ansible_facts'] | default({}))

# determine if this node is the control plane
- name: Check if control plane
  ansible.builtin.set_fact:
    k3s_is_control_plane: "{{ control_plane == inventory_hostname }}"
    k3s_control_plane_ip: "{{ hostvars[control_plane]['ansible_facts']['default_ipv4']['address'] }}"

# k3s_api_name is what agents join and kubectl uses, so it must resolve to
# the control plane before the role switches anything to it. Checked on
# every node and on the controller. In check mode a mismatch only warns,
# so a preview still runs before the DNS record exists.
- name: Resolve the API name {{ k3s_api_name }}
  ansible.builtin.command:
    cmd: getent ahostsv4 {{ k3s_api_name }}
  register: k3s_api_name_lookup
  changed_when: false
  failed_when: false
  check_mode: false

- name: Check the API name resolves to the control plane
  ansible.builtin.assert:
    that:
      - k3s_api_name_lookup.rc == 0
      - k3s_api_name_lookup.stdout.split()[0] == k3s_control_plane_ip
    fail_msg: >-
      {{ k3s_api_name }} resolves to
      '{{ (k3s_api_name_lookup.stdout.split() + ['nothing'])[0] }}' on
      {{ inventory_hostname }}, not to {{ control_plane }}
      ({{ k3s_control_plane_ip }}). Point the {{ k3s_api_name }} DNS record
      at the control plane first (see k3s_api_name in group_vars/all.yml).
    quiet: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Resolve the API name on the controller
  ansible.builtin.command:
    cmd: getent ahostsv4 {{ k3s_api_name }}
  register: k3s_api_name_lookup_local
  changed_when: false
  failed_when: false
  check_mode: false
  delegate_to: localhost
  become: false
  run_once: true

- name: Check the API name resolves to the control plane on the controller
  ansible.builtin.assert:
    that:
      - k3s_api_name_lookup_local.rc == 0
      - k3s_api_name_lookup_local.stdout.split()[0] == k3s_control_plane_ip
    fail_msg: >-
      {{ k3s_api_name }} does not resolve to {{ k3s_control_plane_ip }} on
      the controller, so the kubeconfig written for it would not work.
    quiet: true
  ignore_errors: "{{ ansible_check_mode }}"
  run_once: true

- name: Output control plane status
  ansible.builtin.debug:
    var: k3s_is_control_plane

- name: Get k3s script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

# Which k3s an install uses: the control plane takes the newest patch of
# the k3s_minor release channel, and a worker joins at the version the
# control plane runs now, so an agent never runs ahead of the server
# (system-upgrade-controller then moves them all to the newest patch).
# `-e k3s_version=v1.34.6+k3s1` overrides both, but must stay on the
# k3s_minor line. Refuse outright if a node already runs a newer minor than
# k3s_minor: that would be a downgrade.
- name: Check k3s_version is on the k3s_minor line
  ansible.builtin.assert:
    that:
      - k3s_version is match('^' ~ (k3s_minor | regex_escape) ~ '\\.')
    fail_msg: >-
      k3s_version {{ k3s_version }} is not a {{ k3s_minor }} release. Change
      k3s.minor in kubernetes-services/values.yaml to move to another minor.
    quiet: true
  when: k3s_version is defined

- name: Read the installed k3s version
  ansible.builtin.command: k3s --version
  register: k3s_installed_version
  changed_when: false
  # Read-only: run in --check too, so later tasks see real data.
  check_mode: false
  failed_when: false

- name: Refuse to downgrade k3s to an older minor version
  ansible.builtin.assert:
    that:
      - k3s_running_minor is version(k3s_minor | regex_replace('^v', ''), '<=')
    fail_msg: >-
      {{ inventory_hostname }} runs k3s {{ k3s_running_minor }}, newer than
      k3s_minor {{ k3s_minor }}. Update k3s.minor in
      kubernetes-services/values.yaml instead of downgrading.
    quiet: true
  vars:
    # `k3s --version` prints "k3s version v1.34.6+k3s1 (<hash>)" first.
    k3s_running_minor: >-
      {{ (k3s_installed_version.stdout.split()[2] | regex_replace('^v', '')).split('.')[:2] | join('.') }}
  when: k3s_installed_version.rc == 0

# Before the k3s install, so containerd's first container already gets the
# corrected profile. Tagged so it can run alone: --tags apparmor.
- name: Install the containerd AppArmor profile
  ansible.builtin.import_tasks: apparmor.yml
  tags: apparmor

- name: Execute control plane tasks
  ansible.builtin.include_tasks: control.yml
  when: k3s_is_control_plane

- name: Configure kubectl for the execution environment
  ansible.builtin.include_tasks: kubeconfig.yml

- name: Execute worker node tasks
  ansible.builtin.include_tasks: worker.yml
  when: not k3s_is_control_plane

- name: Wait for all kube-system pods become created
  ansible.builtin.command:
    kubectl get pod -n kube-system --output jsonpath='{.items[*].metadata.name}'
  delegate_to: localhost
  run_once: true
  register: k3s_control_plane_pods_created
  until: item in k3s_control_plane_pods_created.stdout
  retries: 6
  delay: 10
  loop:
    - coredns
    - local-path-provisioner
    - metrics-server
  changed_when: false
  # Read-only: run in --check too, so later tasks see real data.
  check_mode: false

- name: Wait for all pods become ready
  ansible.builtin.command:
    kubectl wait -n kube-system pods --all --for condition=Ready --timeout=100s
  delegate_to: localhost
  run_once: true
  register: k3s_control_plane_pods_ready
  changed_when: false
  # Read-only: run in --check too, so later tasks see real data.
  check_mode: false
