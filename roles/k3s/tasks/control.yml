# Install the control plane for k3s

- name: Remove k3s control plane if k3s_force=true
  ansible.builtin.command:
    cmd: k3s-uninstall.sh
    removes: /usr/local/bin/k3s-uninstall.sh
  when: k3s_force | bool

- name: Create K3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Deploy K3s server configuration
  ansible.builtin.template:
    src: k3s-server-config.yml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
  notify: Restart k3s

# INSTALL_K3S_VERSION, when set, wins over the channel.
- name: Install k3s control plane {{ k3s_version | default('from release channel ' ~ k3s_minor) }}
  ansible.builtin.shell:
    cmd: >
      INSTALL_K3S_CHANNEL="{{ k3s_minor }}"
      INSTALL_K3S_VERSION="{{ k3s_version | default('') }}"
      INSTALL_K3S_EXEC="server"
      /usr/local/bin/k3s-install.sh
    creates: /var/lib/rancher/k3s/server/node-token
  when: k3s_is_control_plane
  register: k3s_installed

# Restart now if the config changed (e.g. a new tls-san), not at the end of
# the play: the workers below switch to k3s_api_name, which the serving
# certificate must already carry.
- name: Apply a changed k3s server configuration
  ansible.builtin.meta: flush_handlers

- name: Wait for the API server
  ansible.builtin.command:
    cmd: k3s kubectl get --raw /readyz
  register: k3s_readyz
  until: k3s_readyz.rc == 0
  retries: 30
  delay: 5
  changed_when: false
  # Read-only: run in --check too, so later tasks see real data.
  check_mode: false

- name: Set the k3s_install_occurred fact
  ansible.builtin.set_fact:
    k3s_install_occurred: "{{ k3s_installed is changed }}"
