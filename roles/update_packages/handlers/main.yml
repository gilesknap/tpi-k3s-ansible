- name: Restart k3s-agent
  # On a fresh-bootstrap rebuild, the GPU node containerd template task fires
  # this handler before k3s has been installed. Skip the restart if the
  # service unit is not loaded yet — k3s install in the next play will pick
  # up the new template on first start.
  ansible.builtin.service:
    name: k3s-agent
    state: restarted
  failed_when: false

- name: Restart apt-daily-upgrade timer
  ansible.builtin.systemd:
    name: apt-daily-upgrade.timer
    state: restarted
    daemon_reload: true

- name: Ask for a reboot to load the NVIDIA driver
  ansible.builtin.file:
    path: /var/run/reboot-required
    state: touch
    mode: "0644"

# logind is Type=notify-reload: a reload re-reads logind.conf.d and leaves
# every session alone. Never restart it, which can end desktop sessions.
- name: Reload logind
  ansible.builtin.systemd_service:
    name: systemd-logind
    state: reloaded

- name: Compile the GSettings schemas
  ansible.builtin.command: glib-compile-schemas /usr/share/glib-2.0/schemas
  changed_when: true
