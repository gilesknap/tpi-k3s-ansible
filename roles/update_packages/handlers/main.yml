- name: Restart k3s-agent
  # On a fresh-bootstrap rebuild, the GPU node containerd template task fires
  # this handler before k3s has been installed. Skip the restart if the
  # service unit is not loaded yet — k3s install in the next play will pick
  # up the new template on first start.
  ansible.builtin.service:
    name: k3s-agent
    state: restarted
  failed_when: false

- name: Restart apt-daily-upgrade timer
  ansible.builtin.systemd:
    name: apt-daily-upgrade.timer
    state: restarted
    daemon_reload: true

- name: Ask for a reboot to load the NVIDIA driver
  ansible.builtin.file:
    path: /var/run/reboot-required
    state: touch
    mode: "0644"
