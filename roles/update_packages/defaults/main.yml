# When unattended-upgrades runs each night (systemd OnCalendar syntax). Keep
# it before the k3s upgrade and kured windows in
# kubernetes-services/values.yaml, so a new kernel is rebooted into the
# same night.
update_packages_upgrade_on_calendar: "*-*-* 00:00 Europe/London"
update_packages_upgrade_random_delay: 30m
