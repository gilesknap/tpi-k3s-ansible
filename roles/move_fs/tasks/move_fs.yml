- name: Determine the current root device for the node
  ansible.builtin.set_fact:
    move_fs_curr_root_dev: "{{ ansible_facts['mounts'] | json_query('[?mount == `/`].device') | first }}"

# An RK1 that the flash role has just flashed runs Ubuntu's preinstalled
# server image from the eMMC (the staging OS). It installs the same image on
# root_dev (the NVMe), clears the eMMC's partition table so U-Boot boots the
# NVMe, and reboots into it. See roles/flash/tasks/rk1_install_nvme.yml.
#
# Once the root is on root_dev, this does nothing: re-flashing the node
# (flash_force) is the only way to reinstall it.
- name: Move the root filesystem of the node to {{ move_fs_root_dev }}
  when: not move_fs_curr_root_dev.startswith(move_fs_root_dev)
  block:
    - name: Fail for a node type move_fs cannot install
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} has root_dev {{ move_fs_root_dev }} but type
          {{ type | default('unset') }}: move_fs only installs RK1 nodes.
      when: type | default('') != 'rk1'

    - name: Install Ubuntu on the NVMe of the RK1
      ansible.builtin.include_role:
        name: flash
        tasks_from: rk1_install_nvme.yml
      vars:
        flash_rk1_target_dev: "{{ move_fs_root_dev }}"
