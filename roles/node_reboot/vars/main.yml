# The k3s unit on this node. Its unit file existing means k3s is
# installed, so the node is expected to be in the cluster.
node_reboot_k3s_unit: "{{ 'k3s.service' if inventory_hostname == control_plane else 'k3s-agent.service' }}"

# Present while node_reboot holds the node cordoned; the node is
# uncordoned after its reboot only then, so a node cordoned by hand stays
# cordoned.
node_reboot_drain_marker: /var/lib/node_reboot/drained
