- name: Extract the group that lists this turing pi's nodes
  ansible.builtin.set_fact:
    flash_nodes: "{{ groups[inventory_hostname + '_nodes'] }}"

# The BMC has no Python, so file copies and the long-running tpi flash
# (which needs async, and raw cannot do async) run on the controller as
# scp and ssh. They use this play's SSH settings for the BMC: the key from
# ansible_ssh_private_key_file or --private-key, and ansible_ssh_common_args.
- name: Set the SSH options for commands the controller runs on the BMC
  vars:
    flash_bmc_key: "{{ ansible_ssh_private_key_file | default(ansible_private_key_file | default('')) }}"
  ansible.builtin.set_fact:
    flash_bmc_ssh_opts: >-
      -o BatchMode=yes
      {{ ('-o Port=' ~ ansible_port) if ansible_port is defined else '' }}
      {{ ('-i ' ~ (flash_bmc_key | quote)) if flash_bmc_key | length > 0 else '' }}
      {{ ansible_ssh_common_args | default('') }}
    flash_bmc_target: "{{ ansible_user | default(tpi_user) }}@{{ ansible_host | default(inventory_hostname) }}"

- name: List the nodes for '{{ inventory_hostname }}'
  ansible.builtin.debug:
    var: flash_nodes

- name: Check if the control plane node is contactable
  ansible.builtin.include_tasks: node_status.yml
  vars:
    node_name: "{{ control_plane }}"

- name: Abort if user does not want to re-flash the control plane
  ansible.builtin.fail:
    msg: "User aborted the re-flash of the control plane"
  when: hostvars['localhost'].do_abort | default('y') != 'y'

- name: Process the nodes for '{{ inventory_hostname }}'
  ansible.builtin.include_tasks: node.yml
  loop: "{{ flash_nodes }}"
  loop_control:
    loop_var: node_name
