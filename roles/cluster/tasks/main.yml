# perform any final cluster setup first

# k8s_taint merges into the node's existing taints, where a kubernetes.core.k8s
# patch of spec.taints would replace the whole list (Node taints have no
# strategic-merge key), dropping e.g. a cordon's unschedulable taint.
- name: Taint the control plane node to keep workloads off
  kubernetes.core.k8s_taint:
    name: "{{ control_plane }}"
    taints:
      - key: node-role.kubernetes.io/master
        effect: NoSchedule
  when: groups['all_nodes'] | length > 1

# The warm-standby control plane (docs/how-to/recover-control-plane.md) is
# kept light with a soft taint: the scheduler avoids it while other nodes
# have room, but can still use it. Skipped when unset, or when it names the
# control plane itself (the NoSchedule taint above covers that node).
- name: Find nodes carrying the standby control plane taint
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
  register: cluster_nodes
  when: groups['all_nodes'] | length > 1

- name: Remove the standby taint from nodes that are no longer the standby
  kubernetes.core.k8s_taint:
    name: "{{ cluster_old_standby }}"
    state: absent
    taints:
      - key: node-role.kubernetes.io/standby-control-plane
        effect: PreferNoSchedule
  # Match on key and effect only, as k8s_taint does, whatever the value.
  loop: >-
    {{ cluster_nodes.resources
       | map(attribute='metadata.name')
       | reject('equalto', cluster_standby_target)
       | list }}
  loop_control:
    loop_var: cluster_old_standby
  vars:
    cluster_standby_target: >-
      {{ (standby_control_plane | default('', true) != control_plane)
         | ternary(standby_control_plane | default('', true), '') }}
    cluster_node_taints: >-
      {{ (cluster_nodes.resources
          | selectattr('metadata.name', 'equalto', cluster_old_standby)
          | first).spec.taints | default([]) }}
  when:
    - groups['all_nodes'] | length > 1
    - cluster_node_taints
      | selectattr('key', 'equalto', 'node-role.kubernetes.io/standby-control-plane')
      | selectattr('effect', 'equalto', 'PreferNoSchedule')
      | list | length > 0

# k8s_taint fails on a node the cluster doesn't know (powered off during a
# rebuild, never joined, or a typo), which would abort the play before
# ArgoCD is installed: warn and skip instead.
- name: Warn that the standby control plane is not a cluster node
  ansible.builtin.debug:
    msg: >-
      standby_control_plane {{ standby_control_plane }} is not registered
      in the cluster, so its PreferNoSchedule taint was skipped. Re-run
      --tags cluster once it has joined, or fix the name.
  when:
    - groups['all_nodes'] | length > 1
    - standby_control_plane | default('', true) | length > 0
    - standby_control_plane != control_plane
    - standby_control_plane not in cluster_nodes.resources | map(attribute='metadata.name')

- name: Taint the standby control plane node PreferNoSchedule
  kubernetes.core.k8s_taint:
    name: "{{ standby_control_plane }}"
    taints:
      - key: node-role.kubernetes.io/standby-control-plane
        effect: PreferNoSchedule
  when:
    - groups['all_nodes'] | length > 1
    - standby_control_plane | default('', true) | length > 0
    - standby_control_plane != control_plane
    - standby_control_plane in cluster_nodes.resources | map(attribute='metadata.name')


# install services - only ArgoCD for now - it adds everything else

- name: Cluster Install of services
  ansible.builtin.include_tasks: "{{ cluster_service }}.yml"
  loop: "{{  cluster_install_list }}"
  when: cluster_install_list is defined
  loop_control:
    loop_var: cluster_service

# Split-horizon DNS: resolve cluster subdomains to the ingress ClusterIP from
# inside the cluster, so pods calling Dex (argocd.<domain>) don't hairpin
# through Cloudflare. Without this, argocd-server's OIDC token exchange
# against `https://argocd.<domain>/api/dex` gets intercepted by Cloudflare
# Access and returns HTML, breaking SSO login with
# `expected Content-Type = application/json, got "text/html"`.
#
# Must run *after* argocd.yml because ingress-nginx is provisioned by
# ArgoCD as part of the cluster services sync — on a fresh bootstrap the
# Service doesn't exist until the root Application fans out. Wait for it
# to appear, then write the override. K3s CoreDNS imports
# /etc/coredns/custom/*.server as separate server blocks from the
# coredns-custom ConfigMap.
- name: Wait for NGINX ingress Service to be provisioned by ArgoCD
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    namespace: ingress-nginx
    name: ingress-ingress-nginx-controller
  register: cluster_ingress_svc
  retries: 60
  delay: 5
  until: cluster_ingress_svc.resources | length > 0

- name: Create CoreDNS split-horizon override for cluster domain
  kubernetes.core.k8s:
    force: true
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: coredns-custom
        namespace: kube-system
      data:
        cluster-domain.server: |
          argocd.{{ cluster_domain }}:53 {
            hosts {
              {{ cluster_ingress_svc.resources[0].spec.clusterIP }} argocd.{{ cluster_domain }}
            }
          }
  register: cluster_coredns_override
  notify: Restart ArgoCD server

# CoreDNS reloads the Corefile every 15s via the `reload` directive, but
# argocd-server has already cached the old Cloudflare-resolved address in
# its HTTP client connection pool. Restart it so subsequent OIDC token
# exchanges resolve the new in-cluster IP.
- name: Flush handlers to restart ArgoCD server before continuing
  ansible.builtin.meta: flush_handlers

# kube-prometheus-stack's webhook TLS secret is normally created by a Helm
# hook job, but ArgoCD prunes hook jobs so the secret never appears.
# Delegate to the script to keep cert generation (including the SAN list
# required by the operator ServiceMonitor) in one place. (#6 rebuild checklist)
- name: Create Prometheus admission webhook TLS secret
  ansible.builtin.command:
    cmd: scripts/create-prometheus-admission-secret
    chdir: "{{ playbook_dir }}"
  changed_when: true
