# Datasets on the main pool, and the cluster's directories inside them.
# Nothing here destroys or empties anything: a dataset or directory removed
# from the lists is left as it is.

- name: Create the datasets
  community.general.zfs:
    name: "{{ item.name }}"
    state: present
    extra_zfs_properties: "{{ item.properties | default({}) }}"
  loop: "{{ nas_datasets }}"
  loop_control:
    label: "{{ item.name }}"
  when: nas_pools_present[nas_pool] | default(false)

# A dataset received from the backup pool (a restore) arrives unmounted.
# With overlay=off (set on the pool), zfs mount refuses a mount point that
# has files in it, so nothing is hidden.
- name: Read which datasets are mounted
  ansible.builtin.command: zfs list -H -o name,mounted {{ nas_datasets | map(attribute='name') | join(' ') }}
  register: nas_datasets_before
  changed_when: false
  failed_when: false
  check_mode: false
  when: nas_pools_present[nas_pool] | default(false)

- name: Mount the datasets
  ansible.builtin.command: zfs mount -a
  when:
    - nas_pools_present[nas_pool] | default(false)
    - nas_datasets_before.stdout_lines | default([]) | select('match', '.*\tno$') | list | length > 0
  changed_when: true

- name: Check every dataset is mounted
  ansible.builtin.command: zfs list -H -o name,mounted {{ nas_datasets | map(attribute='name') | join(' ') }}
  register: nas_datasets_mounted
  changed_when: false
  check_mode: false
  # In check mode a dataset the play would create does not exist yet.
  failed_when: >-
    (nas_datasets_mounted.rc != 0
     and not (ansible_check_mode
              and nas_datasets_mounted.stderr_lines | reject('search', 'dataset does not exist') | list | length == 0))
    or nas_datasets_mounted.stdout_lines | reject('match', '.*\tyes$') | list | length > 0
  when: nas_pools_present[nas_pool] | default(false)

- name: Create the cluster's directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode | default(omit) }}"
  loop: "{{ nas_directories }}"
  loop_control:
    label: "{{ item.path }}"
  when: nas_pools_present[nas_pool] | default(false)
