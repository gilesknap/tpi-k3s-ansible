# use this to get to the grafana web UI if you have no ingress
- name: Create port forward script for Grafana
  ansible.builtin.copy:
    dest: "{{ bin_dir }}/grafana.sh"
    content: |
      #!/bin/bash

      # Start a port-forward to the Grafana and background it
      nohup kubectl -n monitoring port-forward sts/grafana-prometheus 3000 &> /tmp/grafana-proxy.out &

      echo
      echo Grafana will be available at:
      echo   http://localhost:3000
      echo or
      echo   https://grafana.{{ cluster_domain }}
    mode: "0755"

# use this to get to the ArgoCD web UI if you have no ingress
- name: Create port forward script for ArgoCD
  ansible.builtin.copy:
    dest: "{{ bin_dir }}/argo.sh"
    content: |
      #!/bin/bash

      # Start a port-forward to the ArgoCD and background it
      nohup kubectl port-forward service/argocd-server -n argo-cd 8080:80 &

      echo
      echo ArgoCD will be available at:
      echo   https://argocd.{{ cluster_domain }}
      echo   or http://localhost:8080
      echo   Login via GitHub \(Dex\)

    mode: "0755"

# this script generates a Headlamp login token and starts a port-forward
# that can be used if there is no ingress
- name: Create Headlamp connection script
  ansible.builtin.copy:
    dest: "{{ bin_dir }}/dashboard.sh"
    content: |
      #!/bin/bash

      # Start a port-forward to Headlamp and background it
      nohup kubectl -n headlamp port-forward svc/headlamp 4466:80 &> /tmp/headlamp-proxy.out &

      # Headlamp asks for a ServiceAccount token at login (after oauth2-proxy
      # on the ingress; the port-forward skips oauth2-proxy)
      echo Login Token:
      kubectl -n headlamp create token headlamp --duration=24h
      echo
      echo
      echo "Headlamp will be available at:"
      echo "  https://headlamp.{{ cluster_domain }}"
      echo "or"
      echo "  http://localhost:4466"
    mode: "0755"
