# Copy kubeconfig from the control plane so the devcontainer can talk to the
# cluster. This duplicates roles/k3s/tasks/kubeconfig.yml (no k3s role facts
# required). Both point the kubeconfig at k3s_api_name, not the node's IP.
# Fails gracefully when the control plane is unreachable (e.g. first run
# before k3s is installed).

- name: Gather facts from control plane for kubeconfig
  ansible.builtin.setup:
  delegate_to: "{{ control_plane }}"
  delegate_facts: true
  ignore_errors: true
  register: tools_cp_facts

- name: Read kubeconfig from control plane
  ansible.builtin.command:
    cmd: cat /etc/rancher/k3s/k3s.yaml
  delegate_to: "{{ control_plane }}"
  become: true
  register: tools_kube_config
  changed_when: false
  # The kubeconfig holds the cluster admin key: keep it out of -v and
  # --diff output.
  no_log: true
  diff: false
  ignore_errors: true
  when: tools_cp_facts is succeeded

# Parse the controller's current kubeconfig, to write it only when the
# cluster or its admin credentials differ. A missing file, or one that is
# not a YAML mapping, counts as empty and is replaced.
- name: Read the current $HOME/.kube/config
  when:
    - tools_cp_facts is succeeded
    - tools_kube_config is succeeded
  # It holds the cluster admin key: keep it out of output and errors.
  no_log: true
  block:
    - name: Parse the current $HOME/.kube/config
      ansible.builtin.set_fact:
        tools_kubeconfig_old: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'HOME') ~ '/.kube/config', errors='ignore') | from_yaml }}"
      no_log: true
  rescue:
    - name: Treat an unparsable $HOME/.kube/config as empty
      ansible.builtin.set_fact:
        tools_kubeconfig_old: {}

- name: Write kubeconfig to $HOME/.kube/config
  ansible.builtin.copy:
    content: "{{ tools_kubeconfig_new }}"
    dest: "$HOME/.kube/config"
    mode: "0600"
  diff: false
  # As in the k3s role: only when the cluster or its admin credentials
  # differ, so local kubectl edits survive.
  when:
    - tools_cp_facts is succeeded
    - tools_kube_config is succeeded
    - >-
      tools_kubeconfig_old is not mapping
      or tools_kubeconfig_old.get('clusters') != (tools_kubeconfig_new | from_yaml).clusters
      or tools_kubeconfig_old.get('users') != (tools_kubeconfig_new | from_yaml).users
  vars:
    tools_kubeconfig_new: "{{ tools_kube_config.stdout | regex_replace('https://127\\.0\\.0\\.1:6443', 'https://' ~ k3s_api_name ~ ':6443') }}"
