# Kernel command line for GRUB; root= is added by GRUB itself.
rk1_os_cmdline: >-
  rootwait rw console=ttyS9,115200 console=tty1
  cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory

# Seconds the GRUB menu waits; it shows on the UART (tpi uart).
rk1_os_grub_timeout: 3

# Packages from the archived ubuntu-rockchip PPA (and what they alone
# pulled in), purged once the node is on the target release. dpkg-query
# glob patterns. Any of them installed marks the vendor layout.
rk1_os_vendor_packages:
  - "linux-*rockchip*"
  - "u-boot-turing-*"
  - "ubuntu-rockchip-settings*"
  - ubuntu-server-rockchip
  - rockchip-firmware
  - rockchip-multimedia-config
  - "libmali-*"
  - "mali-*-firmware"
  - "camera-engine-rkaiq*"

# Generic Ubuntu packages that ubuntu-server-rockchip recommended, purged
# with the vendor packages as the RK1 needs none of them; drop one to keep
# it. apt marks a removed metapackage's dependencies manual, so autoremove
# keeps them unless they are named here. Package names, not patterns.
# Stock images ship some of them, so they do not mark the vendor layout.
rk1_os_vendor_extra_packages:
  - bluez
  - fake-hwclock
  - mtd-utils
  - rfkill
  - u-boot-tools

# Ubuntu packages to keep (mark manually installed) when the vendor
# packages that pulled them in are purged.
rk1_os_keep_packages:
  - openssh-server
  - nfs-common
  - open-iscsi
  - libv4l-0t64
  - libv4lconvert0t64

# The vendor purge and the final autoremove stop if a dry run would
# remove any of these.
rk1_os_protected_packages:
  - openssh-server
  - nfs-common
  - open-iscsi
  - cloud-init
  - sudo
  - systemd
  - netplan.io
  - ubuntu-server
  - linux-generic
  - grub-efi-arm64
  - "linux-image-{{ ansible_facts.kernel }}"
