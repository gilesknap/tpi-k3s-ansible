# Confirm-or-revert for changes to the OpenWrt router, used by
# pb_router.yml. See docs/how-to/router-recovery.md, "Change the router
# safely".

# Seconds the router waits, after the guard is armed, for the change to be
# confirmed. Unconfirmed, it restores the snapshot taken just before and
# reboots.
router_guard_timeout: 300
# The snapshot, the watchdog's pid file and the lock against arming twice.
# The router's /tmp is RAM: a reboot clears it.
router_guard_dir: /tmp/router-guard

# The change, as a task file of this role (tasks/<name>.yml), run between
# arming and the checks. Empty for none: the play then only arms, checks
# and disarms.
router_change_tasks: ""

# The checks: a public HTTPS URL the controller must reach, and a public
# name the router's DNS must answer.
router_check_url: https://github.com
router_check_name: github.com

# The LAN's DNS domain, served by the router's dnsmasq: each reserved
# host resolves as <name>.lan. local_domain (group_vars/all.yml) without
# its leading dot.
router_dns_domain: "{{ local_domain | trim('.') }}"
# --tags change -e router_change_tasks=dhcp pushes the rendered
# /etc/config/dhcp when it differs; --tags dhcp-diff sets this false and
# only shows the diff.
router_dhcp_apply: true
