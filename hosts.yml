# main ansible execution environment
# The controller is typically the developer container that comes with this repo
controller:
  hosts:
    localhost:
      ansible_connection: local

# this section lists the BMC DNS name for each turing pi
turing_pis:
  hosts:
    turingpi:
  # turingpi2:
  vars:
    ansible_user: "{{ tpi_user }}"

# node names for nodes in turingpi
turingpi_nodes:
  # slot 1 is not used by the cluster (a CM4 there would be type: pi4).
  hosts:
    node02:
      slot_num: 2
      type: rk1
      # moves the root fs to the nvme drive
      root_dev: /dev/nvme0n1
    node03:
      slot_num: 3
      type: rk1
      root_dev: /dev/nvme0n1
    node04:
      slot_num: 4
      type: rk1
      root_dev: /dev/nvme0n1
  # example second turing pi
  #  turingpi2_nodes:
  #    hosts:
  #      node05:
  #        slot_num: 1
  #        type: rk1
  vars:
    ansible_user: "{{ ansible_account }}"

# Additional nodes that are not in a turing pi.
# OS pre-installed and pb_add_nodes.yml run to add them to ansible control.
# For nodes with an NVIDIA GPU, set nvidia_gpu_node: true — this installs
# the NVIDIA container toolkit and configures containerd so GPU pods work.
# For nodes with an Intel iGPU, set intel_gpu_node: true — this labels the
# node so the Intel GPU device plugin advertises gpu.intel.com/i915.
# For nodes whose power button gets pressed by accident, set
# power_key_ignore: true — a short press then does nothing, and holding the
# button for about 4 seconds still cuts the power.
# Hosts installed from the install stick (scripts/make-install-stick, see
# docs/how-to/install-stick.md) set:
#   install_profile: server, or desktop (ubuntu-desktop-minimal on top of server)
#   install_disk_serial: the OS disk's serial (lsblk -o NAME,SIZE,MODEL,SERIAL);
#     the install erases this whole disk, and refuses unless exactly one
#     disk has this serial
#   install_disk_model: optional; the OS disk's model as lsblk shows it,
#     checked as well
#   install_machine_macs: the host's NIC MACs (cat /sys/class/net/*/address);
#     the install refuses unless one is present, so the entry cannot run on
#     another machine. Never list a USB network dongle's MAC: it moves.
#   install_ansible_uid: optional; the ansible account's uid, to match its
#     home directory on a disk the install keeps (nuc2's /home)
# extra_mounts lists a node's other fstab mounts (path, src, fstype, opts);
# see roles/k8s_data_dirs/tasks/mounts.yml.
extra_nodes:
  hosts:
    ws03:
      nvidia_gpu_node: true # installs NVIDIA container toolkit
      workstation: true # taint NoSchedule — only GPU + monitoring pods
    nuc2:
      node_ip: 192.168.1.92 # multi-homed: force K3s to use this subnet
      intel_gpu_node: true # Iris Xe: runs the Intel GPU device plugin
      power_key_ignore: true # a short press of the power button does nothing
      install_profile: server
      install_disk_serial: S5GXNF0RA03936L # nvme0n1; never the 870 QVO (/home) or the Crucial X6
      install_disk_model: Samsung SSD 980 PRO 1TB
      install_machine_macs: ["54:b2:03:fd:53:1c", "48:21:0b:31:f0:89"] # enp3s0, enp2s0
      install_ansible_uid: 1001 # owns /home/ansible on the 870 QVO
      extra_mounts: # restored by the k8s_data_dirs role (--tags servers)
        - path: /home # the 870 QVO: holds /home/k8s-data
          src: /dev/disk/by-uuid/0a1a1663-21e8-4bae-83af-c1c596f9efec
          fstype: auto
          opts: nosuid,nodev,nofail,x-gvfs-show
        - path: /mnt/backup # the Crucial X6, mounted by hand
          src: /dev/disk/by-id/usb-Micron_Crucial_X6_SSD_2143E4A033DD-0:0-part1
          fstype: auto
          opts: nosuid,nodev,nofail,noauto,x-gvfs-show
    nuc1: # amd64 worker, single NIC (192.168.1.91)
      power_key_ignore: true
      install_profile: desktop # backup desktop: GNOME, NetworkManager
      install_disk_serial: S5GFNG0N302036V # sda, its only disk
      install_disk_model: Samsung SSD 860 EVO M.2 250GB
      install_machine_macs: ["1c:69:7a:61:65:d4"] # eno1
  vars:
    ansible_user: "{{ ansible_account }}"

all_nodes:
  children:
    turingpi_nodes:
    # turinpi2_nodes:
    extra_nodes:

# The NAS (QNAP TS-253D, Ubuntu Server + ZFS), configured by pb_nas.yml
# only. It is NOT a k3s node: keep it out of all_nodes, turing_pis and every
# other group a play in pb_all.yml, pb_add_nodes.yml or pb_decommission.yml
# targets (the nas role refuses to run on a host that is in all_nodes).
nas:
  hosts:
    gknas:
      power_key_ignore: true # a short press of the power button does nothing
      install_profile: server
      # The Fanxiang 256 GB NVMe in the PCIe slot (nvme0n1); never the DOM,
      # the data SSDs or the LaCie. Back in its old JMicron USB enclosure it
      # would show the enclosure's serial and model instead, and not match.
      install_disk_serial: "26100800643000458"
      install_disk_model: Fanxiang S500Pro 256GB
      install_machine_macs: ["24:5e:be:47:a3:05", "24:5e:be:47:a3:04"] # enp3s0, enp2s0
  vars:
    ansible_user: "{{ ansible_account }}"
