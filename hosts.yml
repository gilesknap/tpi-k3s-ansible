# main ansible execution environment
# The controller is typically the developer container that comes with this repo
controller:
  hosts:
    localhost:
      ansible_connection: local

# this section lists the BMC DNS name for each turing pi
turing_pis:
  hosts:
    turingpi:
  # turingpi2:
  vars:
    ansible_user: "{{ tpi_user }}"

# node names for nodes in turingpi
turingpi_nodes:
  hosts:
    node01: # CM4
      slot_num: 1
      type: pi4
    node02:
      slot_num: 2
      type: rk1
      # moves the root fs to the nvme drive
      root_dev: /dev/nvme0n1
    node03:
      slot_num: 3
      type: rk1
      root_dev: /dev/nvme0n1
    node04:
      slot_num: 4
      type: rk1
      root_dev: /dev/nvme0n1
  # example second turing pi
  #  turingpi2_nodes:
  #    hosts:
  #      node05:
  #        slot_num: 1
  #        type: rk1
  vars:
    ansible_user: "{{ ansible_account }}"

# Additional nodes that are not in a turing pi.
# OS pre-installed and pb_add_nodes.yml run to add them to ansible control.
# For nodes with an NVIDIA GPU, set nvidia_gpu_node: true — this installs
# the NVIDIA container toolkit and configures containerd so GPU pods work.
# For nodes with an Intel iGPU, set intel_gpu_node: true — this labels the
# node so the Intel GPU device plugin advertises gpu.intel.com/i915.
extra_nodes:
  hosts:
    ws03:
      nvidia_gpu_node: true # installs NVIDIA container toolkit
      workstation: true # taint NoSchedule — only GPU + monitoring pods
    nuc2:
      node_ip: 192.168.1.92 # multi-homed: force K3s to use this subnet
      flannel_iface: enp3s0 # interface carrying node_ip
      intel_gpu_node: true # Iris Xe: runs the Intel GPU device plugin
    nuc1: # amd64 worker, single NIC (192.168.1.91)
  vars:
    ansible_user: "{{ ansible_account }}"

all_nodes:
  children:
    turingpi_nodes:
    # turinpi2_nodes:
    extra_nodes:
