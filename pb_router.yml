# The OpenWrt router (dns_router in group_vars/all.yml). It has no Python,
# so this runs on the controller and reaches the router with plain ssh, as
# `just k3s-api-dns` does: your own ssh setup must log in to dns_router.
#
#   ansible-playbook pb_router.yml --tags restore -e router_restore_file=<file>
#
# <file> is a backup already decrypted with the offline age key, e.g.
# `age -d -i <key> router-<time>.tar.gz.age > router.tar.gz`. The restore
# lists the files, asks before going on, unpacks them over the router's
# own with `sysupgrade -r`, then reboots the router and waits for SSH.
# See docs/how-to/router-recovery.md.

- name: Restore the router's configuration from a backup
  hosts: localhost
  gather_facts: false
  tags: restore
  vars:
    router_host: "{{ dns_router.split('@') | last }}"
    router_restore_path: "{{ router_restore_file | realpath }}"
  tasks:
    - name: Check a backup file was given
      ansible.builtin.assert:
        that: router_restore_file is defined
        fail_msg: Give the decrypted backup with -e router_restore_file=<file>
        quiet: true

    - name: List the files in the backup
      ansible.builtin.shell:
        cmd: set -o pipefail && gzip -dc {{ router_restore_path | quote }} | tar -t
        executable: /bin/bash
      register: router_restore_list
      changed_when: false

    - name: Confirm the restore
      ansible.builtin.pause:
        prompt: |-
          {{ router_restore_list.stdout }}

          These {{ router_restore_list.stdout_lines | length }} files replace their copies on {{ dns_router }},
          which then reboots: the whole house loses the internet for a minute or two.
          Press Enter to restore, or Ctrl+C then A to abort

    # sysupgrade reads the archive from stdin with `-`, so nothing needs
    # scp or a copy in the router's /tmp.
    - name: Restore the backup on the router
      ansible.builtin.shell:
        cmd: ssh -o BatchMode=yes {{ dns_router | quote }} 'sysupgrade -r -' < {{ router_restore_path | quote }}
      changed_when: true

    - name: Reboot the router
      ansible.builtin.command:
        cmd: ssh -o BatchMode=yes {{ dns_router | quote }} reboot
      changed_when: true

    - name: Wait for the router to go down
      ansible.builtin.wait_for:
        host: "{{ router_host }}"
        port: 22
        state: stopped
        timeout: 120

    - name: Wait for SSH on the router to come back
      ansible.builtin.wait_for:
        host: "{{ router_host }}"
        port: 22
        delay: 10
        timeout: 300
