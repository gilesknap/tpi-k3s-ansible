repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^uv.lock
      - id: check-yaml
        args: ["-m"]
        exclude: ^kubernetes-services/(templates/|additions/.*/templates/)
      - id: check-merge-conflict
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: uv-sync
        name: update uv.lock and venv
        pass_filenames: false
        language: system
        entry: uv sync
        files: ^(uv\.lock|pyproject\.toml)$

  - repo: local
    hooks:
      - id: ansible-lint
        name: ansible-lint
        pass_filenames: false
        language: system
        entry: uv run ansible-lint
        files: \.(yml|yaml)$

  - repo: local
    hooks:
      - id: age-recipient
        name: off-site and etcd backups use one age key
        pass_filenames: false
        language: system
        entry: uv run scripts/check-age-recipient
        files: ^(group_vars/all\.yml|kubernetes-services/values\.yaml)$

  - repo: local
    hooks:
      - id: no-destroy
        name: no Ansible destroys stored data
        pass_filenames: false
        language: system
        entry: uv run scripts/check-no-destroy
        files: \.(ya?ml|j2)$|^roles/[^/]+/(files|templates)/|^scripts/(test-)?check-no-destroy$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
