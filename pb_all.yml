- name: Install client tools in execution environment
  hosts: localhost
  roles:
    - role: tools
  tags: tools

- name: Bare metal provisioning of turing_pi nodes
  hosts: turing_pis
  gather_facts: false
  roles:
    - role: flash
      when: do_flash
  tags: flash

- name: Make sure known_hosts is up to date
  hosts: all_nodes, turing_pis
  # only gather facts after the nodes are added to known_hosts
  gather_facts: false
  roles:
    - role: known_hosts
  tags: known_hosts

- name: Move the root filesystem to its target device
  hosts: all_nodes # all nodes in all turing pi groups and outside
  roles:
    - role: move_fs
  become: true
  tags: servers

# RK1 only: converts a node still on the archived ubuntu-rockchip vendor
# layout to stock Ubuntu (generic kernel, U-Boot -> EFI -> GRUB). A node
# installed by flash and move_fs already is stock Ubuntu and is skipped.
# One node at a time, as a conversion drains and reboots the node.
- name: Convert RK1 nodes to stock Ubuntu
  hosts: all_nodes
  # The role gathers the facts it needs on RK1 nodes only.
  gather_facts: false
  serial: 1
  roles:
    - role: rk1_os
  become: true
  tags: [servers, rk1_os]

- name: Update all nodes in preparation for k3s
  hosts: all_nodes # all nodes in all turing pi groups and outside
  roles:
    - role: update_packages
    # Creates /home/k8s-data/* (nuc2) and /var/lib/k8s-data/* (RK1s).
    # These back the local-nvme PVs and are preserved across rebuilds
    # by pb_decommission.yml — see roles/k8s_data_dirs/tasks/main.yml.
    # Its own tag runs only this role, e.g. for a PV moved to a new node.
    - role: k8s_data_dirs
      tags: k8s_data_dirs
  become: true
  tags: servers

# Only with -e reboot_now=true: drains, reboots and uncordons each node
# that update_packages found needing a reboot, one node at a time.
# Otherwise every host is skipped without being contacted, and kured
# reboots the nodes in its nightly window. Workstations are never
# rebooted. See docs/explanations/upgrade-model.md.
- name: Reboot nodes that need it, one at a time
  hosts: all_nodes
  gather_facts: false
  serial: 1
  tasks:
    - name: Drain, reboot and uncordon the node
      ansible.builtin.include_role:
        name: node_reboot
      vars:
        node_reboot_msg: Rebooting after update_packages (reboot_now)
      when: update_packages_reboot_pending | default(false) | bool
  become: true
  tags: servers

- name: Install or update k3s control plane and workers
  hosts: all_nodes # all nodes in all turing pi groups and outside
  roles:
    - role: k3s
    # Nightly encrypted etcd snapshot + token to the NAS (systemd timer,
    # so it works when the API server does not). Control plane only.
    - role: etcd_backup
      when: inventory_hostname == control_plane
      tags: etcd_backup
  become: true
  tags: k3s

- name: Install cluster services
  hosts: localhost
  roles:
    - role: cluster
  tags: cluster

- name: Manage Claude sandbox's pub key on the ansible account
  hosts: all_nodes
  gather_facts: false
  tasks:
    - name: Add or remove Claude pubkey from ansible user authorized_keys
      ansible.posix.authorized_key:
        user: "{{ ansible_account }}"
        state: "{{ claude_pubkey_state | default('present') }}"
        key: "{{ lookup('file', claude_ansible_pubkey_path | default('/root/.config/claude-ssh/id_ed25519.pub')) }}"
        comment: claude-sandbox
  tags: claude_key
