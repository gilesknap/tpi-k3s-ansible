# claude-sandbox.conf — this repo's sandbox configuration.
#
# postCreate.sh copies this file to /etc/claude-sandbox.conf after running
# the upstream installer, and the claude shadow reads it from there at
# every launch. Edit here and rebuild the devcontainer (or re-apply with
# `just sandbox-conf`) to change it — a `claude-sandbox update` restores
# the upstream defaults and drops these settings until re-applied.
#
# Read from /etc, not the workspace: the workspace is bound rw into the
# sandbox, so a per-workspace conf could be rewritten by a compromised
# session to widen the next launch's binds — or its network reach.
#
# Environment variables take precedence over values set here, so shell or
# CI overrides still work: CLAUDE_SANDBOX_NO_FORGE=1 claude, etc.
#
# Full key reference:
# https://diamondlightsource.github.io/claude-sandbox/reference/configuration.html

# ── workspace-root ────────────────────────────────────────────────────
# The read-write workspace directory bound into the sandbox. Upstream
# defaults to $PWD; we widen it to the whole /workspaces tree because
# devcontainer.json mounts the parent of this repo there so peer projects
# are editable from one session.
workspace-root = /workspaces

# ── allow-write ───────────────────────────────────────────────────────
# Extra read-write binds, one path per line. /cache holds the uv venv,
# the uv/pre-commit caches, and the python interpreter this repo runs on.
allow-write = /cache

# ── allow-ip ──────────────────────────────────────────────────────────
# The egress jail blackholes all RFC1918 addresses so a prompt-injected
# session cannot pivot into the LAN. Every cluster host has to be punched
# back through it by bare IP, or ansible, ssh and kubectl stop working
# from inside the sandbox. Keep this list in step with hosts.yml.
allow-ip = 192.168.1.80 # turingpi BMC
allow-ip = 192.168.1.81 # node01 — also the K3s API server (:6443)
allow-ip = 192.168.1.82 # node02
allow-ip = 192.168.1.83 # node03
allow-ip = 192.168.1.84 # node04
allow-ip = 192.168.1.92 # nuc2
allow-ip = 192.168.1.10 # ws03
